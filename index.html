      '<div class="stack" id="scPick"><label class="scan-drop" id="scDrop">' + (shotMode ? ICON.shot : ICON.camera) + '<strong>' + T(K.pick) + '</strong><small class="fine-pointer-only">' + T('scan.pickSub') + '</small>' +
      '<input type="file" accept="image/*" id="scFile" class="visually-hidden"></label>' +
      '<button type="button" class="btn-secondary block" data-action="sc-paste">' + ICON.paste + '<span>' + T('scan.paste') + '</span></button></div>' +
      '<div class="scan-status" id="scStatus" hidden><img class="scan-thumb" id="scThumb" alt="' + T(K.thumb) + '">' +
      '<div class="scan-info"><span class="scan-text" id="scText" aria-live="polite"></span><div class="bar-track" id="scTrack"><div class="bar-fill" id="scBar" style="width:0%"></div></div>' +
      '<button type="button" class="btn-secondary" data-action="sc-skip">' + T('scan.skip') + '</button></div></div>' +
      '<p class="field-hint">' + T(K.privacy) + '</p></div>' +
      '<div class="stack" id="scStmt" hidden>' +
      '<p class="notice">' + T('stmt.hint') + '</p>' +
      '<div class="field"><div class="field-label-row"><label class="field-label" for="stText">' + T('stmt.label') + '</label>' +
      '<button type="button" class="text-action-btn accent" data-action="sc-paste">' + T('catat.paste') + '</button></div>' +
      '<textarea id="stText" class="ob-input" rows="6" spellcheck="false" placeholder="' + T('stmt.ph') + '"></textarea><span class="field-error" id="stErr"></span></div>' +
      '<button type="button" class="btn-secondary block" data-action="st-parse">' + T('stmt.parse') + '</button>' +
      '<div id="stReview"></div></div>';
    const entry = openSheet({
      id: 'scan', title: t(K.title), body, foot: '', cls: 'scan' + (shotMode ? ' shot' : ''),
      onClose: () => cancelOcr(),
      actions: {
        'sc-mode': (el) => { sc.mode = el.dataset.mode === 'statement' ? 'statement' : 'photo'; drawMode(); },
        'sc-skip': () => skipOcr(),
        'sc-paste': () => pasteFromClipboard(entry),
        'st-parse': () => parseStmt(),
        'st-toggle-all': () => { const allOn = sc.items.every((i) => i.on); sc.items.forEach((i) => { i.on = !allOn; }); drawReview(); },
        'st-type': (el) => {
          const it = sc.items[Number(el.dataset.idx)];
          if (!it) return;
          it.type = it.type === 'INCOME' ? 'EXPENSE' : 'INCOME';
          it.category = catFor(it.title, it.type);
          drawReview();
        },
        'st-wallet': (el) => { sc.walletId = el.dataset.id; drawReview(); },
        'st-save': () => saveStmt()
      }
    });

    function drawMode() {
      const modes = entry.q('#scModes');
      if (modes) modes.innerHTML = [['photo', 'scan.modePhoto'], ['statement', 'scan.modeStatement']].map((m) => {
        const on = sc.mode === m[0];
        return '<button type="button" class="ob-seg-btn' + (on ? ' active' : '') + '" role="tab" aria-selected="' + on + '" data-action="sc-mode" data-mode="' + m[0] + '">' + T(m[1]) + '</button>';
      }).join('');
      entry.q('#scPhoto').hidden = sc.mode !== 'photo';
      entry.q('#scStmt').hidden = sc.mode !== 'statement';
      drawFoot();
    }
    // Overall progress never goes backwards: preparing the engine fills 0-40%, reading 40-100%.
    // While nothing is measurable yet the bar shimmers instead of sitting at 0%.
    let shownPct = 0;
    function setProgress(key, pct) {
      shownPct = Math.max(shownPct, Math.max(0, Math.min(100, pct)));
      const el = entry.q('#scText');
      if (el) el.textContent = t(key, { pct: shownPct });
      const bar = entry.q('#scBar');
      if (bar) bar.style.width = shownPct + '%';
      const track = entry.q('#scTrack');
      if (track) track.classList.toggle('indeterminate', shownPct <= 0);
    }

    async function startOcr(file) {
      if (!file || !/^image\//.test(file.type || '')) { toast(t('scan.notImage'), { type: 'error' }); return; }
      cancelOcr();
      sc.mode = 'photo';
      drawMode();
      const url = URL.createObjectURL(file);
      const job = { url, worker: null, handedOff: false, screenshot: shotMode };
      ocrJob = job;
      entry.q('#scPick').hidden = true;
      entry.q('#scStatus').hidden = false;
      entry.q('#scThumb').src = url;
      shownPct = 0;
      setProgress(K.loading, 0);
      const res = await ocrRead(job, file, K, setProgress);
      if (!res || job !== ocrJob) return;
      finishOcr(job, res.text, res.failKey);
    }
    // one message, in the next sheet, saying what actually happened (no toast over the sheet header)
    function finishOcr(job, text, failKey) {
      job.handedOff = true;
      ocrJob = null;
      closeSheet(entry, true);
      openFromRead({ text, failKey, previewUrl: job.url, origin: shotMode ? 'screenshot' : 'photo' });
    }
    function skipOcr() {
      const job = ocrJob;
      if (!job) return;
      ocrJob = null;
      terminateWorker(job);
      job.handedOff = true;
      closeSheet(entry, true);
      openFromRead({ text: '', failKey: 'skip', previewUrl: job.url, origin: shotMode ? 'screenshot' : 'photo' });
    }
    // Text from the clipboard: a payment screen opens the transaction sheet, anything else is read as a statement.
    // In the statement tab it always fills the statement box.
    function takeText(text) {
      const clean = String(text == null ? '' : text).replace(/\r\n?|[\u2028\u2029\u0085]/g, '\n').trim();
      if (sc.mode !== 'statement') {
        const r = screenFromText(clean, true);
        if (r || shotMode) {
          cancelOcr();
          closeSheet(entry, true);
          if (r) openFromRead({ text: clean, origin: 'text', result: r }); else routeText(clean);
          return;
        }
        sc.mode = 'statement';
        drawMode();
      }
      entry.q('#stText').value = clean;
      parseStmt();
    }

    function parseStmt() {
      const txt = entry.q('#stText').value;
      const err = entry.q('#stErr');
      err.textContent = '';
      if (!txt.trim()) { err.textContent = t('stmt.empty'); focusEl(entry.q('#stText')); return; }
      const rows = safe(() => Core.parseStatement(txt, { currency: cur(), today }), []);
      const valid = (Array.isArray(rows) ? rows : []).filter((r) => r && num(r.amount) > 0);
      if (!valid.length) { err.textContent = t('stmt.none'); sc.items = []; drawReview(); return; }
      sc.items = valid.map((r) => {
        const type = r.type === 'INCOME' ? 'INCOME' : 'EXPENSE';
        const title = clampStr(r.title, 80) || t('type.' + type);
        return { type, amount: roundAmt(r.amount), dayKey: isDayKey(r.dayKey) ? r.dayKey : today, title, category: catFor(title, type), on: true, dup: false };
      });
      sc.items.forEach((it) => {
        it.dup = state.transactions.some((x) => x.type === it.type && Math.abs(num(x.amount) - it.amount) < 0.005 && String(x.date).slice(0, 10) === it.dayKey);
        if (it.dup) it.on = false;
      });
      drawReview();
    }
    function reviewRow(it, i) {
      const opts = catList(it.type).map((c) => '<option value="' + esc(c.id) + '"' + (c.id === it.category ? ' selected' : '') + '>' + esc(catLabel(c.id)) + '</option>').join('');
      return '<div class="review-row' + (it.on ? '' : ' off') + '" data-row="' + i + '">' +
        '<input type="checkbox" data-st-check="' + i + '"' + (it.on ? ' checked' : '') + ' aria-label="' + T('stmt.rowAria', { title: it.title }) + '">' +
        '<div class="review-main"><div class="review-top"><span class="review-title">' + esc(it.title) + '</span>' +
        '<span class="review-amt ' + (it.type === 'INCOME' ? 'val-inc' : 'val-exp') + '">' + esc(it.type === 'INCOME' ? fmtSigned(it.amount) : fmt(-it.amount)) + '</span></div>' +
        '<div class="review-meta"><span>' + esc(dayLabel(it.dayKey)) + '</span>' +
        '<button type="button" class="type-toggle' + (it.type === 'INCOME' ? ' inc' : '') + '" data-action="st-type" data-idx="' + i + '" aria-label="' + T('stmt.typeAria', { title: it.title }) + '">' + T('type.' + it.type) + '</button>' +
        '<span class="cat-chip"><span class="cat-chip-text" aria-hidden="true">' + esc(catLabel(it.category)) + '</span>' +
        '<select data-st-cat="' + i + '" aria-label="' + T('stmt.catAria', { title: it.title }) + '">' + opts + '</select></span>' +
        (it.dup ? '<span class="dup-tag">' + T('stmt.dup') + '</span>' : '') + '</div></div></div>';
    }
    function drawReview() {
      const box = entry.q('#stReview');
      if (!sc.items.length) { box.innerHTML = ''; drawFoot(); return; }
      const w = walletById(sc.walletId);
      if (!w || w.archived) sc.walletId = defaultWalletId();
      const allOn = sc.items.every((i) => i.on);
      box.innerHTML = '<div class="stack">' +
        '<div class="section-bar"><span>' + T('stmt.found', { n: sc.items.length }) + '</span><button type="button" class="text-action-btn" data-action="st-toggle-all">' + T(allOn ? 'stmt.selectNone' : 'stmt.selectAll') + '</button></div>' +
        '<div class="field"><span class="field-label" id="stWalletL">' + T('stmt.wallet') + '</span><div class="chip-row" role="radiogroup" aria-labelledby="stWalletL">' + walletChips(activeWallets(), sc.walletId, 'st-wallet') + '</div></div>' +
        '<div class="review-list">' + sc.items.map(reviewRow).join('') + '</div></div>';
      drawFoot();
    }
    function drawFoot() {
      if (sc.mode !== 'statement' || !sc.items.length) { entry.foot.innerHTML = ''; return; }
      const n = sc.items.filter((i) => i.on).length;
      entry.foot.innerHTML = '<button type="button" class="btn-primary" data-action="st-save"' + (n ? '' : ' disabled') + '>' + T('stmt.saveSel', { n }) + '</button>';
    }
    function saveStmt() {
      const chosen = sc.items.filter((i) => i.on);
      if (!chosen.length) return;
      const w = walletById(sc.walletId);
      if (!w || w.archived) { toast(t('err.wallet'), { type: 'error' }); return; }
      const created = stamp();
      const txs = chosen.map((it) => ({
        id: Core.uid(), type: it.type, amount: it.amount, walletId: w.id, toWalletId: null, goalId: null,
        category: catValid(it.category, it.type) ? it.category : catDefault(it.type),
        title: it.title, note: '', date: it.dayKey + 'T12:00', source: 'STATEMENT', createdAt: created
      }));
      if (!commit((s) => { s.transactions.push(...txs); })) return;
      closeSheet(entry);
      switchTab('home');
      celebrate(t('stmt.saved', { n: txs.length }), w.name);
      if (typeof opts.onSaved === 'function') { try { opts.onSaved(txs); } catch (e) { console.error(e); } }
    }

    entry.layer.addEventListener('change', (e) => {
      const el = e.target;
      if (el.id === 'scFile') {
        const file = el.files && el.files[0];
        el.value = '';
        if (file) startOcr(file);
        return;
      }
      if (el.hasAttribute('data-st-check')) {
        const it = sc.items[Number(el.getAttribute('data-st-check'))];
        if (!it) return;
        it.on = el.checked;
        const row = el.closest('.review-row');
        if (row) row.classList.toggle('off', !it.on);
        const tog = entry.q('[data-action="st-toggle-all"]');
        if (tog) tog.textContent = t(sc.items.every((i) => i.on) ? 'stmt.selectNone' : 'stmt.selectAll');
        drawFoot();
        return;
      }
      if (el.hasAttribute('data-st-cat')) {
        const it = sc.items[Number(el.getAttribute('data-st-cat'))];
        if (it) it.category = el.value;
        const shown = el.parentElement && el.parentElement.querySelector('.cat-chip-text');
        if (shown) shown.textContent = catLabel(el.value);
      }
    });
    entry.startOcr = startOcr;
    entry.takeText = takeText;
    entry.parseStmt = parseStmt;
    entry.mode = () => sc.mode;
    drawMode();
    return entry;
  }

  // Images arriving by the Catat picker, Tempel, paste or drag-drop
  function canTakeImage() {
    if (!$('onboarding').hidden) return false;
    const top = topSheet();
    return !top || top.id === 'scan';
  }
  function routeImage(file, variant) {
    if (!canTakeImage()) return;
    const top = topSheet();
    if (top && top.id === 'scan') { top.startOcr(file); return; }
    const entry = openScanSheet('photo', { screenshot: variant === 'screenshot' });
    if (entry) entry.startOcr(file);
  }
  // Text arriving in the Catat tab (Tempel): a payment screen -> transaction sheet; a bank statement -> the
  // Mutasi reader; anything else goes into the Catat box like typed text.
  function routeText(text) {
    const clean = String(text == null ? '' : text).replace(/\r\n?|[\u2028\u2029\u0085]/g, '\n').trim();
    if (!clean) return;
    const r = screenFromText(clean, true);
    if (r) { openFromRead({ text: clean, origin: 'text', result: r }); return; }
    // dated rows ("01/10 ..."), or rows on different days in other layouts; an undated list stays in the box
    const rows = safe(() => Core.parseStatement(clean, { currency: cur(), today }), []).filter((x) => x && num(x.amount) > 0);
    const days = new Set(rows.map((x) => x.dayKey));
    if (looksLikeStatement(clean) || (rows.length >= 2 && days.size >= 2)) {
      const entry = openScanSheet('statement');
      if (entry) entry.takeText(clean);
      return;
    }
    const c = $('captionInput');
    c.value = c.value.trim() ? c.value.replace(/\s+$/, '') + '\n' + clean : clean;
    ui.dropped.clear();
    switchTab('catat');
    updatePreview();
  }

  // ---------- Clipboard (Tempel) ----------
  // Browsers only hand the clipboard over on a tap. iOS shows its own "Paste" bubble first; the promise settles
  // when it is tapped (or rejects with NotAllowedError when it is dismissed).
  function clipErr(e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') return 'denied';
    if (n === 'NotSupportedError') return 'unsupported';
    return 'failed';
  }
  const blobText = (b) => (b && typeof b.text === 'function') ? b.text() : new Response(b).text();
  function blobToFile(blob, type) {
    const ext = (String(type).split('/')[1] || 'png').replace(/[^a-z0-9]/gi, '') || 'png';
    try { return new File([blob], 'clipboard.' + ext, { type: blob.type || type }); } catch (_) { return blob.type ? blob : new Blob([blob], { type }); }
  }
  function readClipboard() {
    const cb = navigator.clipboard;
    // called synchronously too: Safari only grants the clipboard inside the tap itself
    const viaText = () => {
      if (!cb || typeof cb.readText !== 'function') return Promise.resolve({ error: 'unsupported' });
      let p;
      try { p = Promise.resolve(cb.readText()); } catch (e) { return Promise.resolve({ error: clipErr(e) }); }
      return p.then((text) => (String(text || '').trim() ? { kind: 'text', text: String(text) } : { kind: 'empty' }), (e) => ({ error: clipErr(e) }));
    };
    if (!cb || typeof cb.read !== 'function') return viaText();
    let pending;
    try { pending = Promise.resolve(cb.read()); } catch (e) { return Promise.resolve({ error: clipErr(e) }); }
    return pending.then(async (items) => {
      const list = Array.from(items || []);
      for (const it of list) {
        const type = Array.from(it.types || []).find((x) => /^image\//.test(x));
        if (type) return { kind: 'image', file: blobToFile(await it.getType(type), type) };
      }
      for (const it of list) {
        if (Array.from(it.types || []).indexOf('text/plain') < 0) continue;
        const text = await blobText(await it.getType('text/plain'));
        if (String(text || '').trim()) return { kind: 'text', text: String(text) };
      }
      return { kind: 'empty' };
    }, (e) => {
      // a refusal stays a refusal; other failures (e.g. no image support) still allow plain text
      const err = clipErr(e);
      return err === 'denied' ? { error: err } : viaText();
    }).catch((e) => ({ error: clipErr(e) === 'denied' ? 'denied' : 'failed' }));
  }
  const CLIP_MSG = { denied: 'clip.denied', unsupported: 'clip.unsupported', failed: 'clip.failed' };
  // entry: the Nota/Mutasi sheet it was tapped in, or null for the Catat tab
  function pasteFromClipboard(entry) {
    // iOS may show its Paste bubble first: no automatic reload while it waits
    setBusy('clipboard', 60000);
    readClipboard().then((res) => {
      try {
        if (entry ? entry.closed : (!$('onboarding').hidden || topSheet())) return;
        if (res.error) { toast(t(CLIP_MSG[res.error] || CLIP_MSG.failed), { type: res.error === 'failed' ? 'error' : undefined, duration: 6500 }); return; }
        if (res.kind === 'empty') { toast(t('clip.empty'), { duration: 4500 }); return; }
        if (res.kind === 'image') { if (entry) entry.startOcr(res.file); else routeImage(res.file, 'screenshot'); return; }
        // the notify URL (just copied in Settings → Notifikasi) is a secret, not a payment: it never becomes a
        // transaction, a backup or a CSV row
        if (Core.push.hasNotifyUrl(res.text)) { toast(t('push.pasteIsUrl'), { duration: 6500 }); return; }
        if (entry) entry.takeText(res.text); else routeText(res.text);
      } finally {
        // what was pasted is in a sheet or the Catat box by now
        clearBusy('clipboard');
      }
    });
  }

  // "Dari screenshot" in the Catat tab: a plain picker (no capture attribute), so iOS offers the photo
  // library with the newest screenshots on top.
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el || el.id !== 'shotFile') return;
    const file = el.files && el.files[0];
    el.value = '';
    if (file) routeImage(file, 'screenshot');
  });
  function imageFromList(list) {
    const arr = list ? Array.from(list) : [];
    for (const it of arr) {
      if (it.kind === 'file' && /^image\//.test(it.type || '')) { const f = it.getAsFile(); if (f) return f; }
      if (it instanceof File && /^image\//.test(it.type || '')) return it;
    }
    return null;
  }
  document.addEventListener('paste', (e) => {
    const cd = e.clipboardData;
    const file = cd ? (imageFromList(cd.items) || imageFromList(cd.files)) : null;
    const top = topSheet();
    if (!file) {
      const target = e.target;
      // a payment screen's text pasted into the Catat box opens the review sheet right away
      if (cd && target && target.id === 'captionInput' && !top && $('onboarding').hidden) {
        const text = cd.getData('text/plain');
        if (Core.push.hasNotifyUrl(text)) { e.preventDefault(); toast(t('push.pasteIsUrl'), { duration: 6500 }); return; }
        const r = screenFromText(text, true);
        if (r) {
          e.preventDefault();
          // the sheet must not hand focus back to the (empty) box when it closes: that would raise the keyboard
          // again over the success check after Simpan
          target.blur();
          openFromRead({ text, origin: 'text', result: r });
        }
      }
      // statement text pasted into the Mutasi box is read at once
      if (target && target.id === 'stText' && top && top.id === 'scan') setTimeout(() => { if (!top.closed) top.parseStmt(); }, 0);
      return;
    }
    if ((top && top.id === 'scan') || (!top && ui.tab === 'catat' && $('onboarding').hidden)) {
      e.preventDefault();
      routeImage(file, top ? null : 'screenshot');
    }
  });
  const hasFiles = (e) => !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0);
  function setDragOver(on) { const top = topSheet(); const z = top && top.id === 'scan' ? top.q('#scDrop') : null; if (z) z.classList.toggle('dragover', on); }
  window.addEventListener('dragover', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = canTakeImage() ? 'copy' : 'none';
    setDragOver(true);
  });
  window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) setDragOver(false); });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    setDragOver(false);
    if (!canTakeImage()) return;
    const files = Array.from(e.dataTransfer.files || []);
    const f = files.find((x) => /^image\//.test(x.type || ''));
    if (!f) { if (files.length) toast(t('scan.notImage'), { type: 'error' }); return; }
    routeImage(f);
  });

  // ---------- Tips: recording from screenshots (Settings) ----------
  function openShotTips() {
    const step = (n, titleHtml, bodyHtml) => '<li class="tip"><span class="tip-num" aria-hidden="true">' + n + '</span><div class="tip-body"><strong>' + titleHtml + '</strong>' + bodyHtml + '</div></li>';
    const body =
      '<div class="notice info">' + T('tips.honest') + '</div>' +
      '<ol class="tip-list">' +
      step(1, T('tips.s1Title'), '<p>' + T('tips.s1') + '</p>') +
      step(2, T('tips.s2Title'), '<p>' + T('tips.s2') + '</p>') +
      step(3, T('tips.s3Title'), '<p>' + T('tips.s3') + '</p><ol class="tip-steps"><li>' + T('tips.s3a') + '</li><li>' + T('tips.s3b') + '</li><li>' + T('tips.s3c') + '</li></ol><p>' + T('tips.s3d') + '</p>') +
      // bank e-mails through a Mail automation (with "Titip isi transaksi di notifikasi", no Tempel needed)
      step(4, T('tips.s4Title'), '<p>' + T('tips.s4') + '</p><ol class="tip-steps">' +
        [T('tips.s4a'), T('tips.s4b'), T('tips.s4c'), T('tips.s4d'), T('tips.s4e'), T('tips.s4f')].map((h) => '<li>' + h + '</li>').join('') + '</ol>' +
        '<p class="field-hint">' + T('tips.s4note') + '</p>') +
      '</ol>' +
      '<p class="field-hint">' + T('tips.privacy') + '</p>';
    const entry = openSheet({
      id: 'tips', title: t('tips.title'), body,
      foot: '<button type="button" class="btn-primary" data-action="tips-try">' + ICON.shot + '<span>' + T('tips.try') + '</span></button>',
      actions: {
        'tips-try': () => {
          closeAllSheets();
          switchTab('catat');
          const card = document.querySelector('.shot-card');
          if (card) { card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse'); }
        }
      }
    });
    return entry;
  }

  // ---------- Voice (Web Speech API, built into the browser) ----------
  let recog = null;
  function stopVoice() {
    if (!recog) return;
    try { recog.stop(); } catch (_) { try { recog.abort(); } catch (__) { /* ignore */ } }
  }
  function toggleVoice() {
    const input = $('captionInput');
    if (!SR) { toast(t('voice.unsupported'), { duration: 5000 }); focusEl(input); return; }
    if (recog) { stopVoice(); return; }
    let r;
    try { r = new SR(); } catch (_) { toast(t('voice.err.generic'), { type: 'error' }); focusEl(input); return; }
    r.lang = lang() === 'en' ? 'en-US' : 'id-ID';
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;
    const base = input.value.trim();
    r.onstart = () => { ui.recording = true; setVoiceUI(); updatePreview(); };
    r.onresult = (e) => {
      // results that arrive after the text was saved (Chrome sends a final one after stop) are ignored
      if (r.saved) return;
      let txt = '';
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      txt = txt.trim();
      input.value = base && txt ? base + '\n' + txt : (base || txt);
      ui.dropped.clear();
      updatePreview();
    };
    r.onerror = (e) => {
      const code = e && e.error;
      if (code === 'aborted') return;
      const map = {
        'not-allowed': 'voice.err.notAllowed', 'service-not-allowed': 'voice.err.notAllowed',
        'network': 'voice.err.network', 'no-speech': 'voice.err.noSpeech',
        'audio-capture': 'voice.err.audioCapture', 'language-not-supported': 'voice.err.language'
      };
      toast(t(map[code] || 'voice.err.generic'), { type: 'error', duration: 5500 });
    };
    r.onend = () => {
      if (recog === r) recog = null;
      ui.recording = false;
      setVoiceUI();
      updatePreview();
      // "save" pressed (Ctrl/Cmd+Enter) while still listening: save once the final words are in
      if (ui.commitAfterStop) { ui.commitAfterStop = false; commitVoice(); }
    };
    recog = r;
    try { r.start(); } catch (_) {
      recog = null;
      ui.recording = false;
      setVoiceUI();
      toast(t('voice.err.generic'), { type: 'error' });
    }
  }
  function resetCaption() {
    // still listening: drop what the recognizer has not delivered yet (stop() would still send a final result
    // and write the cleared words back)
    ui.commitAfterStop = false;
    if (recog) { recog.saved = true; try { recog.abort(); } catch (_) { stopVoice(); } }
    $('captionInput').value = '';
    ui.dropped.clear();
    updatePreview();
  }
  function commitVoice() {
    if (ui.recording && recog) { ui.commitAfterStop = true; stopVoice(); return; }
    // the box holds a payment screen's text: review it in the transaction sheet, clear the box once saved
    if (ui.shot) {
      openFromRead({ text: $('captionInput').value, origin: 'text', result: ui.shot, onSaved: () => resetCaption() });
      return;
    }
    const items = ui.parsed.filter((_, i) => !ui.dropped.has(i));
    if (!items.length) return;
    if (recog) { recog.saved = true; stopVoice(); }
    const time = localNow().time;
    const created = stamp();
    const txs = items.map((p) => {
      const type = p.type;
      const isTr = type === 'TRANSFER';
      const category = parsedCategory(p);
      const title = clampStr(p.title, 80) || (isTr ? t('tx.transferTitle', { from: walletName(p.walletId), to: walletName(p.toWalletId) }) : catLabel(category));
      return {
        id: Core.uid(), type, amount: roundAmt(p.amount), walletId: p.walletId, toWalletId: isTr ? p.toWalletId : null,
        goalId: null, category, title, note: '', date: (isDayKey(p.dayKey) ? p.dayKey : today) + 'T' + time,
        source: 'VOICE', createdAt: created
      };
    }).filter((x) => x.amount > 0);
    if (!txs.length) return;
    if (!commit((s) => { s.transactions.push(...txs); })) return;
    $('captionInput').value = '';
    ui.dropped.clear();
    updatePreview();
    switchTab('home');
    if (txs.length === 1) {
      const x = txs[0];
      celebrate(x.type === 'INCOME' ? fmtSigned(x.amount) : fmt(x.amount), txWalletText(x));
    } else {
      const sum = parsedSummary(txs);
      celebrate(t('catat.savedN', { n: txs.length }), sum.single || sum.parts);
    }
  }

  // ---------- Tabs ----------
  function switchTab(name) {
    if (['home', 'catat', 'wallet'].indexOf(name) < 0) name = 'home';
    if (name !== 'catat' && recog) stopVoice();
    const changed = ui.tab !== name;
    ui.tab = name;
    document.querySelectorAll('.view-pane').forEach((v) => v.classList.toggle('active', v.dataset.view === name));
    document.querySelectorAll('.tab-item').forEach((b) => {
      const on = b.dataset.tab === name;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    const pane = document.querySelector('.view-pane[data-view="' + name + '"]');
    if (pane && changed) pane.scrollTop = 0;
    if (name === 'catat') { autoGrow($('captionInput')); revealDefaultPill(); }
  }

  function toggleNoSpend() {
    const list = Array.isArray(S().noSpendDays) ? S().noSpendDays.slice() : [];
    const i = list.indexOf(today);
    const marking = i < 0;
    if (marking) list.push(today); else list.splice(i, 1);
    commit((s) => { s.settings.noSpendDays = list; });
    toast(t(marking ? 'nospend.marked' : 'nospend.unmarked'));
  }

  // ---------- Onboarding ----------
  let obStep = 1;
  function openOnboarding() {
    closeAllSheets();
    obStep = 1;
    $('onboarding').hidden = false;
    $('obName').value = S().name || '';
    setAmountField($('obBudget'), num(S().monthlyBudget) > 0 ? num(S().monthlyBudget) : '');
    $('obWName').value = '';
    setAmountField($('obWBal'), '');
    ['obBudgetErr', 'obWalletErr'].forEach((id) => { $(id).textContent = ''; });
    renderOnboarding();
    syncModalState();
    setTimeout(focusObHeading, 60);
  }
  function closeOnboarding() {
    // the setup's fields are gone with it: drop the keyboard state and any scroll iOS left on the document
    const f = document.activeElement;
    if (f && f !== document.body && $('onboarding').contains(f) && typeof f.blur === 'function') f.blur();
    $('onboarding').hidden = true;
    syncModalState();
    syncViewport();
  }
  function focusObHeading() {
    const step = document.querySelector('[data-ob-step="' + obStep + '"]');
    const h = step && step.querySelector('h2');
    if (h) focusEl(h);
  }
  function renderOnboarding() {
    if ($('onboarding').hidden) return;
    document.querySelectorAll('[data-ob-step]').forEach((el) => { el.hidden = Number(el.dataset.obStep) !== obStep; });
    document.querySelectorAll('[data-ob-dot]').forEach((el) => {
      const n = Number(el.dataset.obDot);
      el.classList.toggle('active', n === obStep);
      el.classList.toggle('done', n < obStep);
    });
    $('obStepText').textContent = t('ob.step', { n: obStep });
    $('obBack').hidden = obStep === 1;
    $('obNext').textContent = obStep === 3 ? t('ob.finish') : t('ob.next');
    document.querySelectorAll('[data-action="ob-lang"]').forEach((b) => { const on = b.dataset.lang === lang(); b.classList.toggle('active', on); b.setAttribute('aria-checked', String(on)); });
    document.querySelectorAll('[data-action="ob-cur"]').forEach((b) => { const on = b.dataset.cur === cur(); b.classList.toggle('active', on); b.setAttribute('aria-checked', String(on)); });

    const sel = $('obStartDay');
    const day = Math.min(28, Math.max(1, parseInt(S().periodStartDay, 10) || 1));
    const opts = [];
    for (let d = 1; d <= 28; d++) opts.push('<option value="' + d + '">' + T('settings.dayOption', { n: d }) + '</option>');
    sel.innerHTML = opts.join('');
    sel.value = String(day);
    const p = safe(() => Core.periodRange(today, day), null);
    // the first period started before today, so its budget is prorated (Core.budgetStats)
    $('obStartHint').textContent = t('ob.startHint', { n: day, range: periodRangeText(p) }) + (p && p.start < today ? ' ' + t('ob.proratedHint') : '');

    const bal = balances();
    const list = activeWallets();
    $('obWalletList').innerHTML = list.length ? list.map((w) => {
      const b = num(bal[w.id]);
      return '<div class="ob-wallet-item"><div class="ob-wallet-item-left"><span class="ob-wallet-dot" style="background:' + safeColor(w.color) + '"></span><span>' + esc(w.name) + '</span></div>' +
        '<div style="display:flex;align-items:center;gap:6px;"><span class="wallet-row-bal' + (b < 0 ? ' neg' : '') + '">' + esc(fmt(b)) + '</span>' +
        (txCountForWallet(w.id) === 0 ? '<button type="button" class="icon-btn sm" data-action="ob-remove-wallet" data-id="' + esc(w.id) + '" aria-label="' + T('ob.removeAria', { name: w.name }) + '">' + ICON.close + '</button>' : '') +
        '</div></div>';
    }).join('') : '<p class="ob-empty">' + T('ob.noWallets') + '</p>';
    $('obPresets').innerHTML = presetChips('ob-preset');
  }
  function saveObName() {
    const n = clampStr($('obName').value, 30);
    if (n !== (S().name || '')) { S().name = n; save(); renderHeader(); }
  }
  function saveObBudget(quiet) {
    const el = $('obBudget'), err = $('obBudgetErr');
    err.textContent = '';
    el.classList.remove('invalid');
    const raw = el.value.trim();
    let v = 0;
    if (raw && !isZeroLike(raw)) {
      v = parseAmt(raw);
      if (v == null) {
        if (!quiet) { err.textContent = amountErr(raw); el.classList.add('invalid'); focusEl(el); }
        return false;
      }
    }
    v = roundAmt(v);
    const day = Math.min(28, Math.max(1, parseInt($('obStartDay').value, 10) || 1));
    return commit((s) => {
      s.settings.periodStartDay = day;
      if (v > 0 && !(num(s.settings.monthlyBudget) > 0)) s.settings.budgetSince = budgetSinceFor(s.settings);
      s.settings.monthlyBudget = v;
    });
  }
  function obAddWallet() {
    const nameEl = $('obWName'), balEl = $('obWBal'), err = $('obWalletErr');
    err.textContent = '';
    const name = clampStr(nameEl.value, 24);
    if (!name) { err.textContent = t('wallet.err.name'); focusEl(nameEl); return false; }
    if (nameTaken(name)) { err.textContent = t('wallet.err.dup'); focusEl(nameEl); return false; }
    const bal = parseSigned(balEl.value);
    if (bal == null) { err.textContent = t('wallet.err.balance'); focusEl(balEl); return false; }
    const preset = nameEl.dataset.color;
    const color = /^#[0-9a-fA-F]{3,8}$/.test(preset || '') ? preset : nextSwatch();
    const id = Core.uid();
    const ok = commit((s) => {
      s.wallets.push({ id, name, color, initialBalance: roundAmt(bal), archived: false, createdAt: stamp() });
      if (!walletById(s.settings.defaultWalletId)) s.settings.defaultWalletId = id;
    });
    if (!ok) return false;
    nameEl.value = '';
    setAmountField(balEl, '');
    delete nameEl.dataset.color;
    focusEl(nameEl);
    return true;
  }
  function obNext() {
    if (obStep === 1) { saveObName(); obStep = 2; }
    else if (obStep === 2) { if (!saveObBudget(false)) return; obStep = 3; }
    else { obFinish(); return; }
    renderOnboarding();
    focusObHeading();
  }
  function obFinish() {
    if ($('obWName').value.trim() && !obAddWallet()) return;
    if (!activeWallets().length) { $('obWalletErr').textContent = t('ob.needWallet'); focusEl($('obWName')); return; }
    saveObName();
    const bal = balances();
    const total = activeWallets().reduce((a, w) => a + num(bal[w.id]), 0);
    const ok = commit((s) => {
      s.settings.onboarded = true;
      if (!walletById(s.settings.defaultWalletId)) s.settings.defaultWalletId = defaultWalletId();
    });
    if (!ok) return;
    closeOnboarding();
    switchTab('home');
    celebrate(fmt(total), S().name ? t('ob.ready', { name: S().name }) : t('ob.readyAnon'));
    requestPersist();
  }
  function obSkip() {
    saveObName();
    if (obStep >= 2) saveObBudget(true);
    const ok = commit((s) => {
      if (!s.wallets.some((w) => !w.archived)) {
        const id = Core.uid();
        s.wallets.push({ id, name: t('wallet.cashName'), color: '#FBBF24', initialBalance: 0, archived: false, createdAt: stamp() });
        s.settings.defaultWalletId = id;
      }
      s.settings.onboarded = true;
    });
    if (!ok) return;
    closeOnboarding();
    switchTab('home');
    requestPersist();
  }

  // ---------- Notifikasi Sangu (optional Web Push through Sangu's own push Worker) ----------
  // An iOS Shortcut POSTs the personal notify URL, the Worker pushes a notification to this phone, and tapping it
  // opens Catat with Tempel highlighted (the clipboard is never read without a tap: iOS asks for one).
  // The device record lives in its own key, never in the data or in backups (it belongs to this phone):
  //   moneyapp.push.v1 = { token, auth, notifyUrl, publicKey, enabledAt }
  //   token: the notify URL's secret; auth: the auth secret of the subscription the token is registered with (it
  //   proves this is the same device, so a new subscription keeps the same URL); publicKey: the Worker's VAPID key
  //   the subscription was made with.
  // Network use: only after the user turns this on (GET /vapid + POST /subscribe at app start and when the app comes
  // back to the foreground, POST /n/<token> for a test, POST /unsubscribe to turn off). Pure helpers: Core.push.
  const PUSH_BASE = 'https://sangu-push.istanahanduk.workers.dev';
  // The Worker's VAPID public key at build time; GET /vapid is asked first, so a changed key is picked up.
  const PUSH_VAPID = 'BBlZE-TUwh50bjjOZtMs9TPEvwzWmMHLCYwav3mWxWyjfxi_x13rGi3BWeQj47auMnGb86galXLw7UYvCaVN8OY';
  const PUSH_KEY = 'moneyapp.push.v1';      // removed with the other moneyapp.* keys by "Hapus semua data"
  const PUSH_TIMEOUT_MS = 15000;
  const PUSH_RESYNC_MS = 5 * 60 * 1000;      // foreground syncs: at most one per 5 minutes
  const PASTE_HINT_MS = 12000;               // "Ketuk Tempel" after a notification tap
  const ROUTE_KEY = STORAGE_KEY + '.route';  // sessionStorage: Catat + its hint survive an update reload
  const PC = Core.push;
  // errors -> plain-language text ('cancelled' is never shown; a key change the phone could not fix is the server's)
  const PUSH_ERR = {
    offline: 'push.errOffline', network: 'push.errNetwork', timeout: 'push.errTimeout', push_unavailable: 'push.errPushUnavailable',
    rejected: 'push.errRejected', rate_limited: 'push.errRateLimited', quota: 'push.errQuota', server: 'push.errServer',
    gone: 'push.errGone', vapid_mismatch: 'push.errServer', subscribe: 'push.errSubscribe', sw: 'push.errSw',
    dismissed: 'push.errDismissed', unsupported: 'push.errSubscribe', denied: 'push.errDismissed', storage: 'push.errStorage'
  };
  // busy: '' | 'enable' | 'test' | 'off'; err: { kind, op } shown in the section until the next try
  // gen: bumped by "off", reset and a lost token (pushCancel), so a sync still on its way never writes the record back
  // syncing: { gen, promise } of the sync running for the current gen (a newer "on" never joins an older one)
  const pushUi = { busy: '', err: null, howOpen: false, lastSync: 0, syncing: null, html: '', armed: false, armTimer: 0, armedAt: 0, retryOnline: false, gen: 0 };
  ICON.bell = svgIcon('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>');
  ICON.copy = svgIcon('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>');
  ICON.send = svgIcon('<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>');

  // ---------- Environment ----------
  const isIOSDevice = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandaloneApp = () => navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  function pushSupported() {
    const host = location.hostname;
    const served = location.protocol === 'https:' || (location.protocol === 'http:' && (host === 'localhost' || host === '127.0.0.1' || host === '[::1]'));
    return served && !!window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  }
  function pushPermission() { try { return window.Notification ? Notification.permission : 'default'; } catch (_) { return 'default'; } }

  // ---------- Device record ----------
  function pushLoadRaw() {
    try {
      const o = JSON.parse(localStorage.getItem(PUSH_KEY) || 'null');
      return o && typeof o === 'object' && !Array.isArray(o) ? o : {};
    } catch (_) { return {}; }
  }
  function pushStore(o) { try { localStorage.setItem(PUSH_KEY, JSON.stringify(o)); return true; } catch (_) { return false; } }
  function pushClear() { try { localStorage.removeItem(PUSH_KEY); } catch (_) { /* storage unavailable */ } }
  const pushSaved = () => PC.saved(pushLoadRaw());
  function pushState() {
    return PC.view({ ios: isIOSDevice(), standalone: isStandaloneApp(), supported: pushSupported(), permission: pushPermission(), saved: pushLoadRaw() });
  }

  // ---------- Network ----------
  const pushError = (kind, msg) => Object.assign(new Error(msg || kind), { kind });
  function pushFetch(url, init) {
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), PUSH_TIMEOUT_MS) : 0;
    const opts = Object.assign({ cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' }, init, ctl ? { signal: ctl.signal } : {});
    return fetch(url, opts).then((res) => { clearTimeout(timer); return res; }, (e) => { clearTimeout(timer); throw e; });
  }
  // POST JSON to the Worker; a non-2xx answer throws { status, code, pushStatus, reason } (see Core.push.errorKind)
  async function pushPost(url, body) {
    const res = await pushFetch(/^https:/.test(url) ? url : PUSH_BASE + url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw Object.assign(new Error(data.error || 'http_' + res.status), {
        status: res.status, code: data.error, pushStatus: data.status, reason: typeof data.reason === 'string' ? data.reason : ''
      });
    }
    return data;
  }
  async function pushVapidKey(fallback) {
    try {
      const res = await pushFetch(PUSH_BASE + '/vapid', { method: 'GET' });
      const d = await res.json();
      if (res.ok && PC.validKey(d.publicKey)) return d.publicKey;
    } catch (_) { /* no answer: the /subscribe call that follows reports it */ }
    return fallback;
  }
  function swReady() {
    if (!('serviceWorker' in navigator)) return Promise.reject(pushError('unsupported'));
    let timer = 0;
    return Promise.race([
      navigator.serviceWorker.ready,
      new Promise((resolve, reject) => { timer = setTimeout(() => reject(pushError('sw')), 10000); })
    ]).then((reg) => { clearTimeout(timer); return reg; }, (e) => { clearTimeout(timer); throw e; });
  }

  // ---------- Sync (the push Worker README's syncPush) ----------
  // Makes sure this phone has a push subscription made with the Worker's current key and that the Worker has it under
  // this phone's token. Re-subscribes when the subscription is missing or was made with another key; the token (and
  // so the Shortcut URL) stays the same because the saved auth secret proves it is the same device.
  // Resolves { notifyUrl, changed } (changed: the URL is new, the Shortcut needs it).
  // Turned off or reset while it runs (pushCancel): it stops at the next step with kind 'cancelled', writes nothing
  // and takes back what it made by then, a new browser subscription or a token at the Worker.
  // Storage full: kind 'storage'. A first "on" finds out before anything is registered; if only the final write
  // fails, a token the phone cannot keep is deleted at the Worker again.
  async function pushSync() {
    if (navigator.onLine === false) throw pushError('offline');
    const gen = pushUi.gen;
    const stale = () => gen !== pushUi.gen;
    const current = () => { if (stale()) throw pushError('cancelled'); };
    // the browser keeps one subscription per app: once this sync is stale, the one it made is dropped only while
    // no newer "on" is running or done (that one would be using the same subscription)
    const unused = () => !pushUi.syncing && !PC.validToken(pushLoadRaw().token);
    const reg = await swReady();
    current();
    const pm = reg && reg.pushManager;
    if (!pm) throw pushError('unsupported');
    const raw = pushLoadRaw();
    const had = PC.validToken(raw.token) ? raw.token : '';
    const publicKey = await pushVapidKey(PC.validKey(raw.publicKey) ? raw.publicKey : PUSH_VAPID);
    current();
    let sub = null;
    try { sub = await pm.getSubscription(); } catch (_) { sub = null; }
    current();
    const opt = sub && sub.options && sub.options.applicationServerKey;
    const bound = opt ? PC.bytesToB64u(opt) : (PC.validKey(raw.publicKey) ? raw.publicKey : '');
    if (sub && PC.keyChanged(bound, publicKey)) {
      try { await sub.unsubscribe(); } catch (_) { /* replaced below either way */ }
      sub = null;
    }
    let made = false;
    if (!sub) {
      try {
        sub = await pm.subscribe({ userVisibleOnly: true, applicationServerKey: PC.b64uToBytes(publicKey) });
      } catch (e) {
        throw pushError(e && e.name === 'NotAllowedError' && pushPermission() === 'denied' ? 'denied' : 'subscribe', e && e.name);
      }
      made = true;
      if (stale()) {
        if (unused()) { try { await sub.unsubscribe(); } catch (_) { /* ignore */ } }
        current();
      }
    }
    // keep the key the subscription was made with; before a first registration this also proves the record can be
    // kept at all (with storage full the new URL would be lost, and every retry would register another token)
    if ((made || !had) && !pushStore(Object.assign({}, raw, { publicKey })) && !had) throw pushError('storage');
    const json = sub && typeof sub.toJSON === 'function' ? sub.toJSON() : null;
    if (!json || !json.endpoint || !json.keys || !json.keys.auth || !json.keys.p256dh) throw pushError('subscribe');
    const body = { subscription: json };
    if (had) { body.token = had; if (typeof raw.auth === 'string' && raw.auth) body.auth = raw.auth; }
    let data;
    try {
      data = await pushPost('/subscribe', body);
    } catch (e) {
      // the push service refused this subscription: the next try makes a new one
      if (e && e.code === 'subscription_rejected' && !stale()) { try { await sub.unsubscribe(); } catch (_) { /* ignore */ } }
      current();
      throw e;
    }
    if (!data || !PC.validToken(data.token)) throw Object.assign(new Error('bad_reply'), { status: 500, code: 'bad_reply' });
    const auth = json.keys.auth;
    // a token this phone will not keep is deleted at the Worker again (best effort; it expires after 90 days anyway)
    const giveBack = () => {
      if (data.token !== pushLoadRaw().token && navigator.onLine !== false) pushPost('/unsubscribe', { token: data.token, auth }).catch(() => {});
    };
    if (stale()) {
      // turned off while the Worker answered: whatever it registered goes again (its "off" may have been
      // answered first, or with the auth secret of the subscription this sync replaced)
      giveBack();
      if (unused()) { try { await sub.unsubscribe(); } catch (_) { /* ignore */ } }
      current();
    }
    const notifyUrl = PC.notifyUrl(PUSH_BASE, data.token, data.notifyUrl);
    const changed = data.changed === true || (!!had && had !== data.token);
    const enabledAt = had && typeof raw.enabledAt === 'string' && raw.enabledAt ? raw.enabledAt : new Date().toISOString();
    if (!pushStore({ token: data.token, auth, notifyUrl, publicKey, enabledAt })) {
      // the same token stays usable (the Worker has this subscription under it); a new one is taken back
      if (data.token !== had) giveBack();
      throw pushError('storage');
    }
    pushUi.lastSync = Date.now();
    return { notifyUrl, changed };
  }
  // one sync at a time (app start, foreground and a tap may meet); after "off" the next one starts afresh
  function pushSyncOnce() {
    const s = pushUi.syncing;
    if (s && s.gen === pushUi.gen) return s.promise;
    const entry = { gen: pushUi.gen, promise: null };
    const done = () => { if (pushUi.syncing === entry) pushUi.syncing = null; };
    entry.promise = pushSync().then((r) => { done(); return r; }, (e) => { done(); throw e; });
    pushUi.syncing = entry;
    return entry.promise;
  }
  // Notifications are off from here on (turned off, all data reset, or the token is gone): a sync still on its way
  // stops without writing the record back, and the next "on" does not wait for it.
  function pushCancel() {
    pushUi.gen++;
    pushUi.syncing = null;
  }
  // App start, back in the foreground, back online, or the service worker saw the subscription change.
  // Only when notifications are on (permission + token); quiet on failure (the next start tries again).
  function pushAutoSync(reason) {

        tx = db.transaction(['items', 'kv'], mode);
        out = fn(tx.objectStore('items'), tx.objectStore('kv'));
      } catch (e) { db.close(); reject(e); return; }
      tx.oncomplete = () => { db.close(); try { resolve(typeof out === 'function' ? out() : out); } catch (e) { reject(e); } };
      tx.onerror = () => { db.close(); reject(tx.error || new Error('idb')); };
      tx.onabort = () => { db.close(); reject(tx.error || new Error('idb')); };
    }));
    const late = new Promise((resolve, reject) => { timer = setTimeout(() => reject(new Error('timeout')), IDB_WAIT_MS); });
    return Promise.race([work, late]).then((v) => { clearTimeout(timer); return v; }, (e) => { clearTimeout(timer); throw e; });
  }
  // the service worker keeps fields only while this says yes; "no" also empties the inbox
  function inboxWriteFlag(on) {
    return idbRun('readwrite', (items, kv) => { kv.put(on === true, 'optin'); if (on !== true) items.clear(); });
  }
  // the usable items, newest first; expired and broken ones are deleted
  function inboxLoad() {
    return idbRun('readwrite', (items) => {
      const req = items.getAll();
      let list = [];
      req.onsuccess = () => {
        const all = req.result || [];
        PC.inboxExpired(all, Date.now()).forEach((n) => items.delete(n));
        list = PC.inboxClean(all, Date.now());
      };
      return () => list;
    });
  }
  function inboxDelete(ids) {
    const list = [].concat(ids).filter(Boolean);
    inbox.items = inbox.items.filter((x) => list.indexOf(x.n) < 0);
    inboxRender();
    if (!list.length) return Promise.resolve();
    return idbRun('readwrite', (items) => { list.forEach((n) => items.delete(n)); }).catch(() => {});
  }

  // ---------- Reading an item ----------
  function stampOf(ms) {
    const d = new Date(ms);
    return Core.dayKey(d.getFullYear(), d.getMonth() + 1, d.getDate()) + 'T' + Core.pad2(d.getHours()) + ':' + Core.pad2(d.getMinutes());
  }
  // { item, r (the reading its fields make), title, amount, day, savedAs (surely recorded after it came), dup (a similar
  // row) }. Rows saved from another item (another notification) never count as this one's, unless they have its time.
  // "Hari ini" / "Kemarin" on the screen count from the day the push came on this phone (receivedDay).
  const readingOf = (item) => safe(() => PC.inboxReading(item.f, Object.assign(coreCtx(), { receivedDay: stampOf(item.receivedAt).slice(0, 10) })), null);
  function inboxView(item, handled) {
    const r = readingOf(item) || {};
    const amount = num(r.amount) > 0 ? roundAmt(r.amount) : 0;
    const type = ['EXPENSE', 'INCOME', 'TRANSFER'].indexOf(r.type) >= 0 ? r.type : 'EXPENSE';
    const day = isDayKey(r.dayKey) ? r.dayKey : stampOf(item.receivedAt).slice(0, 10);
    const time = isTime(r.time) ? r.time : null;
    const title = clampStr(r.title, 80);
    const c = { type, amount, day, time, title, category: type === 'TRANSFER' ? 'transfer' : r.category };
    const others = (handled || handledList()).filter((x) => x.n !== item.n && x.tx).map((x) => x.tx);
    const savedAs = amount ? safe(() => PC.inboxSavedAs(c, state.transactions, stampOf(item.receivedAt - INBOX_SINCE_MS), { exclude: others }), null) : null;
    let dup = amount ? findDuplicate(c) : null;
    const mins = (hm) => (isTime(hm) ? Number(hm.slice(0, 2)) * 60 + Number(hm.slice(3, 5)) : null);
    if (dup && time && others.indexOf(dup.id) >= 0 && Math.abs(mins(String(dup.date).slice(11, 16)) - mins(time)) > 2) dup = null;
    return { item, r, title, amount, type, day, savedAs, dup };
  }

  // ---------- Catat: "Menunggu dicatat (n)" ----------
  // In the slot under the mic, in the tip's place: not while Save is there or the mic listens.
  function syncInboxStrip() {
    const strip = $('inboxStrip'), commit = $('commitBtn'), hint = $('catatHint');
    if (!strip || !commit || !hint) return;
    const show = inbox.items.length > 0 && commit.hidden && !ui.recording;
    strip.hidden = !show;
    hint.hidden = !commit.hidden || show;
  }
  function inboxRender() {
    const strip = $('inboxStrip');
    if (strip) {
      const n = inbox.items.length;
      syncInboxStrip();
      if (n) {
        const label = t('inbox.strip', { n });
        const span = strip.querySelector('.inbox-strip-text');
        if (span && span.textContent !== label) span.textContent = label;
        strip.setAttribute('aria-label', t('inbox.stripAria', { n }));
      }
    }
    const list = inbox.listEntry;
    if (list && !list.closed) {
      if (!inbox.items.length) closeSheet(list);
      else list.draw();
    }
  }
  function inboxRowHtml(v) {
    const time = stampOf(v.item.receivedAt);
    const when = (time.slice(0, 10) === today ? '' : dayLabel(time.slice(0, 10)) + ' ') + time.slice(11, 16);
    const title = v.title || t('inbox.unknownTitle');
    const amt = v.amount ? (v.type === 'INCOME' ? fmtSigned(v.amount) : fmt(v.amount)) : t('inbox.noAmount');
    return '<div class="inbox-row" data-n="' + esc(v.item.n) + '">' +
      '<div class="inbox-main"><div class="inbox-top"><span class="inbox-title">' + esc(title) + '</span>' +
      '<span class="inbox-amt' + (v.amount ? '' : ' none') + '">' + esc(amt) + '</span></div>' +
      '<div class="inbox-meta"><span>' + T('inbox.at', { time: when }) + '</span>' + (v.dup ? '<span class="dup-tag">' + T('shot.dup') + '</span>' : '') + '</div></div>' +
      '<div class="inbox-btns"><button type="button" class="btn-secondary sm" data-action="inbox-check" data-n="' + esc(v.item.n) + '" aria-label="' + T('inbox.checkAria', { title }) + '">' + T('inbox.check') + '</button>' +
      '<button type="button" class="icon-btn sm" data-action="inbox-remove" data-n="' + esc(v.item.n) + '" aria-label="' + T('inbox.removeAria', { title }) + '">' + ICON.trash + '</button></div></div>';
  }
  // Hapus (the list's trash, or Hapus on the item's own sheet): the item leaves the list. Like a deleted transaction,
  // Urungkan puts it back (its notification does not come back)
  function inboxDiscard(n) {
    const item = inbox.items.find((x) => x.n === n);
    if (!item) return false;
    markHandled(n, null, 'removed');
    closeNotifsFor(n);
    inboxDelete(n);
    toast(inbox.items.length ? t('inbox.removed') : t('inbox.removedLast'), { duration: 5000, action: { label: t('undo'), fn: () => inboxRestore(item) } });
    announce(t('inbox.removed'));
    return true;
  }
  function openInboxList() {
    if (!inbox.items.length) return null;
    const entry = openSheet({
      id: 'inbox', title: t('inbox.title'), body: '', foot: '',
      onClose: () => { if (inbox.listEntry === entry) inbox.listEntry = null; },
      update: () => entry.draw(),
      actions: {
        'inbox-check': (el) => { const n = el.dataset.n; closeSheet(entry, true); inboxOpenItem(n, { fromList: true }); },
        'inbox-remove': (el) => { inboxDiscard(el.dataset.n); }
      }
    });
    entry.draw = () => {
      const handled = handledList();
      const rows = inbox.items.map((x) => inboxView(x, handled));
      entry.titleEl.textContent = t('inbox.title') + ' (' + rows.length + ')';
      entry.body.innerHTML = '<p class="field-hint">' + T('inbox.lead') + '</p><div class="inbox-list" role="list">' +
        rows.map((v) => inboxRowHtml(v).replace('<div class="inbox-row"', '<div class="inbox-row" role="listitem"')).join('') + '</div>';
    };
    entry.draw();
    inbox.listEntry = entry;
    inbox.items.forEach((x) => markSeen(x.n));
    return entry;
  }
  // Opens one item in the transaction sheet (a statement in the Mutasi reader). Simpan removes it.
  function inboxOpenItem(n, opts) {
    opts = opts || {};
    const item = inbox.items.find((x) => x.n === n);
    if (!item) return null;
    markSeen(n);
    const done = (rec) => { markHandled(n, rec && rec.id, 'saved'); closeNotifsFor(n); inboxDelete(n); };
    // the list it came from opens again for the rest (after a save: after the check mark)
    const backToList = (ms) => {
      if (opts.fromList && inbox.items.length) {
        setTimeout(() => { if (!topSheet() && $('onboarding').hidden && inbox.items.length) { switchTab('catat'); openInboxList(); } }, ms);
      }
    };
    const entry = openFromRead({
      text: '', result: readingOf(item), origin: 'notif', receivedAt: item.receivedAt,
      // not to be recorded: Hapus on the sheet takes it off the list, as the list's trash does
      discard: () => { if (inboxDiscard(n)) backToList(350); },
      onSaved: (rec) => {
        done(rec);
        backToList(1150);
      }
    });
    inbox.entry = entry;
    inbox.openN = n;
    return entry;
  }
  // The strip in Catat: one item opens straight away, several open the list.
  function inboxOpenFromStrip() {
    if (inbox.items.length === 1) inboxOpenItem(inbox.items[0].n);
    else openInboxList();
  }

  // ---------- When to look ----------
  // reason: 'open' (a notification was tapped; preferN its item), 'start', 'foreground', 'push' (one came in while
  // the app is open: the strip only). Resolves true when items are waiting (so no Tempel hint is needed).
  function inboxCheck(reason, preferN) {
    inbox.queue = inbox.queue.then(() => inboxRun(reason, preferN), () => inboxRun(reason, preferN));
    return inbox.queue;
  }
  function inboxRun(reason, preferN) {
    if (!inboxSupported()) return Promise.resolve(false);
    if (!inboxOptIn()) {
      inbox.items = [];
      inboxRender();
      // privacy: anything kept while the setting was on goes, once per start
      if (!inbox.purged) { inbox.purged = true; return inboxWriteFlag(false).then(() => false, () => false); }
      return Promise.resolve(false);
    }
    return inboxLoad().then((loaded) => {
      // fields with no amount (nothing was read) fill no sheet: they wait only for their notification's tap, which
      // removes them and points at Tempel (Tempel reads the text itself); otherwise they go after 7 days
      const items = loaded.filter((x) => PC.inboxUsable(x.f));
      const tappedUnread = reason === 'open' && !!preferN && loaded.some((x) => x.n === preferN && !PC.inboxUsable(x.f));
      if (tappedUnread) idbRun('readwrite', (st) => { st.delete(preferN); }).catch(() => {});
      inbox.items = items;
      if (tappedUnread || !state || !Array.isArray(state.transactions)) { inboxRender(); return !tappedUnread && items.length > 0; }
      // surely saved already (Tempel from the same e-mail, or typed in with its time): dropped quietly
      const handled = handledList();
      const saved = items.map((x) => inboxView(x, handled)).filter((v) => v.savedAs);
      saved.forEach((v) => markHandled(v.item.n, v.savedAs.id, 'saved'));
      if (saved.length) { closeNotifsFor(saved.map((v) => v.item.n)); inboxDelete(saved.map((v) => v.item.n)); }
      inboxRender();
      // tapped the notification of an item saved or deleted already (now, or earlier): say so, open nothing else
      const was = reason === 'open' && preferN && !inbox.items.some((x) => x.n === preferN) ? handledOf(preferN) : null;
      if (was) toast(was.how === 'removed' ? t('inbox.alreadyRemoved') : t('inbox.alreadySaved'));
      const left = inbox.items;
      if (!left.length || was) return !!was || left.length > 0;
      // a tapped notification that left no item here (nothing read, nothing kept, or gone): its body said Tempel, so
      // Tempel it is (resolves false); the strip still shows what waits
      if (reason === 'open' && !left.some((x) => x.n === preferN)) return false;
      if (reason === 'push' || !state || !S().onboarded || !$('onboarding').hidden) return true;
      // the item's own sheet is already open
      if (inbox.entry && !inbox.entry.closed && left.some((x) => x.n === inbox.openN)) return true;
      const seen = seenIds();
      const fresh = left.filter((x) => seen.indexOf(x.n) < 0);
      if (reason !== 'open' && !fresh.length) return true;
      // views with nothing typed in them make way; a form being filled in stays (the strip waits in Catat)
      sheets.slice().forEach((sh) => { if (CLOSE_FOR_CATAT.indexOf(sh.id) >= 0) closeSheet(sh, true); });
      if (topSheet()) return true;
      switchTab('catat');
      // the tapped item; at start or back in the app, the only item; else the list
      const target = reason === 'open' ? left.find((x) => x.n === preferN) : (left.length === 1 ? left[0] : null);
      if (target) inboxOpenItem(target.n); else openInboxList();
      return true;
    }, () => false);
  }
  // Any transaction saved (Tempel, typed, a statement): items it surely records go at once, the strip follows
  function inboxAfterCommit() {
    if (!inbox.items.length || !inboxOptIn()) return;
    clearTimeout(inbox.recheck);
    inbox.recheck = setTimeout(() => { inboxCheck('push'); }, 250);
  }
  // Urungkan after a delete in the list: the item comes back (its notification does not)
  function inboxRestore(item) {
    unmarkHandled(item.n);
    if (!inboxOptIn() || !inboxSupported()) return;
    idbRun('readwrite', (items) => { items.put({ n: item.n, f: item.f, receivedAt: item.receivedAt }); })
      .then(() => inboxCheck('push'), () => {});
  }

  // ---------- Settings: the switch ----------
  function inboxToggle() {
    const on = !inboxOptIn();
    try { if (on) localStorage.setItem(INBOX_OPTIN_KEY, '1'); else localStorage.removeItem(INBOX_OPTIN_KEY); } catch (_) {
      toast(t('push.errStorage'), { type: 'error' });
      return;
    }
    inbox.purged = false;
    inboxWriteFlag(on).catch(() => {});
    if (!on) { inbox.items = []; inboxRender(); }
    pushRender('push-text');
    toast(t(on ? 'push.textOn' : 'push.textOff'), { duration: on ? 6000 : 3200 });
  }
  // "Hapus semua data": the setting (a moneyapp.* key, removed with the others) and the kept text go
  function inboxForget() {
    inbox.items = [];
    inbox.purged = true;
    inboxRender();
    if (inboxSupported()) inboxWriteFlag(false).catch(() => {});
  }
  // App start: the service worker's copy of the setting follows this phone's
  function inboxBoot(open) {
    if (!inboxSupported()) return;
    if (inboxOptIn()) inboxWriteFlag(true).catch(() => {});
    if (!open) inboxCheck('start');
  }

  // ---------- Event delegation ----------
  const ACTIONS = {
    'tab': (el) => switchTab(el.dataset.tab),
    'open-settings': () => openSettingsSheet(),
    'home-seg': (el) => { ui.homeSeg = el.dataset.seg === 'recap' ? 'recap' : 'activity'; renderHome(); },
    'filter-wallet': (el) => { ui.walletFilter = ui.walletFilter === el.dataset.id ? null : el.dataset.id; ui.homeSeg = 'activity'; renderHome(); },
    'clear-filter': () => { ui.walletFilter = null; renderHome(); },
    'wallet-add': () => openWalletSheet(null),
    'wallet-open': (el) => openWalletSheet(el.dataset.id),
    'toggle-archived': () => { ui.archivedOpen = !ui.archivedOpen; renderWallet(); },
    'goal-add': () => openGoalSheet(null),
    'goal-open': (el) => openGoalSheet(el.dataset.id),
    'open-transfer': () => openTxSheet({ prefill: { type: 'TRANSFER' } }),
    'edit-tx': (el) => openTxSheet({ txId: el.dataset.id }),
    'open-history': () => openHistorySheet(),
    'rollover-info': () => openRolloverSheet(),
    'set-budget': () => openSettingsSheet({ focus: 'budget' }),
    'toggle-nospend': () => toggleNoSpend(),
    'catat-wallet': (el) => { if (walletById(el.dataset.id)) commit((s) => { s.settings.defaultWalletId = el.dataset.id; }); },
    // the field keeps the keyboard only if it had it: a row dropped while reviewing does not bring the keyboard up
    // a row opened in the transaction sheet: saved there, it leaves the list (the last one clears the box too).
    // Not while listening: the rows still change with the words coming in
    'edit-parsed': (el) => {
      const i = Number(el.dataset.idx), p = ui.parsed[i];
      if (ui.recording || !p || ui.dropped.has(i)) return;
      openTxSheet({
        prefill: { type: p.type, amount: p.amount, title: p.title, walletId: p.walletId, toWalletId: p.toWalletId, category: parsedCategory(p), day: p.dayKey, source: 'VOICE' },
        // the amount is known: no keyboard over the sheet (as a payment screen's review opens)
        focus: null,
        onSaved: () => {
          ui.savedRows.push(parsedKey(p));
          ui.dropped.add(i);
          if (ui.parsed.some((_, j) => !ui.dropped.has(j))) updatePreview(); else resetCaption();
        }
      });
    },
    // the wallet the words named is added (name and colour of its preset filled in) or, archived, opened to bring back
    'add-missing-wallet': (el) => {
      const arch = archivedNamed(el.dataset.name);
      if (arch) openWalletSheet(arch.id); else openWalletSheet(null, { name: el.dataset.name });
    },
    'drop-parsed': (el, e) => { const keep = captionHadFocus(e); ui.dropped.add(Number(el.dataset.idx)); updatePreview(); if (keep) focusEl($('captionInput')); },
    'voice-toggle': () => toggleVoice(),
    // like the clear button in an iOS field: typing goes on in the empty field
    'voice-reset': (el, e) => { const keep = captionHadFocus(e); resetCaption(); if (keep) focusEl($('captionInput')); },
    'voice-commit': () => commitVoice(),
    'open-manual': () => openTxSheet({}),
    'open-scan': () => openScanSheet('photo'),
    'clip-paste': () => pasteFromClipboard(null),
    // "Menunggu dicatat (n)": text notifications brought (09c_inbox.js)
    'inbox-open': () => inboxOpenFromStrip(),
    // the label opens the picker by itself; without a wallet there is nothing to record into yet
    'shot-pick': (el, e) => {
      if (activeWallets().length) return;
      if (e) e.preventDefault();
      toast(t('err.needWallet'), { type: 'error', action: { label: t('catat.addWallet'), fn: () => openWalletSheet(null) } });
    },
    'ob-lang': (el) => { saveObName(); commit((s) => { s.settings.lang = el.dataset.lang === 'en' ? 'en' : 'id'; }); },
    'ob-cur': (el) => {
      const c = el.dataset.cur;
      if (!Core.CURRENCIES || !Core.CURRENCIES[c]) return;
      saveObName();
      commit((s) => { s.settings.currency = c; });
      setAmountField($('obBudget'), num(S().monthlyBudget) > 0 ? num(S().monthlyBudget) : '');
    },
    'ob-next': () => obNext(),
    'ob-back': () => { if (obStep > 1) { obStep -= 1; renderOnboarding(); focusObHeading(); } },
    'ob-skip': () => obSkip(),
    'ob-preset': (el) => { const n = $('obWName'); n.value = el.dataset.name || ''; n.dataset.color = el.dataset.color || ''; $('obWalletErr').textContent = ''; focusEl($('obWBal')); },
    'ob-add-wallet': () => obAddWallet(),
    'backup-now': () => exportBackup(),
    'corrupt-download': () => {
      let raw = null;
      try { raw = localStorage.getItem(CORRUPT_KEY); } catch (_) { raw = null; }
      if (raw) download(appSlug() + '-unreadable-' + today + '.json', raw, 'application/json');
    },
    'corrupt-discard': () => {
      try { localStorage.removeItem(CORRUPT_KEY); } catch (_) { /* ignore */ }
      corruptCopy = false;
      renderStorageBanner();
      toast(t('storage.discarded'));
    },
    'ob-remove-wallet': (el) => {
      const id = el.dataset.id;
      if (!walletById(id) || txCountForWallet(id) > 0) return;
      commit((s) => {
        s.wallets = s.wallets.filter((w) => w.id !== id);
        if (s.settings.defaultWalletId === id) s.settings.defaultWalletId = null;
      });
      focusEl($('obWName'));
    }
  };

  // Was the Catat field being typed in when this tap began? (× and a row's × must not take its keyboard away, and
  // must not bring one up when nobody was typing.) A keyboard-activated button (no pointer) hands focus back to it.
  let capDown = { at: 0, had: false };
  document.addEventListener('pointerdown', () => {
    capDown = { at: performance.now(), had: document.activeElement === $('captionInput') };
  }, { capture: true, passive: true });
  // pressing × or a row's × while typing leaves the field focused (no blur, so no keyboard flicker)
  document.addEventListener('mousedown', (e) => {
    if (document.activeElement === $('captionInput') && e.target.closest && e.target.closest('#captionClear, #parsedPreview .chip-x')) e.preventDefault();
  });
  function captionHadFocus(e) {
    if (document.activeElement === $('captionInput')) return true;
    if (e && e.detail === 0) return true;
    return capDown.had && performance.now() - capDown.at < 1500;
  }
  // the rows list under the Catat field scrolls while the keyboard is up: fade the edge where it is cut
  $('parsedPreview').addEventListener('scroll', () => previewScrolled(), { passive: true });
  $('parsedPreview').addEventListener('animationend', () => previewFades());
  if (window.ResizeObserver) {
    new ResizeObserver(() => previewResized()).observe($('parsedPreview'));
    // the field's cap changes with the keyboard (3 lines while typing): look again whether its text is cut
    new ResizeObserver(() => markClipped($('captionInput'))).observe($('captionInput'));
  }

  function sheetOf(el) {
    const layer = el.closest('.sheet-layer');
    return layer ? sheets.find((s) => s.layer === layer) || null : null;
  }
  // Taps right after a sheet opened/closed or a save are ghost taps from a double tap: drop them.
  window.addEventListener('click', (e) => {
    if (e.isTrusted && performance.now() < ui.ignoreClicksUntil) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
  document.addEventListener('click', (e) => {
    refreshToday();
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const action = el.getAttribute('data-action');
    const entry = sheetOf(el);
    if (el.closest('.sheet-layer') && !entry) return;
    if (entry) {
      if (action === 'sheet-dismiss') { closeSheet(entry); return; }
      if (entry.actions[action]) { entry.actions[action](el, e); return; }
    }
    if (ACTIONS[action]) ACTIONS[action](el, e);
  });

  // Amount fields are regrouped in the capture phase, before any listener of the field itself runs: those read
  // the value for live labels ("Setor Rp …", the duplicate check), and "200.0000" (the keystroke before "2.000.000"
  // is regrouped) reads as 200. The value before the edit tells a Backspace on a separator apart (liveFormat).
  const amountBefore = new WeakMap();
  const isAmountField = (el) => !!(el && el.hasAttribute && el.hasAttribute('data-amount-field'));
  document.addEventListener('beforeinput', (e) => {
    const el = e.target;
    if (isAmountField(el)) amountBefore.set(el, { value: el.value, ranged: el.selectionStart !== el.selectionEnd });
  }, true);
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!isAmountField(el)) return;
    const before = amountBefore.get(el);
    amountBefore.delete(el);
    liveFormat(el, e.inputType, before);
    updateAmountHint(el);
  }, true);

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.id === 'captionInput') { refreshToday(); ui.dropped.clear(); updatePreview(); return; }
    // Editing a field clears its stale validation message; it is re-checked on save.
    if (el.classList && el.classList.contains('invalid')) el.classList.remove('invalid');
    const errEl = el.id ? document.getElementById(el.id + 'Err') : null;
    if (errEl && errEl.textContent) errEl.textContent = '';
    if ((el.id === 'obWName' || el.id === 'obWBal') && $('obWalletErr').textContent) $('obWalletErr').textContent = '';
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'obRestore') {
      const file = el.files && el.files[0];
      el.value = '';
      handleRestore(file);
      return;
    }
    if (el.id === 'obStartDay') {
      const d = Math.min(28, Math.max(1, parseInt(el.value, 10) || 1));
      commit((s) => { s.settings.periodStartDay = d; });
    } else if (el.id === 'obBudget') {

  // build's cache; compare only once it is 'activated' (or after 5 s at most).
  function whenActivated() {
    const c = navigator.serviceWorker.controller;
    if (!c || c.state === 'activated') return Promise.resolve();
    return new Promise((resolve) => {
      const done = () => { c.removeEventListener('statechange', check); resolve(); };
      const check = () => { if (c.state === 'activated' || c.state === 'redundant') done(); };
      c.addEventListener('statechange', check);
      setTimeout(done, 5000);
    });
  }
  function pageIsCurrent() {
    if (!window.caches) return Promise.resolve('unknown');
    const url = new URL('index.html', location.href).href;
    // newest cache first (keys() is in creation order): a leftover older cache must not hide the new copy
    const newest = () => caches.keys().then((keys) => keys.reverse().reduce(
      (p, k) => p.then((hit) => hit || caches.open(k).then((c) => c.match(url))), Promise.resolve(null)));
    return whenActivated().then(newest).then((res) => {
      if (!res) return 'unknown';
      const theirs = Date.parse(res.headers.get('last-modified') || '');
      const mine = Date.parse(document.lastModified);
      return isFinite(theirs) && isFinite(mine) && Math.abs(theirs - mine) < 2000;
    }).catch(() => 'unknown');
  }
  function setupPWA() {
    const host = location.hostname;
    const local = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
    if (!(location.protocol === 'https:' || (location.protocol === 'http:' && local))) return;
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.webmanifest';
    document.head.appendChild(link);
    if (!('serviceWorker' in navigator)) return;
    const sw = navigator.serviceWorker;
    let hadController = !!sw.controller;
    sw.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; } // first install: this page is what it cached
      if (upd.pending) return;
      pageIsCurrent().then((current) => {
        if (current === true) return;
        if (current === 'unknown') upd.manual = true;
        applyUpdate();
      });
    });
    const reg = () => sw.register('sw.js', { updateViaCache: 'none' })
      .then((r) => { upd.reg = r; upd.lastCheck = Date.now(); })
      .catch(() => {});
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
    // iOS keeps Home Screen apps alive in the background (no new page load, so no update check):
    // look for a new build whenever the app comes back to the foreground.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (upd.pending) { applyUpdate(); return; }
      if (upd.reg && Date.now() - upd.lastCheck > 60000) {
        upd.lastCheck = Date.now();
        upd.reg.update().catch(() => {});
      }
    });
  }

  // ---------- Boot ----------
  // the launch screen (the SPLASH block at the top of the body) fades out once the first screen below it is drawn
  const hideSplash = () => { if (window.__splash) window.__splash.hide(); };
  load();
  if (!state) { appEl.innerHTML = '<div style="padding:32px 24px;color:#FAFAFA">' + esc(t('err.generic')) + '</div>'; hideSplash(); return; }
  renderAll();
  applyRoving();

  switchTab('home');
  if (!S().onboarded) openOnboarding();
  // Catat text kept across an update reload
  try {
    const draft = sessionStorage.getItem(DRAFT_KEY);
    if (draft) {
      sessionStorage.removeItem(DRAFT_KEY);
      if (S().onboarded) { $('captionInput').value = draft; switchTab('catat'); updatePreview(); }
    }
  } catch (_) { /* ignore */ }
  setupPWA();
  // opened from a notification (#catat), Catat kept across an update reload, notifications kept in sync
  pushBoot();
  hideSplash();

  // Small debug handle for integration tests.
  window.__APP__ = {
    get state() { return state; },
    get today() { return today; },
    renderAll: () => renderAll(),
    reload: () => { load(); renderAll(); },
    // what holds back an automatic update reload (tests)
    get updateState() { return { pending: upd.pending, manual: upd.manual, busyMs: busyLeft(), busy: Object.keys(busyUntil), sheets: sheets.length, sinceInput: Date.now() - ui.lastInput, canReload: canReloadNow() }; },
    // shell height fix and keyboard state (tests, screen info)
    get viewport() { return { appH: shell.h, gap: shell.gap, kb: kbKey, panTries, log: kbLog.slice(), info: viewportInfo() }; },
    // notifications: what Settings shows and what runs (tests)
    get push() { return { view: pushState(), busy: pushUi.busy, err: pushUi.err && pushUi.err.kind, saved: pushSaved(), lastSync: pushUi.lastSync, hint: pasteHintShown() }; },
    // the notification inbox (tests): waiting ids, the setting, and a way to wait for the reads in flight
    get inbox() { return { ids: inbox.items.map((x) => x.n), optIn: inboxOptIn(), openN: inbox.entry && !inbox.entry.closed ? inbox.openN : '' }; },
    inboxSettled: () => inbox.queue.then(() => true, () => true)
  };
})();
</script>
