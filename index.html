  // Save label in two parts: on a narrow screen the words may end in an ellipsis, the amount (with the " · " before it)
  // never does. With shortKey a narrow screen (CSS, max-width 360px) shows the short words instead.
  function saveLabelHtml(key, slot, amount, vars, shortKey) {
    const MARK = '\u0001';
    const split = (k) => {
      const text = t(k, Object.assign({}, vars, { [slot]: MARK }));
      const i = text.indexOf(MARK);
      if (i < 0) return { text };
      const head = text.slice(0, i), sep = (head.match(/\s*·\s*$/) || [''])[0];
      return { head: head.slice(0, head.length - sep.length), tail: sep + amount + text.slice(i + 1) };
    };
    const a = split(key);
    if (a.text != null) return '<span class="sv-label">' + esc(a.text) + '</span>';
    const b = shortKey ? split(shortKey) : null;
    const words = b && b.head != null && b.head !== a.head
      ? '<span class="sv-long">' + esc(a.head) + '</span><span class="sv-short">' + esc(b.head) + '</span>'
      : esc(a.head);
    return '<span class="sv-label">' + words + '</span><span class="sv-total">' + esc(a.tail) + '</span>';
  }

  // Totals of parsed items per type: one signed figure when all share a type, else "Keluar X · Masuk Y".
  function parsedSummary(items) {
    const by = { EXPENSE: 0, INCOME: 0, TRANSFER: 0 };
    items.forEach((p) => { if (by[p.type] !== undefined) by[p.type] = roundAmt(by[p.type] + num(p.amount)); });
    const types = Object.keys(by).filter((k) => by[k] > 0);
    const parts = [];
    if (by.EXPENSE > 0) parts.push(t('catat.sumOut', { amount: fmt(by.EXPENSE) }));
    if (by.INCOME > 0) parts.push(t('catat.sumIn', { amount: fmt(by.INCOME) }));
    if (by.TRANSFER > 0) parts.push(t('catat.sumTr', { amount: fmt(by.TRANSFER) }));
    let single = null;
    if (types.length === 1) single = types[0] === 'INCOME' ? fmtSigned(by.INCOME) : fmt(by[types[0]]);
    return { single, parts: parts.join(' · ') };
  }

  // ---------- Render: Wallet tab ----------
  function goalNeed(g, saved) {
    if (!g.deadline || !isDayKey(g.deadline)) return null;
    const remaining = num(g.target) - saved;
    if (remaining <= 0) return { done: true };
    const days = num(safe(() => Core.diffDays(today, g.deadline), 0));
    if (days < 0) return { overdue: true, remaining };
    const months = Math.max(1, Math.round(days / 30.4375));
    const f = Math.pow(10, curDecimals());
    return { perMonth: Math.ceil(parseFloat((remaining / months * f).toPrecision(12))) / f, months };
  }
  function goalFootHtml(g, saved) {
    const target = num(g.target);
    const need = goalNeed(g, saved);
    if ((need && need.done) || (!need && target > 0 && saved >= target)) return '<span class="ok">' + T('goal.reached') + '</span>';
    if (need && need.overdue) return '<span class="late">' + T('goal.overdue', { amount: fmt(need.remaining) }) + '</span>';
    if (need) return '<span>' + T('goal.perMonth', { amount: fmt(need.perMonth) }) + '</span>';
    return '';
  }
  const goalPct = (saved, target) => target > 0 ? Math.max(0, Math.min(100, Math.round(saved / target * 100))) : 0;
  function goalCardHtml(g, saved) {
    const target = num(g.target);
    const pct = goalPct(saved, target);
    const foot = goalFootHtml(g, saved);
    const deadline = g.deadline && isDayKey(g.deadline) ? '<span>' + T('goal.deadlineOn', { date: dateLabel(g.deadline) }) + '</span>' : '';
    return '<button type="button" class="goal-item-card" data-action="goal-open" data-id="' + esc(g.id) + '">' +
      '<span class="goal-meta"><span class="g-name">' + esc(g.name) + '</span><span class="g-amt">' + esc(fmtC(saved)) + ' / ' + esc(fmtC(target)) + ' (' + pct + '%)</span></span>' +
      '<span class="bar-track" style="display:block"><span class="bar-fill" style="display:block;width:' + pct + '%"></span></span>' +
      (foot || deadline ? '<span class="goal-foot">' + (foot || '<span></span>') + deadline + '</span>' : '') + '</button>';
  }
  function renderWallet() {
    const bal = balances();
    const gs = goalSaved();
    const act = activeWallets();
    const arch = state.wallets.filter((w) => w.archived);
    const total = roundAmt(act.reduce((a, w) => a + num(bal[w.id]), 0));
    const inGoals = roundAmt(state.goals.reduce((a, g) => a + num(gs[g.id]), 0));
    const tEl = $('wtTotal');
    tEl.textContent = fmt(total);
    tEl.classList.toggle('neg', total < 0);
    $('wtGoalsSub').innerHTML = tHtml('wtab.inGoals', { amount: '<strong>' + esc(fmt(inGoals)) + '</strong>' });
    const def = defaultWalletId();
    const row = (w) => {
      const b = num(bal[w.id]);
      return '<button type="button" class="wallet-row-card' + (w.archived ? ' archived' : '') + '" data-action="wallet-open" data-id="' + esc(w.id) + '">' +
        '<span class="wallet-row-left"><span class="ob-wallet-dot" style="background:' + safeColor(w.color) + '"></span><span class="wr-name">' + esc(w.name) + '</span>' +
        (w.id === def && !w.archived ? '<span class="badge green">' + T('wallet.defaultBadge') + '</span>' : '') + '</span>' +
        '<span class="wallet-row-bal' + (b < 0 ? ' neg' : '') + '">' + esc(fmt(b)) + '</span></button>';
    };
    $('wtWallets').innerHTML = act.length ? act.map(row).join('') : '<p class="muted-note">' + T('wallet.none') + '</p>';
    $('wtArchived').innerHTML = arch.length
      ? '<button type="button" class="archived-toggle" data-action="toggle-archived" aria-expanded="' + ui.archivedOpen + '">' + ICON.chevR + '<span>' + T('wallet.archivedGroup', { n: arch.length }) + '</span></button>' +
        (ui.archivedOpen ? '<div class="wallet-list-vertical" style="margin-top:8px">' + arch.map(row).join('') + '</div>' : '')
      : '';
    const goals = liveGoals();
    $('wtGoals').innerHTML = goals.length
      ? goals.map((g) => goalCardHtml(g, num(gs[g.id]))).join('')
      : '<p class="muted-note">' + T('wtab.noGoals') + '</p>';
  }

  function renderAll() {
    applyI18n();
    renderStorageBanner();
    renderHeader();
    renderHome();
    renderCatat();
    renderWallet();
    if (!$('onboarding').hidden) renderOnboarding();
    sheets.slice().forEach((s) => { if (!s.closed && s.update) { try { s.update(); } catch (e) { console.error(e); } } });
  }

  // ---------- Bottom sheets (stacked modal dialogs inside the app frame) ----------
  const sheets = [];
  let sheetSeq = 0;
  const topSheet = () => sheets[sheets.length - 1] || null;
  function setInert(el, on) {
    if (!el) return;
    el.inert = on;
    if (on) { el.setAttribute('inert', ''); el.setAttribute('aria-hidden', 'true'); } else { el.removeAttribute('inert'); el.removeAttribute('aria-hidden'); }
  }
  function syncModalState() {
    const obOpen = !$('onboarding').hidden;
    const any = sheets.length > 0;
    setInert($('appMain'), any || obOpen);
    setInert($('onboarding'), any && obOpen);
    sheets.forEach((s, i) => setInert(s.layer, i < sheets.length - 1));
    appEl.classList.toggle('sheet-open', any);
    appEl.classList.toggle('ob-open', obOpen);
  }
  function focusEl(el) { if (!el) return; try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); } }
  // A double tap must not land on whatever appears under the finger after a sheet opens/closes or a save.
  function guardTaps(ms) { ui.ignoreClicksUntil = Math.max(ui.ignoreClicksUntil, performance.now() + (ms || 400)); }

  // Android/browser Back closes the top sheet instead of leaving the app: one history entry
  // stands for "a sheet is open" (synced after the current task, so close+open in one go is a no-op).
  const hist = { armed: false, skip: 0, timer: 0, skipTimer: 0, hash: '' };
  function syncHistory() {
    clearTimeout(hist.timer);
    hist.timer = setTimeout(() => {
      const want = sheets.length > 0;
      try {
        if (want && !hist.armed) { history.pushState({ moneyappSheet: true }, ''); hist.armed = true; hist.hash = location.hash; } else if (!want && hist.armed) {
          hist.armed = false;
          hist.skip++;
          clearTimeout(hist.skipTimer);
          hist.skipTimer = setTimeout(() => { hist.skip = 0; }, 1500);
          history.back();
        }
      } catch (_) { /* history not available here */ }
    }, 0);
  }
  window.addEventListener('popstate', () => {
    if (hist.skip > 0) { hist.skip--; return; }
    if (!hist.armed) return;
    // A link into the running app (a notification opening index.html#catat) is a fragment navigation, which fires
    // popstate too. It lands on a new entry with another fragment, not on the entry under the sheet's (that one has
    // the sheet's URL), so it is not Back: the sheet stays, with what was typed in it, and hashchange routes it.
    if (location.hash !== hist.hash) return;
    hist.armed = false;
    const top = topSheet();
    if (top) closeSheet(top);
  });

  // Drag the handle or header down to dismiss.
  function enableSwipe(entry) {
    const sheet = entry.el;
    const inZone = (t) => !!t.closest('.sheet-grab, .sheet-head') && !t.closest('button, a, input, select, textarea');
    let startY = 0, lastY = 0, lastT = 0, vel = 0, id = null;
    sheet.addEventListener('pointerdown', (e) => {
      if (id !== null || (e.pointerType === 'mouse' && e.button !== 0) || !inZone(e.target)) return;
      id = e.pointerId; startY = lastY = e.clientY; lastT = performance.now(); vel = 0;
      try { sheet.setPointerCapture(id); } catch (_) { /* ignore */ }
      sheet.style.animation = 'none';
      sheet.style.transition = 'none';
    });
    sheet.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      const now = performance.now();
      vel = (e.clientY - lastY) / Math.max(1, now - lastT);
      lastY = e.clientY; lastT = now;
      sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
    });
    const end = (e) => {
      if (e.pointerId !== id) return;
      id = null;
      const dy = Math.max(0, lastY - startY);
      sheet.style.transition = '';
      if (!entry.closed && (dy > 120 || (vel > 0.5 && dy > 30))) { entry.layer.classList.add('swiped'); closeSheet(entry); return; }
      sheet.style.transform = '';
    };
    sheet.addEventListener('pointerup', end);
    sheet.addEventListener('pointercancel', end);
  }

  function openSheet(cfg) {
    const existing = sheets.find((s) => s.id === cfg.id);
    if (existing) closeSheet(existing, true);
    // the update notice would sit over the sheet's header (toasts move to the top while a sheet is open); it comes
    // back, or the app reloads, once the sheets are closed
    if (document.querySelector('#toastHost .toast[data-kind="update"]')) hideToast();
    const n = ++sheetSeq;
    const titleId = 'sheetTitle' + n;
    const layer = document.createElement('div');
    layer.className = 'sheet-layer' + (cfg.cls ? ' ' + cfg.cls : '');
    layer.innerHTML = '<div class="sheet-backdrop" data-action="sheet-dismiss"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + titleId + '" tabindex="-1">' +
      '<div class="sheet-grab" aria-hidden="true"></div>' +
      '<div class="sheet-head"><h2 class="sheet-title" id="' + titleId + '">' + esc(cfg.title || '') + '</h2>' +
      '<button type="button" class="sheet-close" data-action="sheet-dismiss" aria-label="' + T('a11y.close') + '">' + ICON.close + '</button></div>' +
      '<div class="sheet-body">' + (cfg.body || '') + '</div><div class="sheet-foot">' + (cfg.foot || '') + '</div></div>';
    $('sheetRoot').appendChild(layer);
    const entry = {
      id: cfg.id, layer, el: layer.querySelector('.sheet'), body: layer.querySelector('.sheet-body'),
      foot: layer.querySelector('.sheet-foot'), titleEl: layer.querySelector('.sheet-title'),
      actions: cfg.actions || {}, onClose: cfg.onClose, update: cfg.update, closed: false,
      returnFocus: document.activeElement
    };
    entry.q = (sel) => layer.querySelector(sel);
    entry.qa = (sel) => Array.from(layer.querySelectorAll(sel));
    sheets.push(entry);
    syncModalState();
    focusEl((cfg.focus && layer.querySelector(cfg.focus)) || entry.el);
    enableSwipe(entry);
    guardTaps(320);
    syncHistory();
    return entry;
  }
  function closeSheet(entry, immediate) {
    entry = entry || topSheet();
    if (!entry || entry.closed) return;
    entry.closed = true;
    const i = sheets.indexOf(entry);
    if (i >= 0) sheets.splice(i, 1);
    try { if (entry.onClose) entry.onClose(); } catch (e) { console.error(e); }
    const layer = entry.layer;
    if (immediate || reducedMotion()) layer.remove();
    else {
      // a sheet that was dragged (and sprang back) gets its closing animation back
      if (!layer.classList.contains('swiped')) entry.el.style.animation = '';
      layer.classList.add('closing'); layer.style.pointerEvents = 'none'; setTimeout(() => layer.remove(), 200);
    }
    guardTaps(320);
    syncHistory();
    syncModalState();
    const rf = entry.returnFocus;
    if (rf && rf.isConnected && !rf.closest('[inert]') && !rf.closest('[hidden]') && typeof rf.focus === 'function') focusEl(rf);
    else if (topSheet()) focusEl(topSheet().el);
    if (!sheets.length) notifyIdle();
  }
  function closeAllSheets() { while (sheets.length) closeSheet(topSheet(), true); }
  function revokeUrl(u) { if (u) { try { URL.revokeObjectURL(u); } catch (_) { /* ignore */ } } }

  function walletChips(list, selected, action, disabledId) {
    return list.map((w) => {
      const on = w.id === selected;
      const dis = disabledId && w.id === disabledId;
      return '<button type="button" class="w-pill' + (on ? ' active' : '') + '" role="radio" aria-checked="' + on + '" data-action="' + action + '" data-id="' + esc(w.id) + '"' + (dis ? ' disabled' : '') + '>' +
        '<span class="wallet-dot" style="background:' + safeColor(w.color) + '"></span><span>' + esc(w.archived ? t('tx.archivedSuffix', { name: w.name }) : w.name) + '</span></button>';
    }).join('');
  }
  // Amount input with the currency symbol shown inside the field.
  function amountInput(id, cls, attrs) {
    const sym = (Core.CURRENCIES[cur()] || {}).symbol || '';
    return '<div class="amount-wrap"><span class="amount-prefix" aria-hidden="true">' + esc(sym) + '</span>' +
      '<input id="' + id + '" class="ob-input ' + cls + ' has-prefix" type="text" inputmode="decimal" autocomplete="off" data-amount-field="1" ' + attrs + '></div>';
  }
  function amountField(id, labelKey, extra) {
    extra = extra || '';
    return '<div class="field"><label class="field-label" for="' + id + '">' + T(labelKey) + '</label>' +
      amountInput(id, 'amount-input', extra + ' placeholder="' + T(curDecimals() ? 'tx.amountPhDec' : 'tx.amountPh') + '"') +
      '<span class="field-hint" data-amount-hint></span><span class="field-error" id="' + id + 'Err"></span></div>';
  }
  // Two-step destructive button: first tap arms for 3s, second tap confirms (not a double tap).
  function armButton(holder, btn, labelKey, confirmKey) {
    if (holder.armed) {
      if (performance.now() - holder.armedAt < 450) return false;
      clearTimeout(holder.armTimer); holder.armed = false; return true;
    }
    holder.armed = true;
    holder.armedAt = performance.now();
    btn.classList.add('armed');
    const span = btn.querySelector('span');
    if (span) span.textContent = t(confirmKey);
    holder.armTimer = setTimeout(() => {
      holder.armed = false;
      if (btn.isConnected) { btn.classList.remove('armed'); if (span) span.textContent = t(labelKey); }
    }, 3000);
    return false;
  }

  // ---------- Generic confirm sheet ----------
  function confirmSheet(o) {
    const body = '<div class="sheet-text"><p>' + esc(o.message) + '</p></div>' +
      (o.word ? '<div class="field"><label class="field-label" for="cfWord">' + T('reset.typeLabel', { word: o.word }) + '</label>' +
        '<input id="cfWord" class="ob-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>' : '');
    const foot = '<button type="button" class="btn-secondary" data-action="cf-cancel">' + T('confirm.cancel') + '</button>' +
      '<button type="button" class="' + (o.danger ? 'btn-danger' : 'btn-primary') + '" style="flex:1" data-action="cf-ok"' + (o.word ? ' disabled' : '') + '>' + esc(o.confirmLabel) + '</button>';
    const entry = openSheet({
      id: 'confirm', title: o.title, body, foot, focus: o.word ? '#cfWord' : '[data-action="cf-cancel"]',
      actions: {
        'cf-cancel': () => closeSheet(entry),
        'cf-ok': () => { closeSheet(entry, true); o.onConfirm(); }
      }
    });
    if (o.word) {
      const inp = entry.q('#cfWord');
      const ok = entry.q('[data-action="cf-ok"]');
      inp.addEventListener('input', () => { ok.disabled = inp.value.trim().toUpperCase() !== o.word.toUpperCase(); });
    }
    return entry;
  }

  // ---------- Transaction sheet (create / edit) ----------
  function deleteTxWithUndo(id) {
    const idx = state.transactions.findIndex((x) => x.id === id);
    if (idx < 0) return;
    const removed = state.transactions[idx];
    if (!commit((s) => { s.transactions.splice(idx, 1); })) return;
    toast(t('tx.deleted'), {
      duration: 5000,
      action: {
        label: t('undo'),
        fn: () => {
          if (state.transactions.some((x) => x.id === removed.id)) return;
          commit((s) => { s.transactions.splice(Math.min(idx, s.transactions.length), 0, removed); });
          toast(t('tx.restored'));
        }
      }
    });
  }

  // ---------- Possible duplicates (rows read from a screenshot, receipt or pasted text) ----------
  // "Kopi" vs "Kopi Kenangan Margonda": similar (Core.titlesSimilar: the notification inbox uses the same rule)
  const titlesSimilar = (a, b) => safe(() => Core.titlesSimilar(a, b), true);
  // Same type, same amount, same day and a similar title (or the same category when the saved row has no own title).
  function findDuplicate(c, exceptId) {
    if (!(num(c.amount) > 0) || !isDayKey(c.day)) return null;
    const hits = state.transactions.filter((x) => x.id !== exceptId && x.type === c.type && Math.abs(num(x.amount) - c.amount) < 0.005 &&
      String(x.date).slice(0, 10) === c.day &&
      (titlesSimilar(x.title, c.title) || (!!c.category && x.category === c.category && (!x.title || x.title === catLabel(x.category)))));
    hits.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    return hits[0] || null;
  }
  function dupLineText(x) {
    const title = x.title || (x.type === 'TRANSFER' ? t('tx.transferTitle', { from: walletName(x.walletId), to: walletName(x.toWalletId) }) : catLabel(x.category));
    return [title, fmt(x.amount), String(x.date).slice(11, 16), txWalletText(x)].filter(Boolean).join(' · ');
  }
  const UNSURE_SEL = { amount: '#txAmount', title: '#txTitle', wallet: '#txWallets, #txFrom', to: '#txTo', date: '#txDate', time: '#txTime' };

  // opts: txId (edit) | prefill {type, amount, title, category, walletId, toWalletId, day, time, note, source}
  //   previewUrl: picture shown in the sheet (revoked on close); notice/noticeType: a message line
  //   read: { head, sub, extra, failed, unsure: [field keys], fee } for rows read from a screenshot/receipt/pasted text
  //   dupCheck: warn when the same row seems to be recorded already; focus: selector (null = the sheet); onSaved(rec)
  function openTxSheet(opts) {
    opts = opts || {};
    const editing = opts.txId ? state.transactions.find((x) => x.id === opts.txId) : null;
    if (opts.txId && !editing) { toast(t('err.txMissing'), { type: 'error' }); return null; }
    if (editing && (editing.type === 'GOAL_IN' || editing.type === 'GOAL_OUT')) return openGoalTxSheet(editing);
    const p = opts.prefill || {};
    const act = activeWallets();
    if (!editing && !act.length) {
      revokeUrl(opts.previewUrl);
      toast(t('err.needWallet'), { type: 'error', action: { label: t('catat.addWallet'), fn: () => openWalletSheet(null) } });
      return null;
    }
    if (!editing && p.type === 'TRANSFER' && act.length < 2) { toast(t('err.transferNeed2'), { type: 'error' }); return null; }

    const pickList = () => {
      const list = activeWallets();
      if (editing) [editing.walletId, editing.toWalletId].forEach((id) => { const w = walletById(id); if (w && w.archived && list.indexOf(w) < 0) list.push(w); });
      return list;
    };
    const pickOther = (id) => { const o = pickList().find((w) => w.id !== id && !w.archived); return o ? o.id : null; };
    const pw = walletById(p.walletId);
    const f = {
      type: editing ? editing.type : (['EXPENSE', 'INCOME', 'TRANSFER'].includes(p.type) ? p.type : 'EXPENSE'),
      category: editing ? editing.category : (p.category || null),
      catTouched: !!editing,
      walletId: editing ? editing.walletId : (pw && !pw.archived ? pw.id : defaultWalletId()),
      toWalletId: editing ? editing.toWalletId : (p.toWalletId || null),
      source: editing ? editing.source : (p.source || 'MANUAL'),
      armed: false, armTimer: 0
    };
    const ensureTransfer = () => {
      if (f.type !== 'TRANSFER') return;
      if (!walletById(f.walletId)) f.walletId = defaultWalletId();
      if (!walletById(f.toWalletId) || f.toWalletId === f.walletId) f.toWalletId = pickOther(f.walletId);
    };
    if (f.type !== 'TRANSFER' && !catValid(f.category, f.type)) f.category = catFor(p.title || '', f.type);
    ensureTransfer();
    const now = localNow();
    const day = editing ? String(editing.date).slice(0, 10) : (isDayKey(p.day) ? p.day : today);
    const time = editing ? String(editing.date).slice(11, 16) : (isTime(p.time) ? p.time : now.time);
    const previewUrl = opts.previewUrl || null;
    const rd = !editing && opts.read ? opts.read : null;
    const fee = rd && num(rd.fee) > 0 ? roundAmt(rd.fee) : 0;
    const readHtml = !rd ? '' : '<div class="read-card' + (rd.failed ? ' failed' : '') + '">' +
      (previewUrl
        ? '<button type="button" class="read-thumb" data-action="toggle-preview" aria-expanded="false" aria-label="' + T(rd.thumbKey || 'shot.thumbAria') + '"><img src="' + esc(previewUrl) + '" alt=""></button>'
        : '<span class="read-icon" aria-hidden="true">' + ICON.paste + '</span>') +
      '<div class="read-meta"><strong>' + esc(rd.head || '') + '</strong>' +
      (rd.sub ? '<small>' + esc(rd.sub) + '</small>' : '') +
      (rd.unsure && rd.unsure.length ? '<small class="read-warn"></small>' : '') +
      (rd.onScreen ? '<small class="read-warn read-amt">' + esc(rd.onScreen) + '</small>' : '') +
      (rd.extra ? '<small>' + esc(rd.extra) + '</small>' : '') + '</div>' +
      // an item waiting in "Menunggu dicatat" can be dropped from here, without saving it
      (rd.discard ? '<button type="button" class="btn-secondary read-discard" data-action="read-discard" aria-label="' + T('inbox.discardAria') + '">' + ICON.trash + '<span>' + T('inbox.discard') + '</span></button>' : '') +
      '</div>';

    const body =
      readHtml +
      (opts.dupCheck && !editing ? '<div class="notice warn dup-note" id="txDup" role="status" hidden></div>' : '') +
      '<div class="seg-3" role="radiogroup" aria-label="' + T('tx.typeAria') + '" id="txTypes"></div>' +
      (previewUrl && !rd ? '<button type="button" class="receipt-preview" data-action="toggle-preview" aria-label="' + T('tx.receiptAlt') + '"><img src="' + esc(previewUrl) + '" alt="' + T('tx.receiptAlt') + '"></button>' : '') +
      (opts.notice ? '<div class="notice ' + (opts.noticeType === 'warn' ? 'warn' : 'info') + '">' + esc(opts.notice) + '</div>' : '') +
      amountField('txAmount', 'tx.amount', 'data-enter="tx-save"') +
      '<div class="field"><label class="field-label" for="txTitle">' + T('tx.title') + '</label>' +
      '<input id="txTitle" class="ob-input" type="text" maxlength="80" autocomplete="off" data-enter="tx-save" placeholder="' + T('tx.titlePh') + '"></div>' +
      '<div class="field" data-show="cat"><span class="field-label" id="txCatL">' + T('tx.category') + '</span><div class="chip-row" id="txCats" role="radiogroup" aria-labelledby="txCatL"></div></div>' +
      '<div class="field" data-show="wallet"><span class="field-label" id="txWalletL">' + T('tx.wallet') + '</span><div class="chip-row" id="txWallets" role="radiogroup" aria-labelledby="txWalletL"></div></div>' +
      '<div class="field" data-show="transfer"><span class="field-label" id="txFromL">' + T('tx.from') + '</span><div class="chip-row" id="txFrom" role="radiogroup" aria-labelledby="txFromL"></div></div>' +
      '<div class="field" data-show="transfer"><span class="field-label" id="txToL">' + T('tx.to') + '</span><div class="chip-row" id="txTo" role="radiogroup" aria-labelledby="txToL"></div></div>' +
      // the fee is pre-checked only when the paying wallet was read from the screen, not guessed
      (fee ? '<label class="check-row" data-show="transfer"><input type="checkbox" id="txFee"' + (rd.feeOff ? '' : ' checked') + '><span id="txFeeText"></span></label>' : '') +
      '<span class="field-error" id="txWalletErr"></span>' +
      '<div class="field-row">' +
      '<div class="field"><label class="field-label" for="txDate">' + T('tx.date') + '</label><input id="txDate" class="ob-input" type="date"></div>' +
      '<div class="field"><label class="field-label" for="txTime">' + T('tx.time') + '</label><input id="txTime" class="ob-input" type="time"></div></div>' +
      '<span class="field-hint" id="txDateHint"></span><span class="field-error" id="txDateErr"></span>' +
      '<div class="field"><label class="field-label" for="txNote">' + T('tx.note') + '</label>' +
      '<textarea id="txNote" class="ob-input" rows="2" maxlength="300" placeholder="' + T('tx.notePh') + '"></textarea></div>' +
      (editing ? '<p class="field-hint">' + T('tx.source', { src: t('src.' + editing.source) }) + '</p>' : '');
    const foot = (editing ? '<button type="button" class="btn-danger" data-action="tx-delete">' + ICON.trash + '<span>' + T('tx.delete') + '</span></button>' : '') +
      '<button type="button" class="btn-primary" data-action="tx-save">' + T(editing ? 'tx.saveEdit' : 'tx.save') + '</button>';

    const sheetTitle = () => t(editing ? 'tx.editTitle' : (f.type === 'TRANSFER' ? 'tx.transferNewTitle' : 'tx.newTitle'));
    const gone = () => !!editing && !state.transactions.some((x) => x.id === editing.id);
    const entry = openSheet({
      id: 'tx', title: sheetTitle(), body, foot,
      focus: editing ? null : (opts.focus !== undefined ? opts.focus : '#txAmount'),
      onClose: () => { clearTimeout(f.armTimer); revokeUrl(previewUrl); },
      // another tab changed the data: keep what is typed, refresh choices
      update: () => {
        if (gone()) { closeSheet(entry, true); toast(t('err.txMissing'), { type: 'error' }); return; }
        if (!walletById(f.walletId)) f.walletId = defaultWalletId();
        ensureTransfer();
        draw();
        checkDup();
      },
      actions: {
        'tx-type': (el) => {
          const ty = el.dataset.type;
          if (ty === f.type) return;
          if (ty === 'TRANSFER' && pickList().filter((w) => !w.archived).length < 2) { toast(t('err.transferNeed2'), { type: 'error' }); return; }
          f.type = ty;
          if (ty !== 'TRANSFER' && !catValid(f.category, ty)) { f.category = catFor(entry.q('#txTitle').value, ty); f.catTouched = false; }
          ensureTransfer();
          draw();
          checkDup();
        },
        'tx-cat': (el) => { f.category = el.dataset.id; f.catTouched = true; draw(); checkDup(); },
        'tx-wallet': (el) => { f.walletId = el.dataset.id; entry.q('#txWalletErr').textContent = ''; clearUnsure('wallet'); draw(); },
        'tx-from': (el) => { f.walletId = el.dataset.id; if (f.toWalletId === f.walletId) f.toWalletId = pickOther(f.walletId); entry.q('#txWalletErr').textContent = ''; clearUnsure('wallet'); draw(); },
        'tx-to': (el) => { f.toWalletId = el.dataset.id; entry.q('#txWalletErr').textContent = ''; clearUnsure('to'); draw(); },
        'tx-save': () => saveTx(),
        'tx-delete': (el) => {
          if (!armButton(f, el, 'tx.delete', 'tx.confirmDelete')) return;
          closeSheet(entry);
          deleteTxWithUndo(editing.id);
        },
        'read-discard': () => { const fn = rd && rd.discard; closeSheet(entry); if (fn) fn(); },
        'toggle-preview': (el) => {

    function draw() {
      const q = entry.q;
      entry.titleEl.textContent = sheetTitle();
      q('#txTitle').setAttribute('placeholder', t(f.type === 'TRANSFER' ? 'tx.transferTitlePh' : 'tx.titlePh'));
      q('#txTypes').innerHTML = ['EXPENSE', 'INCOME', 'TRANSFER'].map((ty) => '<button type="button" class="ob-seg-btn' + (f.type === ty ? ' active' : '') + '" role="radio" aria-checked="' + (f.type === ty) + '" data-action="tx-type" data-type="' + ty + '">' + T('type.' + ty) + '</button>').join('');
      const isTr = f.type === 'TRANSFER';
      entry.qa('[data-show="cat"],[data-show="wallet"]').forEach((n) => { n.hidden = isTr; });

        q('#txCats').innerHTML = catList(f.type).map((c) => {
          const on = c.id === f.category;
          return '<button type="button" class="w-pill' + (on ? ' active' : '') + '" role="radio" aria-checked="' + on + '" data-action="tx-cat" data-id="' + esc(c.id) + '"><span class="wallet-dot" style="background:' + safeColor(c.color) + '"></span><span>' + esc(catLabel(c.id)) + '</span></button>';
        }).join('');
        q('#txWallets').innerHTML = walletChips(pickList(), f.walletId, 'tx-wallet');
      } else {
        q('#txFrom').innerHTML = walletChips(pickList(), f.walletId, 'tx-from');
        q('#txTo').innerHTML = walletChips(pickList(), f.toWalletId, 'tx-to', f.walletId);
      }

      refreshUnsureNote();
    }
    // "Belum kebaca: Wallet, Jam" in the read card, for marks that may be below the fold
    function refreshUnsureNote() {
      const note = entry.q('.read-warn:not(.read-amt)');
      if (!note) return;
      const names = { amount: t('tx.amount'), title: t('tx.title'), wallet: f.type === 'TRANSFER' ? t('shot.fieldFrom') : t('tx.wallet'), to: t('shot.fieldTo'), date: t('tx.date'), time: t('tx.time') };
      const keys = [];
      entry.qa('.field.unsure').forEach((field) => { const k = field.dataset.unsure; if (keys.indexOf(k) < 0 && !(k === 'to' && f.type !== 'TRANSFER')) keys.push(k); });
      note.hidden = !keys.length;
      note.textContent = t('shot.unsureList', { fields: keys.map((k) => names[k]).join(', ') });
    }

    // Fields a screenshot/receipt did not give are marked until they are edited or chosen.
    function markUnsure(key) {
      entry.qa(UNSURE_SEL[key] || '#none').forEach((n) => {
        const field = n.closest('.field');
        if (!field || field.classList.contains('unsure')) return;
        field.classList.add('unsure');
        field.dataset.unsure = key;
        const label = field.querySelector('.field-label');
        if (label) { const tag = document.createElement('span'); tag.className = 'unsure-tag'; tag.textContent = t('shot.unsure'); label.appendChild(tag); }
      });
    }
    function clearUnsure(key) {
      entry.qa('.field.unsure').forEach((field) => {
        if (field.dataset.unsure !== key) return;
        field.classList.remove('unsure');
        const tag = field.querySelector('.unsure-tag');
        if (tag) tag.remove();
      });
      refreshUnsureNote();
    }
    function checkDup() {
      const box = entry.q('#txDup');
      if (!box) return;
      const amt = parseAmt(entry.q('#txAmount').value);
      const hit = amt ? findDuplicate({ type: f.type, amount: roundAmt(amt), day: entry.q('#txDate').value, title: entry.q('#txTitle').value, category: f.type === 'TRANSFER' ? 'transfer' : f.category }) : null;
      box.hidden = !hit;
      box.innerHTML = hit ? '<strong>' + T('shot.dup') + '</strong><span>' + esc(dupLineText(hit)) + '</span>' : '';
    }

    function saveTx() {
      const q = entry.q;
      ['#txAmountErr', '#txWalletErr', '#txDateErr'].forEach((s) => { q(s).textContent = ''; });
      q('#txAmount').classList.remove('invalid');
      let bad = null;
      if (gone()) { closeSheet(entry); toast(t('err.txMissing'), { type: 'error' }); return; }
      let amount = parseAmt(q('#txAmount').value);
      if (amount != null) amount = roundAmt(amount);
      if (!amount || amount <= 0) { q('#txAmountErr').textContent = amountErr(q('#txAmount').value); q('#txAmount').classList.add('invalid'); bad = bad || q('#txAmount'); }
      const isTr = f.type === 'TRANSFER';
      if (!walletById(f.walletId) || (isTr && !walletById(f.toWalletId))) { q('#txWalletErr').textContent = t('err.wallet'); bad = bad || q('#txWalletErr'); }
      else if (isTr && f.toWalletId === f.walletId) { q('#txWalletErr').textContent = t('err.transferSame'); bad = bad || q('#txWalletErr'); }
      const d = q('#txDate').value;
      if (!isDayKey(d)) { q('#txDateErr').textContent = t('err.date'); bad = bad || q('#txDate'); }
      if (bad) { if (bad.focus && bad.tagName !== 'SPAN') focusEl(bad); else bad.scrollIntoView({ block: 'center' }); return; }
      const tm = isTime(q('#txTime').value) ? q('#txTime').value : localNow().time;
      const category = isTr ? 'transfer' : (catValid(f.category, f.type) ? f.category : catDefault(f.type));
      const feeOn = !!fee && isTr && !!q('#txFee') && q('#txFee').checked;
      let title = clampStr(q('#txTitle').value, 80);
      // an empty transfer title is rendered from the current wallet names, so renames stay correct
      if (!title && !isTr) title = catLabel(category);
      const rec = {
        id: editing ? editing.id : Core.uid(),
        type: f.type, amount,
        walletId: f.walletId,
        toWalletId: isTr ? f.toWalletId : null,
        goalId: null, category, title,
        note: clampStr(q('#txNote').value, 300),
        date: d + 'T' + tm,
        source: f.source,
        createdAt: editing ? editing.createdAt : stamp()
      };
      // a top-up's admin fee is paid on top of what arrives: its own expense from the same wallet
      const feeTitle = t('shot.feeTitle');
      const feeRec = feeOn ? {
        id: Core.uid(), type: 'EXPENSE', amount: fee, walletId: f.walletId, toWalletId: null, goalId: null,
        category: catFor(feeTitle, 'EXPENSE') === catDefault('EXPENSE') ? catFor('biaya admin', 'EXPENSE') : catFor(feeTitle, 'EXPENSE'),
        title: feeTitle, note: '', date: rec.date, source: f.source, createdAt: rec.createdAt
      } : null;
      const ok = commit((s) => {
        const i = editing ? s.transactions.findIndex((x) => x.id === editing.id) : -1;
        if (i >= 0) s.transactions[i] = rec; else s.transactions.push(rec);
        if (feeRec) s.transactions.push(feeRec);
      });
      if (!ok) return;
      closeSheet(entry);
      celebrate(rec.type === 'INCOME' ? fmtSigned(amount) : fmt(amount),
        (editing ? t('tx.updated') + ' · ' : '') + txWalletText(rec) + (feeRec ? ' · ' + feeTitle + ' ' + fmt(fee) : ''));
      if (typeof opts.onSaved === 'function') { try { opts.onSaved(rec); } catch (e) { console.error(e); } }
    }

    // initial values are set via .value so user text never touches innerHTML
    const q = entry.q;
    q('#txAmount').value = editing ? amountToField(editing.amount) : (num(p.amount) > 0 ? amountToField(p.amount) : '');
    q('#txTitle').value = editing ? (editing.title || '') : (p.title || '');
    q('#txDate').value = day;
    q('#txTime').value = isTime(time) ? time : now.time;
    q('#txNote').value = editing ? (editing.note || '') : (p.note || '');
    const dateHint = () => { const v = q('#txDate').value; q('#txDateHint').textContent = isDayKey(v) && v > today ? t('tx.futureHint') : ''; };
    q('#txDate').addEventListener('input', dateHint);
    q('#txDate').addEventListener('change', dateHint);
    dateHint();
    q('#txTitle').addEventListener('input', () => {
      if (f.catTouched || f.type === 'TRANSFER') return;
      const c = catFor(q('#txTitle').value, f.type);
      if (c !== f.category) { f.category = c; draw(); }
    });
    draw();
    if (rd) {
      (rd.unsure || []).forEach(markUnsure);
      refreshUnsureNote();
      const onEdit = (e) => {
        const field = e.target && e.target.closest ? e.target.closest('.field.unsure') : null;
        if (field) clearUnsure(field.dataset.unsure);
      };
      entry.layer.addEventListener('input', onEdit);
      entry.layer.addEventListener('change', onEdit);
    }
    if (entry.q('#txDup')) {
      ['#txAmount', '#txTitle', '#txDate'].forEach((sel) => { q(sel).addEventListener('input', checkDup); q(sel).addEventListener('change', checkDup); });
      checkDup();
    }
    return entry;
  }

  // ---------- Goal deposit/withdrawal edit sheet ----------
  function goalBalanceAfter(goalId, mutateTxs) {
    const copy = Object.assign({}, state, { transactions: state.transactions.map((x) => Object.assign({}, x)) });
    mutateTxs(copy.transactions);
    return num(safe(() => Core.goalBalances(copy), {})[goalId]);
  }
  function openGoalTxSheet(tx) {
    const f = { armed: false, armTimer: 0 };
    // rows of a deleted goal: amounts are frozen so the money stays where it went
    const g = goalById(tx.goalId);
    const locked = !!(g && g.deleted);
    const body =
      '<div class="notice info">' + T(tx.type === 'GOAL_IN' ? 'goaltx.in' : 'goaltx.out', { goal: goalName(tx.goalId), wallet: walletName(tx.walletId) }) + '</div>' +
      (locked ? '<p class="notice warn">' + T('goal.err.deletedLocked') + '</p>' : '') +
      amountField('gtAmount', 'tx.amount', 'data-enter="gt-save"') +
      '<div class="field-row">' +
      '<div class="field"><label class="field-label" for="gtDate">' + T('tx.date') + '</label><input id="gtDate" class="ob-input" type="date"></div>' +
      '<div class="field"><label class="field-label" for="gtTime">' + T('tx.time') + '</label><input id="gtTime" class="ob-input" type="time"></div></div>' +
      '<span class="field-error" id="gtDateErr"></span>' +
      '<div class="field"><label class="field-label" for="gtNote">' + T('tx.note') + '</label><textarea id="gtNote" class="ob-input" rows="2" maxlength="300" placeholder="' + T('tx.notePh') + '"></textarea></div>' +
      '<p class="field-hint">' + T('goal.notBudget') + '</p>';
    const foot = '<button type="button" class="btn-danger" data-action="gt-delete">' + ICON.trash + '<span>' + T('tx.delete') + '</span></button>' +
      '<button type="button" class="btn-primary" data-action="gt-save">' + T('tx.saveEdit') + '</button>';
    const entry = openSheet({
      id: 'tx', title: t('goaltx.title'), body, foot,
      onClose: () => clearTimeout(f.armTimer),
      actions: {
        'gt-save': () => {
          const q = entry.q;
          q('#gtAmountErr').textContent = '';
          q('#gtDateErr').textContent = '';
          let amount = parseAmt(q('#gtAmount').value);
          if (amount != null) amount = roundAmt(amount);
          if (!amount) { q('#gtAmountErr').textContent = amountErr(q('#gtAmount').value); focusEl(q('#gtAmount')); return; }
          if (locked && Math.abs(amount - num(tx.amount)) > 1e-9) { q('#gtAmountErr').textContent = t('goal.err.deletedLocked'); return; }
          const d = q('#gtDate').value;
          if (!isDayKey(d)) { q('#gtDateErr').textContent = t('err.date'); focusEl(q('#gtDate')); return; }
          const tm = isTime(q('#gtTime').value) ? q('#gtTime').value : String(tx.date).slice(11, 16);
          const after = goalBalanceAfter(tx.goalId, (list) => { const x = list.find((y) => y.id === tx.id); if (x) x.amount = amount; });
          if (after < -1e-9) { q('#gtAmountErr').textContent = t('err.goalNegative'); return; }
          const rec = Object.assign({}, tx, { amount, date: d + 'T' + (isTime(tm) ? tm : '12:00'), note: clampStr(q('#gtNote').value, 300) });
          if (!commit((s) => { const i = s.transactions.findIndex((x) => x.id === tx.id); if (i >= 0) s.transactions[i] = rec; })) return;
          closeSheet(entry);
          celebrate(fmt(amount), t('tx.updated') + ' · ' + txWalletText(rec));
        },
        'gt-delete': (el) => {
          if (locked) { toast(t('goal.err.deletedLocked'), { type: 'error' }); return; }
          const after = goalBalanceAfter(tx.goalId, (list) => { const i = list.findIndex((y) => y.id === tx.id); if (i >= 0) list.splice(i, 1); });
          if (after < -1e-9) { toast(t('err.goalNegative'), { type: 'error' }); return; }
          if (!armButton(f, el, 'tx.delete', 'tx.confirmDelete')) return;
          closeSheet(entry);
          deleteTxWithUndo(tx.id);
        }
      }
    });
    entry.q('#gtAmount').value = amountToField(tx.amount);
    if (locked) entry.q('#gtAmount').readOnly = true;
    entry.q('#gtDate').value = String(tx.date).slice(0, 10);
    entry.q('#gtTime').value = String(tx.date).slice(11, 16);
    entry.q('#gtNote').value = tx.note || '';
    return entry;
  }

  // ---------- Wallet sheet (add / manage) ----------
  function presetList() { return PRESETS.map((p) => ({ name: p[0] === 'Tunai' ? t('wallet.cashName') : p[0], color: p[1] })); }
  function presetChips(action) {
    return presetList().map((p) => '<button type="button" class="w-pill" data-action="' + action + '" data-name="' + esc(p.name) + '" data-color="' + p.color + '"' + (nameTaken(p.name) ? ' disabled' : '') + '>' +
      '<span class="wallet-dot" style="background:' + p.color + '"></span><span>' + esc(p.name) + '</span></button>').join('');
  }
  const nextSwatch = () => SWATCHES[state.wallets.length % SWATCHES.length];

  // opts.name (a new wallet): its name filled in, with its preset's colour; the starting balance is asked first
  function openWalletSheet(walletId, opts) {
    const w = walletId ? walletById(walletId) : null;
    if (walletId && !w) { toast(t('err.generic'), { type: 'error' }); return null; }
    const editing = !!w;
    // balance as of today; scheduled (future-dated) rows are shown separately
    const curBal = editing ? num(balances()[w.id]) : 0;
    const afterScheduled = editing ? num(balancesAll()[w.id]) : 0;
    const nTx = editing ? txCountForWallet(w.id) : 0;
    const named = !editing && opts && opts.name ? clampStr(opts.name, 24) : '';
    const preset = named ? presetList().find((p) => normName(p.name) === normName(named)) : null;
    const f = { color: editing ? safeColor(w.color) : (preset ? safeColor(preset.color) : nextSwatch()), armed: false, armTimer: 0 };

    let manage = '';
    if (editing) {
      const isDef = !w.archived && defaultWalletId() === w.id;
      manage = '<div class="divider"></div><div class="wallet-actions">' +
        '<button type="button" class="btn-secondary" data-action="w-activity">' + ICON.list + '<span>' + T('wallet.viewActivity') + '</span></button>' +
        (!w.archived ? '<button type="button" class="btn-secondary" data-action="w-default"' + (isDef ? ' disabled' : '') + '>' + ICON.star + '<span>' + T(isDef ? 'wallet.isDefault' : 'wallet.makeDefault') + '</span></button>' : '') +
        '<button type="button" class="btn-secondary" data-action="w-archive">' + ICON.archive + '<span>' + T(w.archived ? 'wallet.unarchive' : 'wallet.archive') + '</span></button>' +
        (nTx === 0 ? '<button type="button" class="btn-danger" data-action="w-delete">' + ICON.trash + '<span>' + T('wallet.delete') + '</span></button>' : '') +
        '</div>' + (nTx > 0 ? '<p class="notice">' + T('wallet.hasTx', { n: nTx }) + '</p>' : '');
    }
    const body =
      (editing ? '' : '<div class="field"><span class="field-label">' + T('wallet.presets') + '</span><div class="chip-row" id="wPresets">' + presetChips('w-preset') + '</div></div>') +
      '<div class="field"><label class="field-label" for="wName">' + T('wallet.name') + '</label>' +
      '<input id="wName" class="ob-input" type="text" maxlength="24" autocomplete="off" data-enter="w-save" placeholder="' + T('wallet.namePh') + '">' +
      '<span class="field-error" id="wNameErr"></span></div>' +
      '<div class="field"><label class="field-label" for="wBal">' + T(editing ? 'wallet.current' : 'wallet.initial') + '</label>' +
      amountInput('wBal', 'amount-input', 'data-signed="1" data-enter="w-save" placeholder="0"') +
      '<span class="field-hint" data-amount-hint></span><span class="field-hint">' + T(editing ? 'wallet.currentHint' : 'wallet.initialHint') + '</span>' +
      (editing && Math.abs(afterScheduled - curBal) > 1e-9 ? '<span class="field-hint">' + T('wallet.scheduledHint', { amount: fmt(afterScheduled) }) + '</span>' : '') +
      '<span class="field-error" id="wBalErr"></span></div>' +
      '<div class="field"><span class="field-label" id="wColorL">' + T('wallet.color') + '</span><div class="swatches" id="wColors" role="radiogroup" aria-labelledby="wColorL"></div></div>' +
      manage;
    const foot = '<button type="button" class="btn-primary" data-action="w-save">' + T(editing ? 'wallet.saveEdit' : 'wallet.save') + '</button>';

    const entry = openSheet({
      id: 'wallet', title: editing ? w.name : t('wallet.addTitle'), body, foot,
      focus: editing ? null : (named ? '#wBal' : '#wName'),
      onClose: () => clearTimeout(f.armTimer),
      actions: {
        'w-preset': (el) => { entry.q('#wName').value = el.dataset.name; f.color = safeColor(el.dataset.color); drawSwatches(); focusEl(entry.q('#wBal')); },
        'w-color': (el) => { f.color = safeColor(el.dataset.color); drawSwatches(); },
        'w-activity': () => { ui.walletFilter = w.id; ui.homeSeg = 'activity'; closeAllSheets(); switchTab('home'); renderHome(); },
        'w-default': (el) => {
          if (!commit((s) => { s.settings.defaultWalletId = w.id; })) return;
          el.disabled = true;
          const sp = el.querySelector('span'); if (sp) sp.textContent = t('wallet.isDefault');
          toast(t('wallet.defaultSet', { name: w.name }));
        },
        'w-archive': () => {
          if (!w.archived && activeWallets().length <= 1) { toast(t('wallet.lastActive'), { type: 'error' }); return; }
          const archiving = !w.archived;
          const ok = commit((s) => {
            const x = s.wallets.find((y) => y.id === w.id);
            if (x) x.archived = archiving;
            if (archiving && s.settings.defaultWalletId === w.id) s.settings.defaultWalletId = null;
          });
          if (!ok) return;
          closeSheet(entry);
          toast(t(archiving ? 'wallet.archived' : 'wallet.unarchived'));
        },
        'w-delete': (el) => {
          if (txCountForWallet(w.id) > 0) return;
          if (!w.archived && activeWallets().length <= 1) { toast(t('wallet.lastActive'), { type: 'error' }); return; }
          if (!armButton(f, el, 'wallet.delete', 'wallet.confirmDelete')) return;
          const ok = commit((s) => {
            s.wallets = s.wallets.filter((y) => y.id !== w.id);
            if (s.settings.defaultWalletId === w.id) s.settings.defaultWalletId = null;
          });
          if (!ok) return;
          if (ui.walletFilter === w.id) ui.walletFilter = null;
          closeSheet(entry);
          renderAll();
          toast(t('wallet.deleted'));
        },
        'w-save': () => saveWallet()
      }
    });

    function drawSwatches() {
      entry.q('#wColors').innerHTML = SWATCHES.map((c, i) => '<button type="button" class="swatch' + (c === f.color ? ' active' : '') + '" role="radio" aria-checked="' + (c === f.color) + '" aria-label="' + T('wallet.colorN', { n: i + 1 }) + '" data-action="w-color" data-color="' + c + '" style="background:' + c + '"></button>').join('');
    }
    function saveWallet() {
      const q = entry.q;
      q('#wNameErr').textContent = '';
      q('#wBalErr').textContent = '';
      const name = clampStr(q('#wName').value, 24);
      if (!name) { q('#wNameErr').textContent = t('wallet.err.name'); focusEl(q('#wName')); return; }
      if (nameTaken(name, editing ? w.id : null)) { q('#wNameErr').textContent = t('wallet.err.dup'); focusEl(q('#wName')); return; }
      let v = parseSigned(q('#wBal').value);
      if (v == null) { q('#wBalErr').textContent = t('wallet.err.balance'); focusEl(q('#wBal')); return; }
      v = roundAmt(v);
      if (!editing) {
        const id = Core.uid();
        const hadActive = activeWallets().length > 0;
        const ok = commit((s) => {
          s.wallets.push({ id, name, color: f.color, initialBalance: v, archived: false, createdAt: stamp() });
          if (!hadActive || !s.settings.defaultWalletId) s.settings.defaultWalletId = id;
        });
        if (!ok) return;
        closeSheet(entry);
        toast(t('wallet.added', { name }));
        return;
      }
      if (!walletById(w.id)) { closeSheet(entry); toast(t('err.generic'), { type: 'error' }); return; }
      // only adjust when the field was changed; use the balance as it is now (another tab may have added rows)
      const changed = Math.abs(v - roundAmt(curBal)) > 1e-9;
      const nowBal = num(balances()[w.id]);
      const ok = commit((s) => {
        const x = s.wallets.find((y) => y.id === w.id);
        if (!x) return;
        x.name = name;
        x.color = f.color;
        // balance is derived; adjusting it (as of today) shifts the starting balance only
        if (changed) x.initialBalance = roundAmt(v - (nowBal - num(x.initialBalance)));
      });
      if (!ok) return;
      closeSheet(entry);
      toast(t('wallet.updated'));
    }

    entry.q('#wName').value = editing ? w.name : named;
    entry.q('#wBal').value = editing ? signedToField(curBal) : '';
    drawSwatches();
    return entry;
  }

  // Deleting never touches transactions (Core.deleteGoal): wallet balances stay exactly as they are.
  function deleteGoalWithUndo(goalId) {
    const gi = state.goals.findIndex((g) => g.id === goalId);
    if (gi < 0) return;
    const goal = Object.assign({}, state.goals[gi]);
    if (!commit((s) => { s.goals = Core.deleteGoal(s, goalId).state.goals; })) return;
    toast(t('goal.deleted'), {
      duration: 5000,
      action: {
        label: t('undo'),
        fn: () => {
          commit((s) => {
            const i = s.goals.findIndex((g) => g.id === goal.id);
            if (i >= 0) s.goals[i] = Object.assign({}, s.goals[i], { deleted: false });
            else s.goals.splice(Math.min(gi, s.goals.length), 0, Object.assign(goal, { deleted: false }));
          });
        }
      }
    });
  }

      amountField('gTarget', 'goal.target', 'data-enter="g-details"') +
      '<div class="field"><label class="field-label" for="gDeadline">' + T('goal.deadline') + '</label><input id="gDeadline" class="ob-input" type="date"><span class="field-hint">' + T('goal.deadlineHint') + '</span></div>' +
      '<span class="field-error" id="gDetErr"></span>' +
      '<button type="button" class="btn-secondary block" data-action="g-details">' + T('goal.saveEdit') + '</button></section>' +

    const entry = openSheet({
      id: 'goal', title: g0.name, body, foot: '',
      update: () => drawSummary(),
      onClose: () => clearTimeout(f.armTimer),
      actions: {
        'g-mode': (el) => { f.mode = el.dataset.mode === 'out' ? 'out' : 'in'; entry.q('#gAmtErr').textContent = ''; drawMove(); },
        'g-wallet': (el) => { f.walletId = el.dataset.id; entry.q('#gWErr').textContent = ''; drawMove(); },
        'g-move': () => doMove(),
        'g-details': () => saveDetails(),
        'g-withdraw-all': () => {
          f.mode = 'out';
          setAmountField(entry.q('#gAmt'), num(goalSaved()[goalId]));
          drawMove();
          entry.q('#gAmt').scrollIntoView({ block: 'center' });
          focusEl(entry.q('#gAmt'));
        },
        'g-delete': (el) => {
          if (num(goalSaved()[goalId]) > 1e-9) return;
          if (!armButton(f, el, 'goal.delete', 'goal.confirmDelete')) return;
          closeSheet(entry);
          deleteGoalWithUndo(goalId);
        }
      }
    });

    function drawSummary() {
      const g = goalById(goalId);
      if (!g || g.deleted) { closeSheet(entry, true); return; }
      const saved = num(goalSaved()[g.id]);
      const pct = goalPct(saved, num(g.target));
      entry.titleEl.textContent = g.name;
      entry.q('#gSaved').textContent = fmt(saved);
      entry.q('#gProg').textContent = t('goal.progress', { saved: fmt(saved), target: fmt(num(g.target)), pct });
      entry.q('#gBar').style.width = pct + '%';
      const deadline = g.deadline && isDayKey(g.deadline) ? '<span>' + T('goal.deadlineOn', { date: dateLabel(g.deadline) }) + '</span>' : '';
      entry.q('#gNeed').innerHTML = (goalFootHtml(g, saved) || '<span></span>') + deadline;
      const del = entry.q('#gDel');
      del.innerHTML = saved > 1e-9
        ? '<p class="notice">' + T('goal.mustEmpty', { amount: fmt(saved) }) + '</p><button type="button" class="btn-secondary block" data-action="g-withdraw-all">' + T('goal.withdrawAll') + '</button>'
        : '<button type="button" class="btn-danger block" data-action="g-delete">' + ICON.trash + '<span>' + T('goal.delete') + '</span></button><p class="field-hint">' + T('goal.deleteNote') + '</p>';
      drawMove();
    }
    function drawMove() {
      const q = entry.q;
      q('#gModes').innerHTML = [['in', 'goal.deposit'], ['out', 'goal.withdraw']].map((m) => '<button type="button" class="ob-seg-btn' + (f.mode === m[0] ? ' active' : '') + '" role="radio" aria-checked="' + (f.mode === m[0]) + '" data-action="g-mode" data-mode="' + m[0] + '">' + T(m[1]) + '</button>').join('');
      q('#gWL').textContent = t(f.mode === 'in' ? 'goal.fromWallet' : 'goal.toWallet');
      const act = activeWallets();
      if (!act.some((w) => w.id === f.walletId)) f.walletId = defaultWalletId();
      q('#gWallets').innerHTML = act.length ? walletChips(act, f.walletId, 'g-wallet') : '<button type="button" class="w-pill add" data-action="wallet-add">' + T('catat.addWallet') + '</button>';
      updateMoveLabel();
    }
    function updateMoveLabel() {
      const v = parseAmt(entry.q('#gAmt').value);
      const key = f.mode === 'in' ? 'goal.doDeposit' : 'goal.doWithdraw';
      entry.q('#gMove').textContent = v ? t(key, { amount: fmt(roundAmt(v)) }) : t(f.mode === 'in' ? 'goal.deposit' : 'goal.withdraw');
    }
    function doMove() {
      const g = goalById(goalId);
      if (!g) return;
      const q = entry.q;
      q('#gAmtErr').textContent = '';
      q('#gWErr').textContent = '';
      let amount = parseAmt(q('#gAmt').value);
      if (amount != null) amount = roundAmt(amount);
      if (!amount) { q('#gAmtErr').textContent = amountErr(q('#gAmt').value); focusEl(q('#gAmt')); return; }
      const w = walletById(f.walletId);
      if (!w || w.archived) { q('#gWErr').textContent = t('err.wallet'); return; }
      const saved = num(goalSaved()[g.id]);
      if (f.mode === 'out') {
        if (saved <= 1e-9) { q('#gAmtErr').textContent = t('goal.err.nothing'); return; }
        if (amount > saved + 1e-9) { q('#gAmtErr').textContent = t('err.goalWithdrawMax', { amount: fmt(saved) }); return; }
      }
      const tx = {
        id: Core.uid(), type: f.mode === 'in' ? 'GOAL_IN' : 'GOAL_OUT', amount,
        walletId: w.id, toWalletId: null, goalId: g.id, category: 'goal',
        title: t(f.mode === 'in' ? 'goaltx.depositTitle' : 'goaltx.withdrawTitle', { goal: g.name }),
        note: '', date: today + 'T' + localNow().time, source: 'MANUAL', createdAt: stamp()
      };
      if (!commit((s) => { s.transactions.push(tx); })) return;
      // the commit redrew the button from the amount still in the field: clearing it goes through the field's
      // input listeners, so the button says "Setor" again instead of the amount just saved
      setAmountField(q('#gAmt'), '');
      celebrate(fmt(amount), t(f.mode === 'in' ? 'goal.deposited' : 'goal.withdrawn', { goal: g.name }));
    }
    function saveDetails() {
      const g = goalById(goalId);
      if (!g) return;
      const q = entry.q;
      q('#gDetErr').textContent = '';
      q('#gTargetErr').textContent = '';
      const name = clampStr(q('#gName').value, 40);
      if (!name) { q('#gDetErr').textContent = t('goal.err.name'); focusEl(q('#gName')); return; }
      let target = parseAmt(q('#gTarget').value);
      if (target != null) target = roundAmt(target);
      if (!target) { q('#gTargetErr').textContent = t('goal.err.target'); focusEl(q('#gTarget')); return; }
      const dl = q('#gDeadline').value;
      if (dl && !isDayKey(dl)) { q('#gDetErr').textContent = t('goal.err.deadline'); return; }
      if (!commit((s) => { const x = s.goals.find((y) => y.id === goalId); if (x) { x.name = name; x.target = target; x.deadline = dl || null; } })) return;
      toast(t('goal.updated'));
    }

    entry.q('#gName').value = g0.name;
    entry.q('#gTarget').value = amountToField(num(g0.target));
    entry.q('#gDeadline').value = g0.deadline && isDayKey(g0.deadline) ? g0.deadline : '';
    entry.q('#gAmt').addEventListener('input', updateMoveLabel);
    drawSummary();
    return entry;
  }

  // ---------- Downloads, backup, restore, reset ----------
  function appSlug() {
    const s = String(APP_NAME).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    return s || 'money';
  }
  function download(filename, content, mime) {
    try {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return true;
    } catch (e) {
      console.error(e);
      toast(t('err.generic'), { type: 'error' });
      return false;
    }
  }
  function exportCsv() {
    if (!state.transactions.length) { toast(t('settings.noTx')); return; }
    const csv = safe(() => Core.toCSV(state, lang()), null);
    if (csv == null) { toast(t('err.generic'), { type: 'error' }); return; }
    if (download(appSlug() + '-' + today + '.csv', csv, 'text/csv;charset=utf-8')) toast(t('settings.exported'));
  }
  function exportBackup() {
    const payload = { app: APP_NAME, version: Core.VERSION, exportedAt: new Date().toISOString(), state };
    if (download(appSlug() + '-' + today + '.json', JSON.stringify(payload, null, 2), 'application/json')) toast(t('settings.backedUp'));
  }
  function readFileText(file) {
    if (file.text) return file.text();
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ''));
      r.onerror = () => reject(r.error);
      r.readAsText(file);
    });
  }
  async function handleRestore(file) {
    if (!file) return;
    let text;
    try { text = await readFileText(file); } catch (_) { toast(t('restore.readFail'), { type: 'error' }); return; }
    let obj;
    try { obj = JSON.parse(text); } catch (_) { toast(t('restore.invalidJson'), { type: 'error', duration: 6000 }); return; }
    const res = safe(() => Core.validateBackup(obj), null);
    if (!res || !res.ok || !res.state) {
      toast(t('restore.invalid') + (res && res.error === 'unsupported_version' ? ': ' + t('restore.newer') : ''), { type: 'error', duration: 6000 });
      return;
    }
    const ns = res.state;
    let when = '';
    if (obj && typeof obj.exportedAt === 'string') {
      const d = new Date(obj.exportedAt);
      if (!isNaN(d)) when = dtf({ day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(d);
    }
    confirmSheet({
      title: t('restore.title'),
      message: t('restore.msg', { tx: (ns.transactions || []).length, w: (ns.wallets || []).length, date: when ? t('restore.dateSuffix', { date: when }) : '' }),
      confirmLabel: t('restore.confirm'),
      danger: true,
      onConfirm: () => {
        closeAllSheets();
        state = ns;
        ui.walletFilter = null;
        ui.dropped.clear();
        ui.savedRows = [];
        save();
        renderAll();
        if (!S().onboarded) openOnboarding(); else closeOnboarding();
        toast(t('restore.done'));
      }
    });
  }
  function resetAll() {
    const word = t('reset.word');
    confirmSheet({
      title: t('reset.title'), message: t('reset.msg'), confirmLabel: t('reset.confirm'), danger: true, word,
      onConfirm: () => {
        const keepLang = lang();
        stopVoice();
        closeAllSheets();
        // notifications are turned off too (this phone's token is deleted at the push Worker), and text a
        // notification left here is deleted
        pushForget();
        inboxForget();
        // every key of this app goes, including kept copies of unreadable data
        try {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('moneyapp.') === 0) keys.push(k); }
          keys.forEach((k) => localStorage.removeItem(k));
        } catch (_) { /* storage unavailable */ }
        corruptCopy = false;
        state = freshState();
        state.settings.lang = keepLang;
        ui.walletFilter = null;
        ui.homeSeg = 'activity';
        ui.dropped.clear();
        ui.savedRows = [];
        $('captionInput').value = '';
        save();
        renderAll();
        switchTab('home');
        openOnboarding();
        toast(t('reset.done'));
      }
    });
  }

  // When a budget is (re)entered: keep an earlier start that is still inside the current period
  // (clearing and retyping the budget must not restart it); otherwise it starts today.
  function budgetSinceFor(st) {
    const p = safe(() => Core.periodRange(today, st.periodStartDay), null);
    const prev = st.budgetSince;
    return isDayKey(prev) && p && prev >= p.start && prev <= today ? prev : today;
  }

  // ---------- Settings sheet ----------
  function openSettingsSheet(opts) {
    opts = opts || {};
    let builtKey = '';
    let nameTimer = 0;
    const entry = openSheet({
      id: 'settings', title: t('settings.title'), body: '', foot: '',
      onClose: () => { if (entry.noFlush) return; flushName(); flushBudget(true); },
      update: () => { if (builtKey !== lang() + cur()) build(); else refresh(); },
      actions: {
        'set-lang': (el) => { flushName(); commit((s) => { s.settings.lang = el.dataset.lang === 'en' ? 'en' : 'id'; }); },
        'set-cur': (el) => { const c = el.dataset.cur; if (!Core.CURRENCIES || !Core.CURRENCIES[c]) return; flushName(); commit((s) => { s.settings.currency = c; }); },
        'set-sound': () => { commit((s) => { s.settings.sound = !s.settings.sound; }); if (S().sound) playChime(); },
        'export-csv': () => exportCsv(),
        'backup-json': () => exportBackup(),
        'reset-all': () => resetAll(),
        'open-shot-tips': () => openShotTips(),
        // Notifikasi (09b_push.js); enabling asks for permission inside this tap
        'push-enable': () => pushEnable(),
        'push-copy': () => pushCopy(),
        'push-test': () => pushTest(),
        'push-off': (el) => pushDisable(el),
        'push-text': () => inboxToggle()
      }
    });
    function html() {
      const days = [];
      for (let d = 1; d <= 28; d++) days.push('<option value="' + d + '">' + T('settings.dayOption', { n: d }) + '</option>');
      const seg = (action, attr, val, label) => '<button type="button" class="ob-seg-btn" role="radio" data-action="' + action + '" data-' + attr + '="' + val + '">' + label + '</button>';
      return '<section class="settings-group"><h3>' + T('settings.profile') + '</h3>' +
        '<div class="field"><label class="field-label" for="setName">' + T('settings.name') + '</label><input id="setName" class="ob-input" type="text" maxlength="30" autocomplete="nickname" placeholder="' + T('settings.namePh') + '"></div></section>' +
        '<section class="settings-group"><h3>' + T('settings.display') + '</h3>' +
        '<div class="field"><span class="field-label" id="setLangL">' + T('settings.lang') + '</span><div class="ob-seg-group" role="radiogroup" aria-labelledby="setLangL">' +
        seg('set-lang', 'lang', 'id', 'Bahasa Indonesia') + seg('set-lang', 'lang', 'en', 'English') + '</div></div>' +
        '<div class="field"><span class="field-label" id="setCurL">' + T('settings.currency') + '</span><div class="ob-seg-4" role="radiogroup" aria-labelledby="setCurL">' +
        seg('set-cur', 'cur', 'IDR', 'IDR (Rp)') + seg('set-cur', 'cur', 'USD', 'USD ($)') + seg('set-cur', 'cur', 'SGD', 'SGD (S$)') + '</div>' +
        '<span class="field-hint">' + T('settings.currencyNote') + '</span></div></section>' +
        '<section class="settings-group"><h3>' + T('settings.budget') + '</h3>' +
        '<div class="field"><label class="field-label" for="setBudget">' + T('settings.monthlyBudget') + '</label>' +
        amountInput('setBudget', 'amount-input', 'placeholder="0"') +
        '<span class="field-hint" data-amount-hint></span><span class="field-hint">' + T('settings.budgetHint') + '</span><span class="field-error" id="setBudgetErr"></span></div>' +
        '<div class="field"><label class="field-label" for="setStart">' + T('settings.startDay') + '</label><select id="setStart" class="ob-input">' + days.join('') + '</select>' +
        '<span class="field-hint" id="setStartHint"></span></div></section>' +
        '<section class="settings-group"><h3>' + T('settings.other') + '</h3>' +
        '<div class="settings-row"><span class="sr-text"><strong id="setSoundL">' + T('settings.sound') + '</strong><small>' + T('settings.soundSub') + '</small></span>' +
        '<button type="button" class="switch" role="switch" aria-checked="false" aria-labelledby="setSoundL" data-action="set-sound" id="setSound"></button></div>' +
        '<button type="button" class="settings-row settings-link" data-action="open-shot-tips"><span class="sr-icon" aria-hidden="true">' + ICON.shot + '</span>' +
        '<span class="sr-text"><strong>' + T('tips.item') + '</strong><small>' + T('tips.itemSub') + '</small></span>' + ICON.chevR + '</button></section>' +
        '<section class="settings-group" id="setPushGroup"><h3>' + T('push.title') + '</h3><div id="setPush" class="push-box"></div></section>' +
        '<section class="settings-group"><h3>' + T('settings.data') + '</h3><p class="field-hint" id="setCounts"></p><div class="data-buttons">' +
        '<button type="button" class="btn-secondary" data-action="export-csv">' + ICON.table + '<span>' + T('settings.exportCsv') + '</span></button>' +
        '<button type="button" class="btn-secondary" data-action="backup-json">' + ICON.download + '<span>' + T('settings.backup') + '</span></button>' +
        '<label class="btn-secondary file-btn">' + ICON.upload + '<span>' + T('settings.restore') + '</span><input type="file" accept="application/json,.json" id="setRestore" class="visually-hidden"></label>' +
        '<button type="button" class="btn-danger" data-action="reset-all">' + ICON.trash + '<span>' + T('settings.reset') + '</span></button></div></section>' +
        '<section class="settings-group"><h3>' + T('settings.about') + '</h3>' +
        '<div class="about-card"><svg aria-hidden="true" focusable="false"><use href="#app-logo"/></svg><div><strong>' + esc(APP_NAME) + '</strong><small class="about-version" id="setVersion">' + T('settings.version', { v: Core.VERSION || '1.0.0' }) + '</small><small>' + T('tagline') + '</small></div></div>' +
        '<p class="notice warn">' + T('settings.storageNote') + '</p><p class="field-hint">' + T('settings.offlineNote') + '</p></section>';
    }
    function build() {
      builtKey = lang() + cur();
      entry.titleEl.textContent = t('settings.title');
      entry.body.innerHTML = html();
      const q = entry.q;
      q('#setName').value = S().name || '';
      q('#setBudget').value = num(S().monthlyBudget) > 0 ? amountToField(num(S().monthlyBudget)) : '';
      q('#setName').addEventListener('input', () => { clearTimeout(nameTimer); nameTimer = setTimeout(flushName, 400); });
      q('#setBudget').addEventListener('change', () => flushBudget(false));
      q('#setStart').addEventListener('change', () => {
        const d = Math.min(28, Math.max(1, parseInt(q('#setStart').value, 10) || 1));
        commit((s) => { s.settings.periodStartDay = d; });
      });
      q('#setRestore').addEventListener('change', (e) => { const file = e.target.files && e.target.files[0]; e.target.value = ''; handleRestore(file); });
      // hidden screen info for layout problems on a phone (press and hold "Versi ...")
      onLongPress(q('#setVersion'), () => openViewportDiag());
      pushUi.html = '';
      refresh();
    }
    function refresh() {
      const q = entry.q;
      entry.qa('[data-action="set-lang"]').forEach((b) => { const on = b.dataset.lang === lang(); b.classList.toggle('active', on); b.setAttribute('aria-checked', String(on)); });
      entry.qa('[data-action="set-cur"]').forEach((b) => { const on = b.dataset.cur === cur(); b.classList.toggle('active', on); b.setAttribute('aria-checked', String(on)); });
      q('#setStart').value = String(S().periodStartDay || 1);
      const p = safe(() => Core.periodRange(today, S().periodStartDay), null);
      q('#setStartHint').textContent = p ? t('settings.startHint', { range: periodRangeText(p) }) : '';
      q('#setSound').setAttribute('aria-checked', String(!!S().sound));
      q('#setCounts').textContent = t('settings.storageCount', { tx: state.transactions.length, w: state.wallets.length, g: state.goals.length });
      pushRender();
    }
    function flushName() {
      clearTimeout(nameTimer);
      const el = entry.q('#setName');
      if (!el) return;
      const n = clampStr(el.value, 30);
      if (n === (S().name || '')) return;
      S().name = n;
      save();
      renderHeader();
    }
    function flushBudget(quiet) {
      const el = entry.q('#setBudget'), err = entry.q('#setBudgetErr');
      if (!el) return;
      err.textContent = '';
      el.classList.remove('invalid');
      const raw = el.value.trim();
      let v = 0;
      if (raw && !isZeroLike(raw)) {
        v = parseAmt(raw);
        if (v == null) { if (!quiet) { err.textContent = amountErr(raw); el.classList.add('invalid'); } return; }
      }
      v = roundAmt(v);
      if (v === num(S().monthlyBudget)) return;
      const ok = commit((s) => {
        if (v > 0 && !(num(s.settings.monthlyBudget) > 0)) s.settings.budgetSince = budgetSinceFor(s.settings);
        s.settings.monthlyBudget = v;
      });
      if (ok && !quiet) toast(t('settings.budgetSaved'));
    }
    build();
    if (opts.focus === 'budget') {
      const el = entry.q('#setBudget');
      el.scrollIntoView({ block: 'center' });
      focusEl(el);
    } else if (opts.focus === 'push') {
      const g = entry.q('#setPushGroup');
      g.scrollIntoView({ block: 'start' });
      focusEl(g.querySelector('[data-action="push-copy"]') || g.querySelector('button') || entry.el);
    }
    return entry;
  }

  // ---------- History sheet ----------
  function openHistorySheet() {
    const h = { q: '', month: today.slice(0, 7), all: false, type: 'ALL', walletId: ui.walletFilter || null, limit: HISTORY_PAGE };
    // The search row stays on top while the list scrolls under it; while typing in it (keyboard up) the filters
    // and totals fold away, so the matching rows show right under the field.
    const body =
      '<div class="hist-search"><div class="search-wrap">' + ICON.search + '<input id="hQ" class="ob-input" type="search" enterkeyhint="search" autocomplete="off" placeholder="' + T('history.searchPh') + '" aria-label="' + T('history.searchAria') + '"></div></div>' +
      '<div class="hist-controls">' +
      '<div class="month-nav"><button type="button" class="icon-btn sm" data-action="h-prev" aria-label="' + T('history.prev') + '">' + ICON.chevL + '</button>' +
      '<button type="button" class="month-label" data-action="h-all" id="hMonth" aria-label=""></button>' +
      '<button type="button" class="icon-btn sm" data-action="h-next" aria-label="' + T('history.next') + '">' + ICON.chevR + '</button></div>' +
      '<div class="chip-row scroll" id="hTypes" role="radiogroup" aria-label="' + T('history.typeAria') + '"></div>' +
      '<div class="chip-row scroll" id="hWallets" role="radiogroup" aria-label="' + T('history.walletAria') + '"></div></div>' +
      '<div class="hist-totals" id="hTotals"></div><div id="hList" class="tx-list"></div>';
    const entry = openSheet({
      id: 'history', title: t('history.title'), body, foot: '', cls: 'tall',
      update: () => draw(),
      actions: {
        'h-prev': () => { h.all = false; h.month = shiftMonth(h.month, -1); h.limit = HISTORY_PAGE; draw(); },
        'h-next': () => { h.all = false; h.month = shiftMonth(h.month, 1); h.limit = HISTORY_PAGE; draw(); },
        'h-all': () => { h.all = !h.all; h.limit = HISTORY_PAGE; draw(); },
        'h-type': (el) => { h.type = el.dataset.type; h.limit = HISTORY_PAGE; draw(); },
        'h-wallet': (el) => { h.walletId = el.dataset.id || null; h.limit = HISTORY_PAGE; draw(); },
        'h-more': () => { h.limit += HISTORY_PAGE; draw(); },
        'h-clear': () => { h.q = ''; entry.q('#hQ').value = ''; h.type = 'ALL'; h.walletId = null; h.limit = HISTORY_PAGE; draw(); }
      }
    });
    const qi = entry.q('#hQ');
    let timer = 0;
    // a new search starts at the top of its results
    qi.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { h.q = qi.value; h.limit = HISTORY_PAGE; draw(); entry.body.scrollTop = 0; }, 150); });
    qi.addEventListener('focus', () => { entry.body.scrollTop = 0; });
    // the keyboard's Search key puts the keyboard away: results, filters and totals in full view
    qi.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); qi.blur(); } });

    // future-dated (scheduled) rows must stay reachable: allow months up to the latest one used
    const lastMonth = () => state.transactions.reduce((m, x) => { const k = String(x.date || '').slice(0, 7); return k > m ? k : m; }, today.slice(0, 7));
    function draw() {
      const curMonth = lastMonth();
      if (h.month > curMonth) h.month = curMonth;
      if (h.walletId && !walletById(h.walletId)) h.walletId = null;
      entry.titleEl.textContent = t('history.title');
      const ml = entry.q('#hMonth');
      ml.textContent = h.all ? t('history.allTime') : monthLabel(h.month);

  // ---------- Text read from a screenshot, receipt photo or the clipboard -> transaction sheet ----------
  // A bank statement / history list: two or more rows that start with a date and carry an amount
  // ("01/10 QRIS ALFAMART 45.000 DB"). Payment screens and receipts have one date line.
  const STMT_DATE_ROW = /^\s*\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b/;
  const STMT_AMOUNT = /\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d{4,}[.,]\d{2}\b/;
  function looksLikeStatement(text) {
    return String(text || '').split(/\r?\n/).filter((l) => STMT_DATE_ROW.test(l) && STMT_AMOUNT.test(l.replace(STMT_DATE_ROW, ''))).length >= 2;
  }
  // Is this text a payment screen (or, when pasted, a receipt)? Returns Core's reading, or null.
  // Short entries ("kopi 25rb pakai GoPay") never get here: a screen's text has many lines.
  function screenFromText(text, pasted) {
    const s = String(text == null ? '' : text).replace(/\r\n?|[\u2028\u2029\u0085]/g, '\n').trim();
    if (!s || !activeWallets().length || looksLikeStatement(s)) return null;
    const lines = s.split('\n').filter((l) => l.trim()).length;
    if (pasted ? (lines < 3 && s.length < 100) : (lines < 4 && s.length < 120)) return null;
    const r = safe(() => Core.extractFromImageText(s, coreCtx()), null);
    if (!r || !(num(r.amount) > 0) || num(r.confidence) < 0.5) return null;
    if (r.kind === 'payment') return r;
    if (pasted && r.kind === 'receipt' && looksLikeReceipt(s, r)) return r;
    return null;
  }
  // A receipt's text has a line that starts with its total / cash / change and an amount ("TOTAL 45.000",
  // "TUNAI 50.000"). A list someone wrote ("jajan 12.000", "bayar parkir 5.000", "belanja tunai 40.000") does not.
  const RECEIPT_LINE = /^[^\S\n]*(grand[^\S\n]*total|sub[^\S\n]*-?[^\S\n]*total|total|jumlah|tunai|kembali|kembalian|cash|change|amount[^\S\n]+due)\b[^\n]*\d/im;
  function looksLikeReceipt(s, r) {
    if (!RECEIPT_LINE.test(s)) return false;
    // still a list when every other line is one entry of its own and the "receipt" amount is one of them, not their sum
    const rows = s.split('\n').map((l) => l.trim()).filter((l) => l && !RECEIPT_LINE.test(l));
    if (rows.length < 2 || rows.length > 30) return true;
    const items = [];
    for (const l of rows) { const p = parseCaption(l); if (p.length !== 1) return true; items.push(roundAmt(p[0].amount)); }
    const amt = roundAmt(num(r.amount)), sum = roundAmt(items.reduce((a, b) => a + b, 0));
    return !(items.some((v) => Math.abs(v - amt) < 0.005) && Math.abs(sum - amt) >= 0.005);
  }

    // text a notification brought: there is no picture to look at, the bank's e-mail or notification has the amount

  };

  //   notif: the fields a notification brought, as a reading (09c_inbox.js: result, no text); receivedAt (ms): when it
  //   came, the date and time to start from when the fields have none (still marked to check)
  function openFromRead(o) {
    const photo = o.origin === 'photo';
    const text = String(o.text || '');
    let arrived = null;
    if (o.origin === 'notif' && typeof o.receivedAt === 'number' && isFinite(o.receivedAt)) {
      const d = new Date(o.receivedAt);
      arrived = { day: Core.dayKey(d.getFullYear(), d.getMonth() + 1, d.getDate()), time: Core.pad2(d.getHours()) + ':' + Core.pad2(d.getMinutes()) };

    }

    }

    const fails = READ_FAIL[photo ? 'photo' : o.origin === 'notif' ? 'notif' : 'shot'];

      // pasted or brought by a notification: a bank e-mail says so
      const headKey = o.origin === 'notif' ? 'shot.fromNotif'

  }

  // ---------- Nota / Mutasi sheet ----------
  // mode 'photo' | 'statement'; opts.screenshot: the "Dari screenshot" variant (one picture, no statement tab)
  function openScanSheet(mode, opts) {

    }

      ? { title: 'shot.title', pick: 'shot.pick', loading: 'shot.loading', preparing: 'shot.preparing', reading: 'shot.reading', privacy: 'shot.privacy', thumb: 'shot.thumbAlt' }
      : { title: 'scan.title', pick: 'scan.pick', loading: 'scan.loading', preparing: 'scan.preparing', reading: 'scan.reading', privacy: 'scan.privacy', thumb: 'scan.thumbAlt' };
