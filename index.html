    .tx-main { min-width: 0; flex: 1; }

    .tx-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .tx-icon svg { width: 15px; height: 15px; stroke-width: 1.8; }

    .tx-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tx-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .tx-sub > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-sub > .tx-cat { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .tx-sub > .tx-time { flex-shrink: 0; white-space: nowrap; overflow: visible; margin-left: -3px; }

    .wallet-mini-tag {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    .tx-val {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .val-exp { color: var(--text-primary); }
    .val-inc { color: var(--positive); }
    .val-mute { color: var(--text-secondary); }

    .see-all-btn {
      margin-top: 6px;
      min-height: 40px;
      border-radius: 12px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .see-all-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      padding: 26px 12px 18px;
      color: var(--text-secondary);
    }
    .empty-state .empty-icon {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--surface-1); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }
    .empty-state .empty-icon svg { width: 20px; height: 20px; stroke-width: 1.8; }
    .empty-state strong { font-size: 14px; color: var(--text-primary); }
    .empty-state p { font-size: 12.5px; line-height: 1.5; max-width: 280px; }
    .empty-state .btn-secondary { margin-top: 4px; }

    /* VIEW 2: CATAT
       One centred composer card, like a voice recorder: the default-wallet pills on top, the text (a short example as
       placeholder, on a dashed line), what was understood from it (receipt rows, or a note on what is missing), then
       the big round mic between its wave bars and, under a hairline, one slot: a quiet tip, "Mendengarkan…" while
       listening, or Save. The card fills the space above the dock and never grows with the words or the rows, so the
       slot, the dock and the mic stay put: the mic has ONE place, right above the slot, whether the card is empty,
       holds rows or is listening (with the keyboard up it is smaller, and again has one place there). */
    .catat-studio {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 2px;
    }

    .voice-stage {
      --stage-gap: 12px;
      --halo: 6px;                  /* the mic's soft ring: part of its shape, so it counts in the spacing */
      --orb: 66px;
      --gap-a: 14px;                /* at least this much between the last row and the ring */
      --gap-b: 2px;                 /* extra, on top of --stage-gap, between the ring and the hairline */
      --cap-gap: 6px;               /* between the words and their rows */
      --cap-line: calc(1.35 * 17px + 5px);  /* the words at their least: one line, its padding and the dashed line */
      --row-h: 40px;
      flex: 1 0 auto;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 12px 16px 12px;
      display: flex;
      flex-direction: column;
      text-align: center;
      gap: var(--stage-gap);
      transition: border-color 0.2s ease;
    }
    .voice-stage:has(.caption-input:focus) { border-color: var(--border-hover); }
    /* a little more air between the pills and the words (not while typing: see the keyboard rules) */
    .voice-stage > .catat-wallet-selector { margin-bottom: 2px; }

    .catat-wallet-selector {
      display: flex;
      gap: 6px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .w-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 11px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .w-pill.active {
      background: var(--text-primary);
      color: var(--bg-app);
      border-color: var(--text-primary);
    }
    .w-pill .wallet-dot { width: 7px; height: 7px; }
    .w-pill.add { border-style: dashed; color: var(--positive); border-color: rgba(52,211,153,0.4); }
    .w-pill .pill-sub { font-weight: 600; color: var(--text-secondary); }
    .w-pill.active .pill-sub { color: #3F3F46; }
    .w-pill .pill-sub.neg { color: var(--negative); opacity: 1; }

    /* the words: they grow with the text (up to 4 lines) and, only when a row would not fit otherwise, give way down
       to one line (the cut fades), never less: the box holds that line, so nothing under it ("+2 lainnya", a row)
       is ever drawn over the words (fitRows then shows fewer rows instead); never by pushing the mic */
    .caption-box {
      flex: 0 1 auto;
      min-height: var(--cap-line);
      position: relative;
      display: flex;
      flex-direction: column;
      margin-bottom: var(--cap-gap);
    }
    .caption-hit { display: flex; flex-direction: column; min-height: var(--cap-line); cursor: text; }
    .caption-input {
      display: block;
      flex: 0 1 auto;
      min-height: var(--cap-line);
      width: 100%;
      margin: 0;
      /* even sides keep the words centred, the × sits in the right one */
      padding: 0 24px 4px;
      background: transparent;
      border: 0;
      border-bottom: 1px dashed transparent;
      border-radius: 0;
      outline: none;
      resize: none;
      text-align: center;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.35;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      caret-color: var(--positive);
      max-height: calc(4 * 1.35em + 5px);
      transition: border-color 0.18s ease;
    }
    /* empty: a short example in a quiet voice, on a dashed line that says "write here" */
    .caption-input::placeholder { color: var(--text-muted); font-weight: 500; letter-spacing: -0.01em; opacity: 1; }
    .caption-input:placeholder-shown { padding-bottom: 9px; border-bottom-color: var(--border-hover); }
    /* clear: only while there is text, iOS-style small filled circle at the end of the first line */
    .caption-clear {
      position: absolute;
      top: -8px;
      right: -10px;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .caption-clear svg { width: 20px; height: 20px; padding: 5px; border-radius: 50%; background: var(--surface-3); stroke-width: 2.6; }
    .caption-clear:hover { color: var(--text-primary); }

    /* Between the pills and the hairline: the words, their rows, then the mic, always at the bottom, right above the
       hairline. The room left between the rows and the mic is empty (a tap there types too: it labels the field).
       Its content never sizes the card (zero basis, size containment) and its minimum is the same in every state,
       so the card, the slot and the mic never move: the rows fill the room down to the mic and then scroll, a whole
       row at a time, with "+2 lainnya" on top saying how many are out of view (JS: fitRows); with rows the words
       give way down to one line so a row always shows, except while typing: then Save and the mic above the
       keyboard come first. */
    .stage-middle {
      --orb-block: calc(var(--gap-a) + 2 * var(--halo) + var(--orb) + var(--gap-b));
      /* one line of words, a row and the peeking edges of a stack over it, the mic (fitRows never sizes this) */
      flex: 1 1 0px;
      min-height: calc(var(--cap-line) + var(--cap-gap) + 6px + var(--row-h) + var(--orb-block));
      contain: size;
      display: flex;
      flex-direction: column;
    }
    .app.kb-open .stage-middle { min-height: calc(var(--cap-line) + var(--cap-gap) + var(--orb-block)); }
    .caption-rest { flex: 1 1 0px; min-height: var(--gap-a); cursor: text; }
    /* "+2 lainnya": rows scrolled out of view above the ones shown */
    .parsed-more {
      flex: none;
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 600;
      line-height: 14px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .live-parsed-preview {
      /* gives way first (before the words) */
      flex: 0 1000 auto;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      text-align: left;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      /* the cut always falls between rows */
      scroll-snap-type: y mandatory;
    }
    /* one row always shows (the words give way for it), except while typing: Save and the mic come first then */
    .app:not(.kb-open) .stage-middle:has(.parsed-tag) > .live-parsed-preview { min-height: var(--row-h); }
    /* and so does the note on what is missing, whole (it is never taller than the room kept for a row) */
    .app:not(.kb-open) .stage-middle:has(.parsed-note) > .live-parsed-preview { min-height: min-content; }
    /* no room for "+2 lainnya" (the smallest phones while typing): the edges of the rows behind the one shown peek
       out above it, like a stack of receipts (outer shadows: drawn only outside the box) */
    .live-parsed-preview.stacked {
      margin-top: 6px;
      border-radius: 12px;
      box-shadow: 0 -8px 0 -5px #2F2F36, 0 -16px 0 -10px #222228;
    }
    .live-parsed-preview::-webkit-scrollbar { display: none; }
    .live-parsed-preview:empty { display: none; }
    .live-parsed-preview > * { flex-shrink: 0; }
    /* what is missing ("Sebut nominalnya…"), right under the words it is about */
    .parsed-note {
      margin: -2px 0 0;
      text-align: center;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text-secondary);
      animation: fadeIn 0.2s ease;
    }

    /* one row per entry, like the rows on Ringkasan: what, then wallet · day under it; amount and × on the right */
    .parsed-tag {
      width: 100%;
      min-height: var(--row-h);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 3px 4px 3px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      scroll-snap-align: end;
      animation: fadeSlideUp 0.22s var(--spring);
    }
    /* a row that only changed (or moved up) while typing stays still; only a new one comes in */
    .parsed-tag.no-anim { animation: none; }
    .parsed-tag .pt-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .parsed-tag .pt-title { line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .parsed-tag .pt-meta { display: flex; min-width: 0; font-size: 11px; font-weight: 500; line-height: 15px; color: var(--text-secondary); white-space: nowrap; }
    .parsed-tag .pt-wallet { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* with a category after it the wallet keeps its name (up to half the line) and the category gives way; the day never */
    .parsed-tag .pt-wallet:has(+ .pt-cat), .parsed-tag .pt-wallet:has(+ .pt-missing) { flex-shrink: 0; max-width: 50%; }
    /* "BCA belum ada": the wallet named in the words is not a wallet here (it goes on the one before it) */
    .parsed-tag .pt-missing { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--warning); }
    .parsed-tag .pt-wallet:has(+ .pt-missing) { max-width: 40%; }
    .parsed-tag .pt-meta:has(.pt-missing) { overflow: hidden; }
    .parsed-tag .pt-missing::before { content: '\00a0\00b7\00a0'; color: var(--text-muted); }
    /* under the rows, the wallet they name and that is not there: the "+ Wallet" pill; not while typing (no room) */
    .missing-add { flex: none; align-self: center; margin-top: 8px; min-height: 40px; }
    .app.kb-open .missing-add { display: none; }
    .parsed-tag .pt-cat { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .parsed-tag .pt-meta:has(.pt-cat) { overflow: hidden; }
    .parsed-tag .pt-cat::before { content: '\00a0\00b7\00a0'; color: var(--text-muted); }
    .parsed-tag .pt-day { flex-shrink: 0; color: var(--warning); }
    .parsed-tag .pt-day::before { content: '\00a0\00b7\00a0'; color: var(--text-muted); }
    .parsed-tag .pt-amt { color: var(--positive); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .parsed-tag .pt-amt.exp { color: var(--text-primary); }
    .parsed-tag .pt-amt.mute { color: var(--text-secondary); }
    /* tapping what was read opens it in the transaction sheet; the button covers the row up to the × */
    .parsed-tag .pt-edit {
      flex: 1; min-width: 0; align-self: stretch;
      display: flex; align-items: center; gap: 8px;
      margin: -3px 0 -3px -12px; padding: 3px 0 3px 12px;
      background: none; border: none; border-radius: 11px; text-align: left; cursor: pointer;
    }
    /* pressed like a row on Ringkasan: the whole row, not the text inside it */
    .parsed-tag .pt-edit:active { transform: none; }
    .parsed-tag:has(> .pt-edit:active) { transform: scale(0.985); background: var(--surface-3); }
    .chip-x {
      width: 24px; height: 24px; border-radius: 50%;
      border: none; background: var(--surface-3); color: var(--text-secondary);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .chip-x svg { width: 12px; height: 12px; stroke-width: 2.4; }
    .chip-x:hover { color: var(--text-primary); }

    /* the mic, centred between its wave bars (they ripple out from it while listening); the margins hold its ring */
    .orb-center-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: var(--halo);
      margin-bottom: calc(var(--halo) + var(--gap-b));
    }
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
      opacity: 0.25;
      transition: opacity 0.2s ease;
    }
    .wave-bars.active { opacity: 1; }
    .wave-bar { width: 3px; height: 8px; border-radius: 3px; background: var(--text-primary); }
    .wave-bars.active .wave-bar { animation: soundWave 0.7s ease-in-out infinite; }
    .wave-bars.active .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    #waveLeft.active .wave-bar:first-child, #waveRight.active .wave-bar:last-child { animation-delay: 0.3s; }
    @keyframes soundWave {
      0%, 100% { height: 6px; }
      50% { height: 22px; background: var(--positive); }
    }

    /* under a hairline, one slot: the tip, "Mendengarkan…" while listening, or Save (one height for all three, so the
       mic above it never moves) */
    .stage-bottom-slot {
      flex-shrink: 0;
      height: 55px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .catat-hint {
      min-width: 0;
      margin: 0;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text-muted);
      text-wrap: balance;
    }
    .catat-hint .tip-key { color: var(--text-secondary); font-weight: 600; }
    .catat-hint.strong { color: var(--text-secondary); font-weight: 600; }
    .rec-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 7px 1px 1px;
      border-radius: 50%;
      background: var(--negative);
      vertical-align: middle;
      animation: recBlink 1.2s ease-in-out infinite;
    }
    @keyframes recBlink { 50% { opacity: 0.35; } }

    /* the mic: big, round and bright while it is the next step; quiet once Save is there; red and breathing while
       listening. The soft halo (--halo) is part of the shape. */
    .voice-orb {
      position: relative;
      width: var(--orb);
      height: var(--orb);
      border-radius: 50%;
      background: var(--text-primary);
      color: var(--bg-app);
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 0 var(--halo) rgba(255, 255, 255, 0.05);
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.25s ease, width 0.28s var(--spring), height 0.28s var(--spring);
    }
    .voice-orb svg { width: 22px; height: 22px; stroke-width: 2; }
    /* quiet = a secondary button next to the white Save: lifted grey with a fine ring, never the grey of the row × */
    .voice-orb.quiet { background: #2E2E35; color: var(--text-primary); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 0 0 var(--halo) rgba(255, 255, 255, 0.05); }
    .voice-orb.recording {
      background: var(--negative);
      color: #FFFFFF;
      box-shadow: 0 0 0 calc(var(--halo) + 4px) rgba(251, 93, 120, 0.16);
      animation: pulseOrb 1.3s ease-in-out infinite;
    }
    @keyframes pulseOrb { 50% { transform: scale(1.06); } }
    .voice-orb.unsupported { background: var(--surface-3); color: var(--text-muted); box-shadow: none; }
    .voice-stage > :not(.stage-middle) { flex-shrink: 0; }

    /* Typing in Catat (keyboard up, --kb from the viewport guard): the card fits the area above the keyboard, so the
       mic and Save ride just above it; the other ways to record would be under the keyboard anyway. The card
       tightens (smaller mic, slimmer pills, no hairline), the text gets at most 3 lines and the rows area gives way,
       so however many entries are typed, the text, the mic and Save stay in view. (A phone on its side has too little
       room above the keyboard even for that: there the view scrolls.) */
    #viewCatat { transition: padding-bottom 0.28s var(--spring); }
    .app.kb-open #viewCatat { padding-bottom: max(12px, calc(var(--kb) - var(--tabbar-h) - var(--safe-bottom) + 12px)); }
    .app.kb-open #viewCatat .bottom-dock-section { display: none; }
    .app.kb-open .voice-stage { --stage-gap: 6px; --halo: 4px; --orb: 40px; --gap-a: 8px; --gap-b: 2px; --cap-gap: 2px; padding-top: 8px; padding-bottom: 8px; }
    .app.kb-open .voice-stage > .catat-wallet-selector { margin-bottom: 0; }
    .app.kb-open .catat-wallet-selector > .w-pill { min-height: 32px; }
    .app.kb-open .caption-input { max-height: calc(3 * 1.35em + 5px); }
    .app.kb-open .orb-center-wrap { gap: 10px; }
    .app.kb-open .voice-orb svg { width: 18px; height: 18px; }
    .app.kb-open .stage-bottom-slot { height: 42px; padding-top: 0; border-top: 0; }
    .app.kb-open .full-save-bar-btn { height: 42px; }
    /* a payment screen's text (pasted, Live Text, a Shortcut) is only the source: smaller, quieter, 4 lines at most;
       the row it produced and "Cek & simpan" are what counts */
    .caption-box.is-shot { --cap-line: calc(1.4 * 13px + 1px); }
    .caption-box.is-shot .caption-input { padding-top: 0; padding-bottom: 0; text-align: left; font-size: 13px; line-height: 1.4; font-weight: 500; letter-spacing: 0; color: var(--text-secondary); min-height: var(--cap-line); max-height: calc(4 * 1.4em + 1px); }
    /* listening into an empty field: the example steps back, so the words heard (bold, white) clearly replace it */
    .voice-stage:has(.voice-orb.recording) .caption-input::placeholder { opacity: 0.35; }
    /* text cut off at the field's height fades out instead of being sliced through a line (not while editing it; a
       field cut to one line fades less, so that line still reads) */
    .caption-input.clipped:not(:focus) { -webkit-mask-image: linear-gradient(#000 calc(100% - min(20px, 45%)), transparent); mask-image: linear-gradient(#000 calc(100% - min(20px, 45%)), transparent); }
    /* while listening it shows its end (fitRows): the cut is above, so the fade is too (short: no padding there) */
    .caption-input.clipped.tail:not(:focus) { -webkit-mask-image: linear-gradient(transparent, #000 min(12px, 18%)); mask-image: linear-gradient(transparent, #000 min(12px, 18%)); }
    .live-parsed-preview.fade-bottom { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
    .live-parsed-preview.fade-top { -webkit-mask-image: linear-gradient(transparent, #000 22px); mask-image: linear-gradient(transparent, #000 22px); }
    .live-parsed-preview.fade-top.fade-bottom { -webkit-mask-image: linear-gradient(transparent, #000 22px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(transparent, #000 22px, #000 calc(100% - 22px), transparent); }

    .full-save-bar-btn {
      flex: 1;
      min-width: 0;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--text-primary);
      color: var(--bg-app);
      border: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      padding: 0 12px;
      animation: fadeSlideUp 0.22s var(--spring);
    }
    /* one line, always: on a narrow screen the words give way (ellipsis), the amount stays whole */
    .full-save-bar-btn .sv-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
    .full-save-bar-btn .sv-total { flex-shrink: 0; white-space: pre; }
    /* a narrow screen (SE 1st gen, Display Zoom) gets the short words: "Simpan 3 · Rp 68.000" */
    .full-save-bar-btn .sv-short { display: none; }
    @media (max-width: 360px) {
      .full-save-bar-btn { font-size: 12.5px; padding: 0 10px; letter-spacing: -0.02em; }
      .full-save-bar-btn .sv-long { display: none; }
      .full-save-bar-btn .sv-short { display: inline; }
    }

    .bottom-dock-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dock-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dock-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      min-height: 58px;
    }
    .dock-card:hover { border-color: var(--border-hover); }

    .dock-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .dock-icon svg { width: 15px; height: 15px; stroke-width: 1.8; }

    .dock-text { min-width: 0; }
    .dock-text strong {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-text small { font-size: 11px; color: var(--text-muted); display: block; margin-top: 1px; text-wrap: balance; }

    .upload-drop, .scan-drop {
      position: relative;
      background: var(--surface-2);
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: border-color 0.18s ease, background-color 0.18s ease;
    }
    .scan-drop:focus-within { outline: 2px solid var(--positive); outline-offset: 2px; }
    .scan-drop.dragover { border-color: var(--positive); background: rgba(52, 211, 153, 0.08); }
    .scan-drop svg { width: 24px; height: 24px; stroke-width: 1.7; color: var(--text-primary); }
    .scan-drop strong { font-size: 13.5px; color: var(--text-primary); }
    .scan-drop small { font-size: 11.5px; color: var(--text-muted); line-height: 1.45; }

    .scan-status {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
    }
    .scan-thumb {
      width: 64px; height: 84px;
      object-fit: cover;
      border-radius: 10px;
      background: var(--surface-3);
      flex-shrink: 0;
    }
    .scan-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .scan-info .scan-text { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }

    .receipt-preview {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      justify-content: center;
    }
    .receipt-preview img { display: block; max-width: 100%; max-height: 180px; object-fit: contain; }
    .receipt-preview.expanded img { max-height: none; }

    .notice {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-secondary);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
    }
    .notice.warn { color: var(--warning); border-color: rgba(251, 191, 36, 0.3); background: rgba(251, 191, 36, 0.07); }
    .notice.info { color: var(--rollover); border-color: rgba(56, 189, 248, 0.28); background: rgba(56, 189, 248, 0.07); }

    /* VIEW 3: WALLET TAB */
    .wallet-showcase-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(18, 18, 21, 0.95) 100%);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-xl);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .showcase-sub { font-size: 12px; color: var(--text-secondary); }
    .showcase-sub strong { color: var(--rollover); font-variant-numeric: tabular-nums; }
    .showcase-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .showcase-actions .btn-secondary { min-height: 42px; }
    .btn-accent { color: var(--positive); }

    .vault-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .vault-hint { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    .wallet-list-vertical {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .wallet-row-card {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: inherit;
      text-align: left;
      min-height: 50px;
    }
    .wallet-row-card:hover { border-color: var(--border-hover); }
    .wallet-row-card.archived { opacity: 0.7; }

    .wallet-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 0;
    }
    .wallet-row-left .wr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--surface-3);
      border-radius: 6px;
      padding: 1px 6px;
      flex-shrink: 0;
    }
    .badge.green { color: var(--positive); background: rgba(52, 211, 153, 0.12); }

    .wallet-row-bal {
      font-size: 13.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .archived-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
    }
    .archived-toggle svg { width: 12px; height: 12px; stroke-width: 2.2; transition: transform 0.2s ease; }
    .archived-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }

    .goal-list { display: flex; flex-direction: column; gap: 10px; }

    .goal-item-card {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      color: inherit;
      text-align: left;
    }
    .goal-item-card:hover { border-color: var(--border-hover); }

    .goal-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
    }
    .goal-meta .g-name { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .goal-meta .g-amt { color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .goal-foot { font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; gap: 8px; }
    .goal-foot .ok { color: var(--positive); font-weight: 700; }
    .goal-foot .late { color: var(--warning); font-weight: 600; }

    .bar-track {
      width: 100%;
      height: 6px;
      background: var(--surface-3);
      border-radius: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--positive);
      border-radius: 5px;
      transition: width 0.4s var(--spring);
    }

    .muted-note { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    /* Bottom Navigation Bar */
    .tab-bar {
      height: calc(var(--tabbar-h) + var(--safe-bottom));
      background: rgba(9, 9, 11, 0.92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      padding: 0 calc(16px + var(--safe-right)) calc(6px + var(--safe-bottom)) calc(16px + var(--safe-left));
      flex-shrink: 0;
    }

    .tab-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      height: 56px;
      border-radius: 14px;
    }
    .tab-item:hover { color: var(--text-secondary); }
    .tab-item.active { color: var(--text-primary); }
    .tab-item svg { width: 19px; height: 19px; stroke-width: 1.8; }

    .tab-center-pill {
      width: 46px;
      height: 30px;
      border-radius: 15px;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      transition: all 0.22s var(--spring);
    }
    .tab-item.active .tab-center-pill {
      background: var(--text-primary);
      color: var(--bg-app);
      transform: scale(1.06);
    }

    /* BOTTOM SHEETS (modal, inside the app frame) */
    .sheet-layer {
      position: absolute;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.62);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      animation: fadeIn 0.22s ease both;
    }
    .sheet {
      position: relative;
      max-height: calc(100% - 28px - var(--safe-top));
      background: var(--surface-1);
      border: 1px solid var(--border-hover);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      animation: sheetUp 0.34s var(--spring) both;
      box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
    }
    .sheet:focus { outline: none; }
    @keyframes sheetUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-layer.closing .sheet { animation: sheetDown 0.2s ease forwards; }
    .sheet-layer.closing .sheet-backdrop { animation: fadeOut 0.2s ease forwards; }
    @keyframes sheetDown { to { transform: translateY(60px); opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; } }

    .sheet-grab {
      width: 38px; height: 4px; border-radius: 4px;
      background: var(--surface-3);
      margin: 8px auto 0;
      flex-shrink: 0;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px 6px 20px;
      flex-shrink: 0;
    }
    .sheet-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sheet-close {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sheet-close svg { width: 16px; height: 16px; stroke-width: 2; }
    .sheet-close:hover { color: var(--text-primary); }
    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sheet-body::-webkit-scrollbar { width: 0; }
    .sheet-foot {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 20px calc(14px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface-1);
    }
    .sheet-foot .btn-primary { flex: 1; }
    .sheet-foot:empty { display: none; }
    /* sheets without buttons scroll to the screen edge: their last row ends above the home indicator */
    .sheet-body:has(+ .sheet-foot:empty) { padding-bottom: calc(18px + var(--safe-bottom)); }
    .sheet-text { font-size: 13px; line-height: 1.55; color: var(--text-secondary); }
    .sheet-text strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .sheet-text p + p { margin-top: 8px; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip-row.scroll {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -20px;
      padding: 1px 20px;
    }
    .chip-row.scroll::-webkit-scrollbar { display: none; }
    .chip-row.scroll .w-pill { flex-shrink: 0; }

    .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
    .swatch {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      box-shadow: inset 0 0 0 3px var(--surface-1);
    }
    .swatch.active { border-color: var(--text-primary); }

    .divider { height: 1px; background: var(--border); margin: 2px 0; }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .settings-group > h3 {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
    }
    .settings-row .sr-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .settings-row .sr-text strong { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .settings-row .sr-text small { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
    .data-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .data-buttons .btn-secondary { min-height: 46px; font-size: 12.5px; }
    .data-buttons label.btn-secondary { position: relative; }

    .switch {
      width: 50px; height: 30px; border-radius: 30px;
      background: var(--surface-3);
      border: 1px solid var(--border-hover);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--text-secondary);
      transition: transform 0.22s var(--spring), background-color 0.2s ease;
    }
    .switch[aria-checked="true"] { background: rgba(52, 211, 153, 0.3); border-color: rgba(52, 211, 153, 0.6); }
    .switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--positive); }

    .about-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .about-card svg { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
    .about-card strong { display: block; font-size: 14px; }
    .about-card small { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    /* History filters */
    .hist-controls { display: flex; flex-direction: column; gap: 10px; }
    /* the search row stays at the top of the sheet's scroll area; filters, totals and rows scroll under it */
    .hist-search {
      position: sticky;
      top: -8px; /* sticks at the scroll area's very top edge (the offset counts from inside the body's 8px padding) */
      z-index: 2;
      margin: -8px -20px -6px;
      padding: 8px 20px 0;
      background: var(--surface-1);
    }
    .hist-search::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 10px;
      background: linear-gradient(var(--surface-1), transparent);
      pointer-events: none;
    }
    /* typing a search (keyboard up): the filters and totals fold away, the matching rows come right under the field */
    .app.kb-open .sheet-layer:has(#hQ:focus) .hist-controls,
    .app.kb-open .sheet-layer:has(#hQ:focus) .hist-totals { display: none; }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; stroke-width: 1.9; color: var(--text-muted); pointer-events: none;
    }
    .search-wrap .ob-input { padding-left: 38px; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .month-label {
      flex: 1;
      min-height: 36px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      text-transform: capitalize;
    }
    .hist-totals {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 10px;
      min-width: 0;
    }
    .metric-pill span {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .metric-pill strong {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .metric-pill strong.pos { color: var(--positive); }

    /* Statement review */
    .review-list { display: flex; flex-direction: column; gap: 8px; }
    .review-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .review-row.off .review-top { opacity: 0.7; }
    .review-row.off .review-meta { color: var(--text-secondary); }
    .review-row input[type="checkbox"] {
      width: 20px; height: 20px; margin-top: 2px;
      accent-color: var(--positive);
      cursor: pointer;
    }
    .review-main { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .review-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .review-title { font-size: 13px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .review-amt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .review-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); }
    .review-meta select {
      height: 32px; border-radius: 8px;
      background: var(--surface-1); border: 1px solid var(--border);
      color: var(--text-primary); font-size: 12px; font-weight: 600; padding: 0 8px;
      max-width: 170px;
    }
    .type-toggle {
      height: 32px; border-radius: 8px; padding: 0 9px;
      background: var(--surface-1); border: 1px solid var(--border);
      font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-primary);
    }
    .type-toggle.inc { color: var(--positive); border-color: rgba(52, 211, 153, 0.35); }
    .dup-tag { color: var(--warning); font-weight: 600; }

    /* CATAT: payments a notification brought ("Menunggu dicatat (n)", 09c_inbox.js), in the slot under the mic where
       the tip is (Save takes the slot back while something typed can be saved), and their list */
    .inbox-strip {
      display: flex; align-items: center; gap: 8px; width: 100%; height: 42px; padding: 0 12px;
      border-radius: 12px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text-primary); font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: left;
    }
    .inbox-strip[hidden] { display: none; }
    .inbox-strip:active { transform: scale(0.98); }
    .inbox-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rollover); flex-shrink: 0; }
    .inbox-strip-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inbox-strip svg { width: 15px; height: 15px; stroke-width: 2; color: var(--text-muted); flex-shrink: 0; }
    .inbox-list { display: flex; flex-direction: column; gap: 8px; }
    .inbox-row {
      display: flex; align-items: center; gap: 10px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px 10px 12px;
    }
    .inbox-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .inbox-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .inbox-title { font-size: 13px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .inbox-amt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .inbox-amt.none { color: var(--warning); font-weight: 600; font-size: 12px; }
    .inbox-meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); }
    .inbox-btns { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .inbox-btns .btn-secondary.sm { min-height: 40px; padding: 0 12px; font-size: 12.5px; }
    .inbox-btns .icon-btn.sm { width: 40px; height: 40px; }
    @media (max-width: 360px) {
      /* a narrow phone: the amount goes under the merchant, whose name may take two lines */
      .inbox-top { flex-direction: column; align-items: flex-start; gap: 2px; }
      .inbox-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; max-width: 100%; }
    }
    .push-text-row {
      width: 100%; align-items: flex-start; padding: 2px 0; text-align: left; color: inherit;
      background: none; border: 0; font: inherit; cursor: pointer; border-radius: 10px;
    }
    .push-text-row .switch { margin-top: 2px; pointer-events: none; }
    .push-text-row[aria-checked="true"] .switch { background: rgba(52, 211, 153, 0.3); border-color: rgba(52, 211, 153, 0.6); }
    .push-text-row[aria-checked="true"] .switch::after { transform: translateX(20px); background: var(--positive); }

    /* Toasts */
    .toast-host {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 12px);
      z-index: 130;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .app.sheet-open .toast-host, .app.ob-open .toast-host {
      bottom: auto;
      top: calc(14px + var(--safe-top));
    }
    .toast {
      pointer-events: auto;
      max-width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(35, 35, 41, 0.97);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 11px 12px 11px 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
      animation: toastIn 0.28s var(--spring);
    }
    .toast.error { border-color: rgba(251, 93, 120, 0.45); }
    .toast.error::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--negative); flex-shrink: 0;
    }
    .toast-action {
      background: var(--text-primary);
      color: var(--bg-app);
      border: none;
      border-radius: 9px;
      padding: 0 12px;
      min-height: 32px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }


    .stack { display: flex; flex-direction: column; gap: 12px; }
    .tx-title { display: block; }
    .tx-sub { display: flex; }
    button.receipt-preview { width: 100%; padding: 0; cursor: zoom-in; color: inherit; }
    button.receipt-preview.expanded { cursor: zoom-out; }
    label.file-btn { cursor: pointer; }
    label.file-btn:focus-within { outline: 2px solid var(--positive); outline-offset: 2px; }
    .vault-card .field { gap: 7px; }
    .goal-foot:empty { display: none; }
    .metric-pill strong.neg { color: var(--negative); }
    .about-card div small + small { margin-top: 4px; color: var(--positive); }

    /* ---- Review fixes: states, touch targets (>= 40px), layout at 320-390px ---- */
    .toast.passive { pointer-events: none; }
    .storage-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .storage-banner > span:first-child { flex: 1 1 200px; }
    .banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .banner-btn { min-height: 36px; padding: 0 12px; border-radius: 9px; border: none; background: var(--warning); color: #1A1404; font-size: 12px; font-weight: 700; cursor: pointer; }
    .banner-btn.ghost { background: transparent; color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.45); }

    .hero-label { flex-wrap: wrap; row-gap: 2px; }
    .hero-inline-metrics { gap: 6px; }
    .inline-metric-tag { padding: 5px 8px; }
    button.inline-metric-tag { position: relative; }
    button.inline-metric-tag::after { content: ''; position: absolute; inset: -6px -3px; }

    /* wallet tiles: a part of the next tile always shows, edges line up with the content */
    /* bleeds to the right screen edge: exactly the view's gutter, never more (it overflowed at <=360px) */
    .wallet-strip { padding: 4px; margin: -4px calc(-1 * var(--gutter)) -4px -4px; padding-right: var(--gutter); scroll-padding-inline: 4px; }
    .wallet-card { flex: 0 0 calc((100% - 16px) / 3.3); min-width: 92px; max-width: 160px; }
    .wallet-strip {
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent);
    }

    .seg-tabs { flex: 1 1 auto; }
    .seg-tab-btn { min-height: 40px; }
    .seg-tab-label { max-width: 110px; }
    .mini-streak-pill.zero { color: var(--text-muted); background: var(--surface-3); }
    .streak-badge.zero { color: var(--text-muted); }
    .filter-chip-row { display: flex; margin-top: -2px; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
      min-height: 40px; padding: 0 10px 0 14px; border-radius: 20px;
      background: var(--surface-2); border: 1px solid var(--border-hover);
      color: var(--text-primary); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .filter-chip > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .filter-chip svg { width: 14px; height: 14px; stroke-width: 2.2; color: var(--text-secondary); flex-shrink: 0; }

    /* rows: category and time share one truncating line, nothing slides under the amount */
    .tx-sub > .tx-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
    .wallet-mini-tag { flex-shrink: 1; min-width: 0; }

    .recap-chips { display: flex; flex-direction: column; gap: 0; }
    .recap-chip { background: none; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 7px 2px; gap: 8px; min-height: 32px; }
    .recap-chip:last-child { border-bottom: none; }
    .recap-chip .recap-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recap-chip em { min-width: 34px; text-align: right; }

    /* Catat: one scrolling row of wallet pills, centred while they fit; the default one is outlined */
    .catat-wallet-selector { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; width: calc(100% + 32px); }
    .catat-wallet-selector::-webkit-scrollbar { display: none; }
    .catat-wallet-selector {
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent);
    }
    .catat-wallet-selector > .w-pill { flex-shrink: 0; transition: min-height 0.28s var(--spring); }
    .catat-wallet-selector > :first-child { margin-left: auto; }
    .catat-wallet-selector > :last-child { margin-right: auto; }
    .catat-wallet-selector > .w-pill > span:nth-child(2) { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
    .catat-wallet-selector .pill-sub { font-variant-numeric: tabular-nums; }
    /* solid white is kept for the next step (the mic, Simpan): the default wallet is a setting, outlined */
    .catat-wallet-selector > .w-pill.active { background: rgba(250, 250, 250, 0.08); color: var(--text-primary); border-color: rgba(250, 250, 250, 0.5); }
    .catat-wallet-selector > .w-pill.active .pill-sub:not(.neg) { color: var(--text-secondary); }
    .w-pill { min-height: 40px; }
    .chip-x { width: 32px; height: 32px; position: relative; }
    .chip-x::after { content: ''; position: absolute; inset: -6px; }

    .tab-item > svg { margin: 5.5px 0; }
    .month-label { min-height: 40px; }
    .icon-btn.sm { width: 40px; height: 40px; }
    .text-action-btn { position: relative; }
    .text-action-btn::after { content: ''; position: absolute; inset: -7px -4px; }
    #wtArchived:empty { display: none; }

    /* amount fields show the currency symbol */
    .amount-wrap { position: relative; }
    .amount-prefix {
      position: absolute; left: 14px; top: 0; bottom: 0;
      display: flex; align-items: center;
      font-size: 15px; font-weight: 700; color: var(--text-muted);
      pointer-events: none;
    }
    .ob-input.has-prefix { padding-left: 44px; }

    /* sheets: drag the handle/header down to close; steady heights */
    .sheet-grab { width: 100%; height: 16px; margin: 0; background: none; position: relative; touch-action: none; cursor: grab; }
    .sheet-grab::before { content: ''; position: absolute; left: 50%; top: 8px; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--surface-3); }
    .sheet-head { touch-action: none; }
    .sheet-layer.closing.swiped .sheet { animation: none !important; transition: transform 0.2s ease, opacity 0.2s ease; transform: translateY(100%) !important; opacity: 0; }
    .sheet-layer.tall .sheet, .sheet-layer.scan .sheet { min-height: min(560px, calc(100% - 28px - var(--safe-top))); }
    .sheet-layer.tall .sheet { min-height: min(85%, calc(100% - 28px - var(--safe-top))); }
    .sheet-foot .btn-danger { min-height: 48px; border-radius: 14px; min-width: 140px; }
    .wallet-actions { display: flex; flex-direction: column; gap: 8px; }
    .wallet-actions > button { width: 100%; justify-content: flex-start; min-height: 46px; }

    .bar-track.indeterminate { position: relative; }
    .bar-track.indeterminate::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: -35%; width: 35%;
      border-radius: 5px; background: var(--positive); opacity: 0.75;
      animation: indeterminate 1.1s ease-in-out infinite;
    }
    @keyframes indeterminate { to { left: 100%; } }
    .fine-pointer-only { display: none; }
    @media (hover: hover) and (pointer: fine) { .fine-pointer-only { display: block; } }

    /* Category of a statement row: a small chip showing the choice, with the native select laid over it.
       The select itself stays 16px (iOS zooms into a focused field under 16px and the page then pans
       sideways) but is invisible, so the row keeps its hierarchy: title and amount first, category small. */
    .review-meta .cat-chip {
      position: relative; flex: 1 0 100%; order: 3; height: 36px; min-width: 0;
      display: flex; align-items: center; padding: 0 30px 0 9px;
      border-radius: 8px; background: var(--surface-1); border: 1px solid var(--border);
      color: var(--text-primary); font-size: 12px; font-weight: 600;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%), linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
      background-position: calc(100% - 16px) 15px, calc(100% - 11px) 15px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .review-meta .cat-chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
    .review-meta .cat-chip select {
      position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; margin: 0; padding: 0;
      opacity: 0; font-size: 16px; border: 0; -webkit-appearance: none; appearance: none; cursor: pointer;
    }
    .review-meta .cat-chip:focus-within { outline: 2px solid var(--positive); outline-offset: 2px; }
    .review-meta .dup-tag { order: 4; }
    .about-version { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .diag-pre { margin: 0; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-secondary);
      font: 500 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
    #stText { font-weight: 500; line-height: 1.5; }

    .ob-restore { align-self: flex-start; display: inline-flex; align-items: center; min-height: 40px; font-size: 12.5px; font-weight: 700; color: var(--positive); }

    .sheet-body > *, .ob-top > *, .stack > * { flex-shrink: 0; }
    .receipt-preview img { width: auto; height: auto; }
    @media (min-width: 520px) and (max-height: 600px) {
      body { padding: 0; }
      /* a phone on its side: the frame reaches the bottom edge, so the tab bar stays above the home indicator */
      .app { height: 100vh; height: 100dvh; border-radius: 0; border-width: 0 1px; --safe-bottom: env(safe-area-inset-bottom, 0px); }
    }
    /* CATAT: "Dari screenshot" (photo picker) with Tempel (clipboard) as one full-width card above the two tools */
    .dock-card.shot-card {
      grid-column: 1 / -1;
      padding: 0;
      align-items: center;
      gap: 0;
      cursor: default;
      border-color: rgba(52, 211, 153, 0.26);
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.06) 0%, var(--surface-1) 100%);
    }
    .dock-card.shot-card:active { transform: none; }
    .shot-main {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      cursor: pointer;
      border-radius: var(--radius-lg);
      transition: transform 0.18s var(--spring);
    }
    .shot-main:active { transform: scale(0.97); }
    .shot-main:focus-within { outline: 2px solid var(--positive); outline-offset: -2px; }
    .shot-main .dock-text strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shot-main .dock-text small { line-height: 1.35; }
    .dock-icon.accent { background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.32); color: var(--positive); }
    .dock-icon.accent svg { width: 17px; height: 17px; }
    .paste-pill {
      flex-shrink: 0;
      margin-right: 10px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
    }
    .paste-pill::after { content: ''; position: absolute; inset: -6px -4px; }
    .paste-pill svg { width: 15px; height: 15px; stroke-width: 1.9; }
    .shot-card.pulse { animation: shotPulse 1.4s var(--spring) 2; }
    @keyframes shotPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
      30% { box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.35); }
    }
    .parsed-tag.shot-tag { border-color: rgba(56, 189, 248, 0.4); padding-right: 11px; }
    .parsed-tag .pt-icon { display: inline-flex; color: var(--rollover); flex-shrink: 0; }
    .parsed-tag .pt-icon svg { width: 14px; height: 14px; stroke-width: 2; }

    /* Transaction sheet: what was read (picture + note), possible duplicate, fields not found */
    .read-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
    }
    .read-thumb {
      width: 52px;
      height: 92px;
      padding: 0;
      flex-shrink: 0;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid var(--border-hover);
      background: var(--surface-3);
      cursor: zoom-in;
    }
    .read-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .read-card.expanded .read-thumb { order: 2; width: 100%; height: auto; cursor: zoom-out; background: var(--bg-app); }
    .read-card.expanded .read-thumb:active { transform: none; }
    .read-card.expanded .read-thumb img { height: auto; max-height: 70vh; object-fit: contain; }
    .read-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 11px;
      background: var(--surface-3);
      color: var(--rollover);
      display: flex; align-items: center; justify-content: center;
    }
    .read-icon svg { width: 18px; height: 18px; stroke-width: 1.8; }
    .read-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .read-meta strong { font-size: 12.5px; font-weight: 700; line-height: 1.4; color: var(--rollover); }
    .read-card.failed .read-meta strong { color: var(--warning); }
    .read-meta small { font-size: 11.5px; line-height: 1.4; color: var(--text-muted); overflow-wrap: anywhere; }
    .read-meta .read-warn { color: var(--warning); }
    /* Hapus on an item from "Menunggu dicatat": secondary, beside what the card says */
    .read-card .read-discard { min-height: 40px; padding: 0 12px; font-size: 12.5px; gap: 6px; flex-shrink: 0; color: var(--text-secondary); }
    .read-card .read-discard svg { width: 14px; height: 14px; }
    .dup-note { display: flex; flex-direction: column; gap: 2px; }
    .dup-note strong { font-weight: 700; }
    .dup-note span { color: var(--text-secondary); overflow-wrap: anywhere; }
    .field.unsure .field-label { color: var(--warning); }
    .field.unsure .ob-input { border-color: rgba(251, 191, 36, 0.55); }
    .field.unsure .ob-input:focus { border-color: var(--warning); }
    .unsure-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 8px;
      background: rgba(251, 191, 36, 0.12);
      color: var(--warning);
      font-size: 10.5px;
      font-weight: 700;
      vertical-align: 1px;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .check-row input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--positive); cursor: pointer; }
    .field-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    /* Settings link row + screenshot tips sheet */
    .settings-link {
      width: 100%;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      color: inherit;
      cursor: pointer;
      justify-content: flex-start;
    }
    .settings-link .sr-text { flex: 1; }
    .settings-link > svg { width: 16px; height: 16px; stroke-width: 2; color: var(--text-muted); flex-shrink: 0; }
    .settings-link .sr-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: 10px;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--positive);
      display: flex; align-items: center; justify-content: center;
    }
    .settings-link .sr-icon svg { width: 16px; height: 16px; stroke-width: 1.8; }
    .settings-link:active { transform: scale(0.98); }
    .tip-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .tip { display: flex; gap: 12px; align-items: flex-start; }
    .tip-num {
      width: 26px; height: 26px; flex-shrink: 0;
      border-radius: 50%;
      background: var(--surface-3);
      color: var(--text-primary);
      font-size: 12.5px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .tip-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.55; color: var(--text-secondary); }
    .tip-body strong { font-size: 13.5px; color: var(--text-primary); }
    .tip-steps { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
    .tip-steps li { padding-left: 2px; }
    .tip-steps li::marker { color: var(--text-muted); font-weight: 700; }

    /* Settings: Notifikasi (optional Web Push). Busy buttons keep focus (aria-disabled) and show a spinner. */
    .push-box { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .push-lead { font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); }
    .push-note { font-size: 12.5px; line-height: 1.5; }
    .push-status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .push-status small { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .push-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--positive); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18); flex-shrink: 0; }
    /* the notify URL in one line, cut in the middle: the head ends in an ellipsis, the token's tail always shows */
    .push-url {
      display: flex; align-items: center; min-width: 0; min-height: 44px; padding: 0 12px;
      border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border);
      font: 600 12.5px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-primary);
      -webkit-user-select: all; user-select: all;
    }
    .push-url .pu-head { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .push-url .pu-tail { flex: 0 0 auto; white-space: nowrap; }
    .push-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .push-actions .btn-secondary { min-height: 46px; min-width: 0; padding: 0 10px; font-size: 12.5px; }
    .push-actions .btn-secondary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .push-box [aria-disabled="true"] { opacity: 0.72; cursor: progress; }
    .push-howto { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
    .push-howto > summary {
      list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 46px; padding: 0 12px; border-radius: 12px;
      font-size: 13px; font-weight: 600; color: var(--text-primary); cursor: pointer;
    }
    .push-howto > summary::-webkit-details-marker { display: none; }
    .push-howto > summary svg { width: 16px; height: 16px; stroke-width: 2; color: var(--text-muted); flex-shrink: 0; transition: transform 0.2s var(--spring); }
    .push-howto[open] > summary svg { transform: rotate(90deg); }
    .push-howto > summary:focus-visible { outline: 2px solid var(--positive); outline-offset: 2px; }
    .push-howto .tip-steps { margin: 0; padding: 0 14px 0 32px; font-size: 12.5px; line-height: 1.55; color: var(--text-secondary); }
    .push-how-note { padding: 10px 14px 14px; }
    .push-howto code { font: 600 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-primary); background: var(--surface-3); padding: 1px 5px; border-radius: 6px; white-space: nowrap; }
    .push-off { align-self: flex-start; }
    /* Safari tab on iPhone: move to the Home Screen app (backup first, in the Data group right below) */
    .push-install .tip-steps { margin-top: 8px; gap: 5px; }
    .push-install .tip-steps li::marker { color: inherit; }
    .btn-spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: btnSpin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes btnSpin { to { transform: rotate(360deg); } }

    /* CATAT opened from a notification: Tempel pulses and the card's text says what to do. The hint is laid over the
       title and the second line (same grid area, those two only fade out), so the card keeps its height: the dock
       and the mic above it do not move for its 12 s. (In place of the second line alone it grew the card wherever
       it wraps to more lines than that line: 2 against 1 on 360-375 pt phones.) */
    .paste-pill.pulse { animation: pastePulse 0.9s var(--spring) 3; }
    @keyframes pastePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); transform: scale(1); }
      35% { box-shadow: 0 0 0 5px rgba(52, 211, 153, 0.4); transform: scale(1.05); border-color: rgba(52, 211, 153, 0.85); }
    }
    .shot-card.hinting { border-color: rgba(52, 211, 153, 0.55); }
    .shot-main .dock-text { display: grid; grid-template-columns: minmax(0, 1fr); }
    .shot-main .dock-text > strong { grid-area: 1 / 1; }
    .shot-main .dock-text > small { grid-area: 2 / 1; }
    .shot-main .dock-text > .paste-hint { grid-area: 1 / 1 / 3 / 2; align-self: center; margin-top: 0; }
    .shot-card.hinting .dock-text > :not(.paste-hint) { opacity: 0; }
    .dock-text small.paste-hint { color: var(--positive); font-weight: 600; }

    /* KEYBOARD (phones). While a field is edited the viewport guard (JS) sets --kb (how much of the shell the
       keyboard covers, accessory bar included) and --vv-top (how far iOS panned the visible area; the guard scrolls
       that back when it can). Sheets and the setup screen then fill just the visible area: the field, the sheet's
       buttons and toasts stay above the keyboard; the page behind a sheet stays where it was. */
    .app.kb-open .sheet-layer,
    .app.kb-open .onboarding-screen { top: var(--vv-top); bottom: var(--kb); }
    .app.kb-open.sheet-open .app-main, .app.kb-open.ob-open .app-main { transform: translateY(var(--vv-top)); }
    .app.kb-open .sheet-foot { padding-bottom: 12px; }
    .app.kb-open .sheet-body:has(+ .sheet-foot:empty) { padding-bottom: 18px; }
    .app.kb-open .onboarding-screen { padding-bottom: 12px; }
    .app.kb-open .toast-host { bottom: auto; top: calc(var(--vv-top) + 14px + var(--safe-top)); }
    /* a phone on its side leaves under 200px above the keyboard: the sheet takes all of it, with slimmer chrome */
    @media (max-height: 500px) {
      .app.kb-open .sheet { max-height: 100%; border-radius: 16px 16px 0 0; }
      .app.kb-open .sheet-grab { display: none; }
      .app.kb-open .sheet-head { padding-top: 4px; padding-bottom: 2px; }
      .app.kb-open .sheet-close { width: 36px; height: 36px; }
      .app.kb-open .sheet-body { padding-top: 6px; padding-bottom: 8px; }
      .app.kb-open .hist-search { top: -6px; margin-top: -6px; padding-top: 6px; }
      .app.kb-open .sheet-foot { padding-top: 6px; padding-bottom: 6px; }
      .app.kb-open .sheet-foot .btn-primary, .app.kb-open .sheet-foot .btn-danger, .app.kb-open .sheet-foot .btn-secondary { min-height: 40px; }
    }

    @media (max-width: 360px) {
      :root { --gutter: 16px; }
      .hero-amount { font-size: 31px; }
    }

    /* SHORT SCREENS (iPhone SE / 8, a phone on its side): the whole Catat tab fits above the tab bar.
       Tighter composer, slimmer pills, a smaller mic and compact dock cards; while typing, the pills step aside so
       the text, its rows, the mic and Save share the little room above the keyboard. */
    @media (max-height: 700px) {
      #viewCatat { padding-bottom: 12px; }
      .catat-studio { gap: 10px; }
      .voice-stage { padding: 10px 14px 10px; --stage-gap: 8px; --halo: 5px; --orb: 52px; --gap-a: 9px; --cap-gap: 3px; }
      .catat-wallet-selector { margin-left: -14px; margin-right: -14px; padding-left: 14px; padding-right: 14px; width: calc(100% + 28px); }
      .voice-stage > .catat-wallet-selector { margin-bottom: 0; }
      .catat-wallet-selector > .w-pill { min-height: 36px; }
      .voice-orb svg { width: 20px; height: 20px; }
      .stage-bottom-slot { height: 51px; padding-top: 8px; }
      .full-save-bar-btn { height: 42px; }
      .app.kb-open .voice-stage > .catat-wallet-selector { display: none; }
    }
    /* the smallest phones (SE 1st gen): two lines of text while typing and a smaller mic with tighter air, so a
       whole row still shows above it; without the keyboard a slightly smaller mic too, so the tab fits above the
       tab bar with the mic in one place */
    @media (max-height: 600px) {
      .voice-stage { --orb: 48px; --halo: 4px; --gap-a: 7px; --gap-b: 0px; }
      .app.kb-open .caption-input { max-height: calc(2 * 1.35em + 5px); }
      .app.kb-open .voice-stage { --orb: 34px; --halo: 3px; --gap-a: 6px; --gap-b: 0px; padding-top: 6px; padding-bottom: 6px; }
      .app.kb-open .voice-orb svg { width: 16px; height: 16px; }
      .live-parsed-preview.stacked { margin-top: 5px; box-shadow: 0 -7px 0 -5px #2F2F36, 0 -14px 0 -9px #222228; }
    }
    @media (max-height: 700px) {
      .bottom-dock-section, .dock-buttons { gap: 8px; }
      .dock-card { min-height: 48px; padding: 9px 10px; }
      .dock-icon { width: 30px; height: 30px; border-radius: 9px; }
      .shot-main { padding: 9px 10px; }
      .paste-pill { min-height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        transition-delay: 0s !important;
        scroll-behavior: auto !important;
      }
      .success-ring svg { stroke-dashoffset: 0; }
    }
  </style>
</head>
