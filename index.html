      const low = deaccent(core.toLowerCase());
      out.push({ raw, core, low, compact: compactKey(core), used: null });
    }
    return out;
  }

  // Indonesian number words: "dua puluh lima ribu", "seratus lima puluh ribu", "satu koma lima juta", slang "goceng"
  function parseWordNumber(toks, i, blocked) {
    let total = 0, group = 0, last = 0, kind = null, frac = '', inFrac = false;
    let strong = false, slang = false, top = 1, any = false, j = i, lastBig = 0;
    const fracVal = () => (frac ? Number('0.' + frac) : 0);
    for (; j < toks.length; j++) {
      if (blocked(j)) break;
      const w = toks[j].low;
      if (inFrac) {
        if (hasOwn(W_DIGIT, w)) { frac += W_DIGIT[w]; kind = 'frac'; continue; }
        inFrac = false;
      }
      if (hasOwn(W_DIGIT, w)) {
        if (kind && ['puluh', 'ratus', 'big', 'seratus'].indexOf(kind) < 0) break;
        group += W_DIGIT[w]; last = W_DIGIT[w]; kind = 'digit'; any = true;
      } else if (hasOwn(W_SE, w)) {
        if (kind && ['ratus', 'big'].indexOf(kind) < 0) break;
        group += W_SE[w]; last = 0; kind = w === 'seratus' ? 'seratus' : 'se'; strong = true; any = true;
      } else if (hasOwn(W_SE_BIG, w)) {
        if (kind && kind !== 'big') break;
        total += W_SE_BIG[w]; top = Math.max(top, W_SE_BIG[w]); lastBig = W_SE_BIG[w]; kind = 'big'; strong = true; any = true;
      } else if (w === 'setengah') {
        if (kind && ['digit', 'big'].indexOf(kind) < 0) break;
        group += 0.5; kind = 'half'; any = true;
      } else if (hasOwn(W_SLANG, w)) {
        if (kind && kind !== 'big') break;
        group += W_SLANG[w]; kind = 'slang'; slang = true; strong = true; any = true;
      } else if (w === 'belas') {
        if (kind !== 'digit') break;
        group += 10; kind = 'belas'; strong = true;
      } else if (w === 'puluh') {
        if (kind !== 'digit') break;
        group += last * 9; kind = 'puluh'; strong = true;
      } else if (w === 'ratus') {
        if (kind !== 'digit') break;
        group += last * 99; kind = 'ratus'; strong = true;
      } else if (hasOwn(W_BIG, w)) {
        if (!kind || kind === 'big') break;
        total += (group + fracVal()) * W_BIG[w];
        top = Math.max(top, W_BIG[w]); lastBig = W_BIG[w]; group = 0; frac = ''; kind = 'big'; strong = true;
      } else if (w === 'koma' && ['digit', 'puluh', 'belas', 'se', 'ratus', 'seratus', 'slang'].indexOf(kind) >= 0 &&
        j + 1 < toks.length && !blocked(j + 1) && hasOwn(W_DIGIT, toks[j + 1].low)) {
        inFrac = true; kind = 'koma';
      } else break;
    }
    if (!any) return null;
    // Spoken "sejuta dua ratus" = 1.200.000, "dua juta setengah" = 2.500.000, "sejuta dua" = 1.200.000
    if (lastBig >= 1e6 && kind !== 'big' && !frac && group > 0 && group < 1000) {
      group = group === 0.5 ? lastBig / 2 : group < 10 ? group * lastBig / 10 : group * lastBig / 1000;
    }
    const value = total + group + fracVal();
    if (!(value > 0)) return null;
    if (kind === 'half' && top === 1) return null;
    return { start: i, end: j, value, strong, slang, mult: top, hasUnit: top >= 1000, hasCur: false, isWord: true };
  }

  // A number literal at token k, with its unit ("25rb", "25 ribu", "1 setengah juta").
  function literalAt(toks, k, blocked) {
    const m = LIT_RE.exec(toks[k].low);
    if (!m) return null;
    const v = parseNumLiteral(m[2]);
    if (!isFinite(v)) return null;
    let mult = 1, hasUnit = false, end = k + 1, base = v;
    const free = j => j < toks.length && !blocked(j);
    if (m[3]) { mult = UNIT_MULT[m[3]]; hasUnit = true; } else if (free(end) && hasOwn(UNIT_MULT, toks[end].low)) {
      mult = UNIT_MULT[toks[end].low]; hasUnit = true; end++;
    } else if (/^\d+$/.test(m[2]) && free(end) && free(end + 1) && toks[end].low === 'setengah' && hasOwn(UNIT_MULT, toks[end + 1].low) && UNIT_MULT[toks[end + 1].low] >= 1e3) {
      // "2 setengah juta" = 2.500.000
      mult = UNIT_MULT[toks[end + 1].low]; hasUnit = true; base = v + 0.5; end += 2;
    }
    return { m, v, value: base * mult, mult, hasUnit, hasCur: !!m[1], end };
  }

  function findAmountCandidates(toks) {
    const out = [];
    const blocked = j => !!toks[j].used;
    const free = j => j < toks.length && !blocked(j);
    let i = 0;
    while (i < toks.length) {
      if (blocked(i)) { i++; continue; }
      let k = i, hasCur = false;
      if (CUR_PREFIX.has(toks[i].low) && free(i + 1) && /^\d/.test(toks[i + 1].low)) { k = i + 1; hasCur = true; }
      let lit = literalAt(toks, k, blocked);
      if (!lit && k !== i) { k = i; hasCur = false; lit = literalAt(toks, k, blocked); }
      if (lit) {
        let end = lit.end;
        if (lit.hasCur) hasCur = true;
        if (free(end) && CUR_SUFFIX.has(toks[end].low)) { hasCur = true; end++; }
        const cand = { start: i, end, value: lit.value, hasUnit: lit.hasUnit, hasCur, slang: false, strong: true, mult: lit.mult, isWord: false, weak: false, bare: false };
        const plainInt = !lit.hasUnit && !hasCur && /^\d+$/.test(lit.m[2]);
        // "2 x 25rb": quantity times a price
        if (plainInt && lit.v >= 1 && lit.v < 100 && free(end) && free(end + 1) && (toks[end].low === 'x' || toks[end].low === '×')) {
          const nx = literalAt(toks, end + 1, blocked);
          if (nx && (nx.hasUnit || nx.hasCur || nx.value >= 1000)) {
            Object.assign(cand, { value: lit.v * nx.value, hasUnit: nx.hasUnit, hasCur: nx.hasCur, mult: nx.mult, end: nx.end });
            out.push(cand);
            i = nx.end;
            continue;
          }
        }
        if (plainInt) {
          cand.bare = true;
          // "2 roti": a bare small integer followed by a noun is a quantity, not a price
          if (lit.v < 1000 && free(end)) {
            const nl = toks[end].low;
            if (/^[a-z]/.test(nl) && !QTY_NEXT_OK.has(nl) && !hasOwn(UNIT_MULT, nl)) cand.weak = true;
          }
        }
        out.push(cand);
        i = end;
        continue;
      }
      const w = parseWordNumber(toks, i, blocked);
      if (w) {
        if (free(w.end) && CUR_SUFFIX.has(toks[w.end].low)) { w.hasCur = true; w.end++; }
        if (w.strong) out.push(w);
        i = Math.max(w.end, i + 1);
        continue;
      }
      i++;
    }
    const merged = [];
    out.forEach(c => {
      const p = merged[merged.length - 1];
      const next = p && p.end === c.start;
      if (next && p.hasUnit && p.mult >= 1e6 && c.hasUnit && c.mult < p.mult) {
        // "2 juta 500 ribu" -> one amount
        p.value += c.value; p.end = c.end; p.hasCur = p.hasCur || c.hasCur;
      } else if (next && p.hasUnit && !p.isWord && c.bare && !c.weak && Number.isInteger(c.value) &&
        ((p.mult >= 1e6 && c.value >= 1 && c.value < 1000) || (p.mult === 1e3 && c.value >= 100 && c.value < 1000))) {
        // spoken "1 juta 200" = 1.200.000, "2 juta 5" = 2.500.000, "15 ribu 500" = 15.500
        p.value += c.value * (p.mult >= 1e6 && c.value < 10 ? p.mult / 10 : p.mult / 1000);
        p.end = c.end;
      } else merged.push(c);
    });
    return merged.filter(c => c.value <= MAX_AMOUNT);
  }

  function pickAmount(cands) {
    cands = cands.filter(c => !c.weak);
    if (!cands.length) return null;
    const marked = cands.filter(c => c.hasUnit || c.hasCur || c.slang);
    const pool = marked.length ? marked : cands;
    let best = pool[0];
    pool.forEach(c => { if (c.value > best.value) best = c; });
    return best;
  }

  function parseAmountInput(str, currency, lang) {
    const c = cur(currency);
    if (typeof str === 'number') {
      const v = roundTo(str, c.decimals);
      return isFinite(str) && v > 0 && v <= MAX_AMOUNT ? v : null;
    }
    if (typeof str !== 'string') return null;
    let s = deaccent(str.toLowerCase()).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
    if (!s || /^[-−(]/.test(s)) return null;
    s = s.replace(/^(?:rp|idr|us\$|s\$|sgd|usd|\$)\.?\s*/, '').replace(/\s*(?:rupiah|perak|idr|usd|sgd|dollars?|dolar)$/, '').replace(/(\d)[.,]-+$/, '$1').trim();
    if (!s || /^-/.test(s)) return null;
    // English "4.5m" = million (in Indonesian "M" means miliar, so it is left alone there)
    if (lang === 'en') s = s.replace(/^(.*\d)\s*m$/, '$1 million');
    let v = null;
    const m = /^(\d+(?:[.,]\d+)*[.,]?|[.,]\d+)\s*(rb|rbu|ribu|rebu|k|jt|jta|juta|miliar|milyar|thousand|million|billion)?$/.exec(s);
    if (m) v = parseNumLiteral(m[1]) * (m[2] ? UNIT_MULT[m[2]] : 1);
    else if (/^\d{1,3}(?: \d{3})+$/.test(s)) v = Number(s.replace(/ /g, ''));
    else {
      const toks = tokenize(s);
      // "1jt 500rb", "1 juta 500 ribu", "2 setengah juta" read as one amount
      const cands = toks.length ? findAmountCandidates(toks) : [];
      if (cands.length === 1 && cands[0].start === 0 && cands[0].end === toks.length && !cands[0].weak) v = cands[0].value;
      else {
        const w = toks.length ? parseWordNumber(toks, 0, () => false) : null;
        if (w && w.end === toks.length) v = w.value;
      }
    }
    if (v === null || !isFinite(v) || v > MAX_AMOUNT) return null;
    v = roundTo(v, c.decimals);
    return v > 0 ? v : null;
  }

  // ---------- parseEntry ----------
  const KEMARIN = new Set(['kemarin', 'kemaren', 'kmrn', 'kmrin', 'kmarin', 'kemarn']);
  const DAY_WORDS = new Set(['hari', 'hr', 'day', 'days']);
  const WEEK_WORDS = new Set(['minggu', 'mgg', 'week', 'weeks']);
  const AGO_WORDS = new Set(['lalu', 'ago', 'kebelakang']);

  function smallNumberAt(toks, i) {
    const w = toks[i] && toks[i].low;
    if (!w) return null;
    if (/^\d{1,3}$/.test(w)) return Number(w);
    if (hasOwn(W_DIGIT, w)) return W_DIGIT[w];
    if (w === 'sepuluh') return 10;
    return null;
  }

  // "tgl 12" / "tanggal 12 oktober": the most recent such day that is not in the future
  function dayRef(d, mo, today) {
    const t = parseDayKey(today);
    if (!t || !(d >= 1 && d <= 31)) return null;
    if (mo) return resolveDate(null, mo, d, today);
    let y = t.y, m = t.m;
    if (d > t.d) { m -= 1; if (m < 1) { m = 12; y -= 1; } }
    return d <= daysInMonth(y, m) ? dayKey(y, m, d) : null;
  }

  // Marks date words as used; returns { offset (days from today), found }.
  function markDates(toks, today) {
    let offset = 0, found = false;
    const mark = (a, b) => { for (let j = a; j < b; j++) toks[j].used = 'date'; };
    const firstFree = toks.findIndex(t => !t.used);
    for (let i = 0; i < toks.length; i++) {
      if (toks[i].used) continue;
      const w = toks[i].low, n1 = toks[i + 1] ? toks[i + 1].low : '';
      if (KEMARIN.has(w) && n1 === 'lusa') { mark(i, i + 2); if (!found) { offset = -2; found = true; } i++; continue; }
      if (KEMARIN.has(w) || w === 'yesterday') { mark(i, i + 1); if (!found) { offset = -1; found = true; } continue; }
      // "semalam makan 50rb" = last night; "hotel semalam" (one night) is left alone
      if (w === 'semalam' && i === firstFree) { mark(i, i + 1); if (!found) { offset = -1; found = true; } continue; }
      if (w === 'hari' && n1 === 'ini') { mark(i, i + 2); if (!found) found = true; i++; continue; }
      if (w === 'today') { mark(i, i + 1); if (!found) found = true; continue; }
      if ((w === 'tgl' || w === 'tanggal' || w === 'tg') && today && /^\d{1,2}$/.test(n1) && toks[i + 1] && !toks[i + 1].used) {
        let j = i + 2, mo = 0;
        if (toks[j] && !toks[j].used) { mo = monthFromWord(toks[j].low); if (mo) j++; }
        const key = dayRef(Number(n1), mo, today);
        if (key) { mark(i, j); if (!found) { offset = diffDays(today, key); found = true; } i = j - 1; continue; }
      }
      let num = null, j = i + 1, unit = 1;
      if (w === 'sehari') num = 1;
      else if (w === 'seminggu') { num = 1; unit = 7; } else if (WEEK_WORDS.has(w) && (n1 === 'lalu' || n1 === 'kemarin')) { num = 1; unit = 7; j = i + 1; }
      else {
        num = smallNumberAt(toks, i);
        if (num !== null) {
          if (toks[j] && DAY_WORDS.has(toks[j].low)) j++;
          else if (toks[j] && WEEK_WORDS.has(toks[j].low)) { j++; unit = 7; } else num = null;
        }
      }
      if (num === null) continue;
      if (toks[j] && (toks[j].low === 'yang' || toks[j].low === 'yg')) j++;
      if (toks[j] && (AGO_WORDS.has(toks[j].low) || (unit === 7 && toks[j].low === 'kemarin'))) {
        mark(i, j + 1);
        if (!found) { offset = -num * unit; found = true; }
        i = j;
      }
    }
    return { offset, found };
  }

  const TRANSFER_WORDS = new Set(['transfer', 'trf', 'tf', 'transf', 'trasfer', 'pindah', 'pindahin', 'pindahkan', 'mindahin', 'mindahkan']);
  // "nabung 500rb ke BCA": moving money into a savings wallet
  const SAVE_WORDS = new Set(['nabung', 'menabung', 'nabungin', 'simpan', 'nyimpen', 'nyimpan']);
  const CASH_WORDS = new Set(['tunai', 'cash', 'uang', 'duit']);
  function detectKind(toks) {
    let kind = null, incomeTransfer = false, verbAt = -1;
    for (let i = 0; i < toks.length; i++) {
      if (toks[i].used) continue;
      const w = toks[i].low, nt = toks[i + 1], n = nt ? nt.low : '';
      if (TRANSFER_WORDS.has(w)) {
        if (n === 'masuk' || n === 'in' || n === 'diterima') incomeTransfer = true;
        else if (!kind) { kind = 'transfer'; verbAt = i; }
      } else if (SAVE_WORDS.has(w)) {
        if (!kind) { kind = 'save'; verbAt = i; }
      } else if ((w === 'top' && (n === 'up' || n === 'upp')) || w === 'topup' || w === 'top-up') {
        kind = 'topup';
      } else if (w === 'isi' && (n === 'saldo' || n === 'ulang')) {
        kind = 'topup';
      } else if (w === 'tarik' || w === 'withdraw' || (w === 'ambil' && CASH_WORDS.has(n))) {
        kind = 'withdraw';
        if (nt && CASH_WORDS.has(n)) nt.noWallet = true;
      } else if (w === 'setor' || w === 'deposit') {
        kind = 'deposit';
        if (nt && (n === 'tunai' || n === 'cash')) nt.noWallet = true;
      }
    }
    return { kind, incomeTransfer, verbAt };
  }

  const BRAND_ALIASES = {
    bca: ['mbca', 'klikbca', 'mybca', 'bcamobile'],
    mandiri: ['livin', 'livinmandiri', 'bankmandiri'],
    bri: ['brimo', 'bankbri'],
    bni: ['wondr', 'bnimobile', 'bankbni'],
    bsi: ['bsimobile'],
    gopay: ['gojekpay'],
    shopeepay: ['spay', 'shopepay'],
    jago: ['bankjago'],
    seabank: ['seabankid'],
    ovo: [], dana: [], linkaja: [], jenius: [], blu: [], cimb: ['octo'], permata: [], btn: [], flip: [], isaku: []
  };
  const CASH_ALIASES = ['tunai', 'cash', 'uangtunai', 'uangcash', 'duittunai', 'duitcash', 'kas', 'uangkas', 'dompet', 'kontan'];
  const CASH_NAME_WORDS = new Set(['tunai', 'cash', 'dompet', 'kas', 'kontan']);
  const BANK_WORDS = new Set(['bank', 'rek', 'rekening', 'akun', 'saldo', 'kartu', 'ewallet', 'e-wallet', 'aplikasi', 'app', 'mbanking', 'm-banking']);
  const SRC_PREP = new Set(['dari', 'dr', 'from', 'pakai', 'pake', 'pakek', 'pk', 'via', 'lewat', 'using', 'with', 'by', 'pakai']);
  const DST_PREP = new Set(['ke', 'kek', 'to', 'into', 'masuk']);
  const TOPUP_PREV = new Set(['up', 'upp', 'topup', 'top-up', 'isi', 'ulang']);
  const AMBIG_WALLET_WORDS = new Set(['dana', 'dompet', 'kas', 'jago', 'blu', 'flip']);
  const NOT_WALLET_NEXT = new Set(['darurat', 'pendidikan', 'pensiun', 'cadangan', 'talangan', 'hibah', 'bos', 'sosial', 'kesehatan', 'operasional', 'pinjaman', 'usaha', 'baru', 'kulit']);

  function isCashLikeName(name) {
    const words = normalizeText(name).split(' ');
    return words.some(w => CASH_NAME_WORDS.has(w)) || compactKey(name) === 'uangtunai';
  }

  function makeEnv(ctx) {
    const code = cur(ctx.currency).code;
    const all = Array.isArray(ctx.wallets) ? ctx.wallets : [];
    const wallets = all.filter(w => w && typeof w.id === 'string' && w.id && !w.archived);
    const fb = wallets.find(w => w.id === ctx.defaultWalletId) || wallets[0] || null;
    const AMBIG = '\u0000';
    const aliasMap = new Map();
    wallets.forEach(w => { const k = compactKey(w.name); if (k && !aliasMap.has(k)) aliasMap.set(k, w.id); });
    const soft = new Map();
    const addSoft = (k, id) => {
      if (!k || k.length < 2 || aliasMap.has(k)) return;
      if (soft.has(k) && soft.get(k) !== id) soft.set(k, AMBIG); else soft.set(k, id);
    };
    wallets.forEach(w => {
      const key = compactKey(w.name);
      const words = normalizeText(w.name).split(' ').filter(Boolean);
      words.forEach(word => { if (hasOwn(BRAND_ALIASES, word)) { addSoft(word, w.id); BRAND_ALIASES[word].forEach(a => addSoft(a, w.id)); } });
      if (hasOwn(BRAND_ALIASES, key)) BRAND_ALIASES[key].forEach(a => addSoft(a, w.id));
      if (isCashLikeName(w.name)) CASH_ALIASES.forEach(a => addSoft(a, w.id));
    });
    soft.forEach((id, k) => { if (id !== AMBIG) aliasMap.set(k, id); });
    let cashId = null;
    const cashW = wallets.find(w => ['tunai', 'cash', 'uangtunai', 'dompet', 'kas'].indexOf(compactKey(w.name)) >= 0) || wallets.find(w => isCashLikeName(w.name));
    if (cashW) cashId = cashW.id;
    const today = isDayKey(ctx.today) ? ctx.today : null;
    return { code, dec: cur(code).decimals, lang: langOf(ctx.lang), wallets, fallbackId: fb ? fb.id : null, aliasMap, cashId, today };
  }

  function findWalletMentions(toks, env) {
    const out = [];
    if (!env.aliasMap.size) return out;
    for (let i = 0; i < toks.length; i++) {
      let hit = null;
      for (let len = Math.min(3, toks.length - i); len >= 1; len--) {
        let ok = true, key = '';
        for (let j = i; j < i + len; j++) {
          if (toks[j].used || toks[j].noWallet || !toks[j].compact) { ok = false; break; }
          key += toks[j].compact;
        }
        if (ok && env.aliasMap.has(key)) { hit = { walletId: env.aliasMap.get(key), start: i, end: i + len }; break; }
      }
      if (!hit) continue;
      // role from the preceding word, skipping "bank", "rekening"...
      let p = hit.start - 1;
      const bankWords = [];
      while (p >= 0 && !toks[p].used && BANK_WORDS.has(toks[p].low)) {
        const pp = toks[p - 1];
        if (!(toks[p].low === 'saldo' && pp && pp.low === 'isi')) bankWords.push(p);
        p--;
      }
      const prev = p >= 0 ? toks[p].low : '';
      hit.role = SRC_PREP.has(prev) ? 'src' : DST_PREP.has(prev) ? 'dst' : (TOPUP_PREV.has(prev) || prev === 'saldo') ? 'dst' : 'none';
      // Names that are also ordinary words ("dana darurat", "beli dompet") need a clear wallet context.
      if (hit.end - hit.start === 1 && AMBIG_WALLET_WORDS.has(toks[hit.start].compact)) {
        const next = toks[hit.end] ? toks[hit.end].low : '';
        const before = hit.start > 0 ? toks[hit.start - 1].low : '';
        if ((hit.role === 'none' && !bankWords.length) || NOT_WALLET_NEXT.has(next) || before === 'beli' || before === 'bli') continue;
      }
      for (let j = hit.start; j < hit.end; j++) toks[j].used = 'wallet';
      bankWords.forEach(j => { toks[j].used = 'walletx'; });
      out.push(hit);
      i = hit.end - 1;
    }
    return out;
  }

  const STRONG_INCOME = ['gaji', 'gajian', 'salary', 'payroll', 'thr', 'bonus', 'cashback', 'refund', 'reimburse', 'reimbursement', 'kiriman', 'dikasih', 'dikasi', 'dikirimin', 'angpao', 'angpau', 'uang masuk', 'income', 'received', 'pemasukan', 'dibayar', 'hasil jualan', 'hasil jual', 'honor', 'komisi',
    'ditransfer', 'ditransferin', 'ditransferkan', 'ditf', 'ditrf', 'ditfin', 'dividen', 'dividend', 'bunga deposito', 'bunga tabungan', 'bunga bank', 'bunga rekening', 'got paid', 'get paid', 'getting paid'];
  const WEAK_INCOME = ['terima', 'nerima', 'diterima', 'dapat', 'dapet', 'dpt', 'masuk', 'jual', 'jualan', 'receive', 'earned', 'got', 'dikirim', 'dikirimi', 'menang', 'cair', 'hadiah'];
  const EXPENSE_VERBS = ['beli', 'bli', 'bayar', 'byr', 'belanja', 'jajan', 'buy', 'bought', 'pay', 'paid', 'spent', 'spend', 'kasih', 'ngasih', 'kirim', 'ngirim', 'traktir', 'nraktir'];
  const PAYABLE_INCOME = new Set(['gaji', 'thr', 'bonus', 'honor', 'fee', 'komisi', 'upah']);
  const MASUK_NOT_INCOME = new Set(['tiket', 'karcis', 'biaya', 'htm', 'ongkos']);
  const NOT_INCOME_WORDS = new Set(['ongkir', 'ongkos', 'biaya', 'admin', 'tagihan', 'cicilan', 'utang', 'hutang']);
  // People who send money: "uang dari ibu", "klien bayar 2jt", "ibu tf 500rb"
  const PERSONS = new Set(['ibu', 'bu', 'bapak', 'pak', 'ayah', 'mama', 'mamah', 'mami', 'papa', 'papah', 'papi', 'bunda', 'ortu', 'kakak', 'kak', 'adik', 'adek', 'om', 'tante', 'nenek', 'kakek', 'pacar', 'suami', 'istri', 'teman', 'temen', 'klien', 'client', 'customer', 'pelanggan', 'bos', 'boss', 'atasan', 'kantor', 'mas', 'mbak', 'bang', 'abang', 'saudara', 'sepupu', 'mertua', 'paman', 'bibi']);
  const PERSON_PAYS = new Set(['bayar', 'byr', 'bayarin', 'transfer', 'tf', 'trf', 'transf', 'kirim', 'ngirim', 'kasih', 'ngasih', 'paid', 'sent']);
  const HADIAH_FOR = new Set(['buat', 'bwt', 'untuk', 'utk', 'for']);

  // Word positions of income signals: strong keywords / people paying (strongAt) and weak verbs (weakAt).
  function incomeSignals(words) {
    let strongAt = -1, weakAt = -1;
    const spans = [];
    const first = (cur, i) => (cur < 0 || i < cur ? i : cur);
    STRONG_INCOME.forEach(kw => {
      const parts = kw.split(' ');
      for (let i = 0; i + parts.length <= words.length; i++) {
        if (parts.every((p, k) => words[i + k] === p)) { strongAt = first(strongAt, i); spans.push([i, i + parts.length]); }
      }
    });
    const blocked = words.some(w => NOT_INCOME_WORDS.has(w));
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (PERSONS.has(w) && PERSON_PAYS.has(words[i + 1] || '')) strongAt = first(strongAt, i);
      if ((w === 'dari' || w === 'dr' || w === 'from') && PERSONS.has(words[i + 1] || '')) strongAt = first(strongAt, i);
      if (WEAK_INCOME.indexOf(w) < 0 || blocked) continue;
      if (w === 'masuk' && i > 0 && MASUK_NOT_INCOME.has(words[i - 1])) continue;
      if (w === 'hadiah' && HADIAH_FOR.has(words[i + 1] || '')) continue;
      if ((w === 'dikirim' || w === 'dikirimi') && (words[i + 1] === 'ke' || words[i + 1] === 'to')) continue;
      weakAt = first(weakAt, i);
    }
    return { strongAt, weakAt, spans };
  }

  function detectIncome(toks, info) {
    if (info.incomeTransfer) return true;
    const words = toks.filter(t => t.used !== 'amount' && t.used !== 'wallet' && t.used !== 'date').map(t => normalizeText(t.low)).filter(Boolean);
    for (let i = 0; i + 1 < words.length; i++) {
      if ((words[i] === 'bayar' || words[i] === 'byr' || words[i] === 'pay') && PAYABLE_INCOME.has(words[i + 1])) return false;
    }
    const sig = incomeSignals(words);
    if (sig.strongAt < 0 && sig.weakAt < 0) return false;
    const inSpan = i => sig.spans.some(sp => i >= sp[0] && i < sp[1]);
    // "klien bayar": the person pays, so that "bayar" is not the user's purchase
    const verbAt = words.findIndex((w, i) => EXPENSE_VERBS.indexOf(w) >= 0 && !inSpan(i) && !(i > 0 && PERSONS.has(words[i - 1])));
    // "beli kopi 25rb bonus roti": a purchase verb before the income word keeps it an expense
    if (sig.strongAt >= 0) return !(verbAt >= 0 && verbAt < sig.strongAt);
    return verbAt < 0;
  }

  const FILLERS = new Set(['pakai', 'pake', 'pakek', 'pk', 'via', 'dari', 'dr', 'lewat', 'ke', 'tadi', 'td', 'barusan', 'beli', 'bli', 'membeli', 'bayar', 'byr', 'bayarin', 'buat', 'bwt', 'untuk', 'utk', 'rp', 'rupiah', 'perak', 'harga', 'seharga', 'sebesar', 'senilai', 'habis', 'abis', 'hbs', 'aku', 'saya', 'gue', 'gua', 'gw', 'ane', 'aja', 'saja', 'sih', 'nih', 'dong', 'deh', 'kok', 'ya', 'yah', 'udah', 'sudah', 'total', 'sekitar', 'with', 'using', 'paid', 'pay', 'for', 'from', 'to', 'into', 'on', 'spent', 'spend', 'bought', 'buy', 'i', 'my', '-', '+', '&', '/', 'x', '×']);
  const TIME_WORDS = new Set(['pagi', 'siang', 'sore', 'malam', 'malem', 'morning', 'afternoon', 'evening', 'tonight']);
  const QTY_NEXT_OK = new Set([].concat(Array.from(FILLERS).filter(w => w !== 'x' && w !== '×'), Array.from(SRC_PREP), Array.from(DST_PREP), Array.from(TIME_WORDS), ['aja', 'doang', 'an', 'an-an', 'tunai', 'cash', 'kemarin', 'yesterday', 'bulan', 'tahun', 'minggu', 'hari', 'ini', 'itu', 'lho', 'loh', 'kak', 'bro', 'sis', 'per', 'perbulan', 'sebulan']));
  const MEAL_WORDS = new Set(['makan', 'sarapan', 'jajan', 'ngopi', 'minum']);
  const INCOME_VERBS = new Set(['masuk', 'terima', 'nerima', 'diterima', 'dapat', 'dapet', 'dpt', 'received', 'got']);
  // Payment-method words after "pakai/via": "pakai debit bca" -> not part of the title
  const PAY_METHOD = new Set(['debit', 'kredit', 'credit', 'qris', 'kartu', 'card', 'duit', 'uang', 'tunai', 'cash', 'ewallet', 'e-wallet', 'mbanking', 'm-banking', 'transfer', 'tf']);
  const PAY_PREP = new Set(['pakai', 'pake', 'pakek', 'pk', 'via', 'lewat', 'using', 'with', 'by', 'dengan', 'pakek']);
  const TF_ABBR = new Set(['tf', 'trf', 'transf', 'trasfer']);
  const ACRONYMS = new Set(['thr', 'bpjs', 'pln', 'pdam', 'atm', 'krl', 'mrt', 'lrt', 'pbb', 'stnk', 'bbm', 'spp', 'ukt', 'atk', 'art', 'qris', 'kfc', 'ipl', 'sim', 'bca', 'bri', 'bni', 'bsi', 'btn', 'ovo', 'cgv', 'xxi', 'ppn', 'npwp', 'ktp', 'hp', 'tv', 'ac', 'spbu', 'jne', 'jnt', 'usb', 'pc', 'dp']);

  // ALL-CAPS input becomes Title case; known acronyms stay upper case ("Bayar BPJS", "Tarikan ATM").
  function tidyCase(s) {
    if (mostlyUpper(s) && s.replace(/[^A-Za-z]/g, '').length >= 3) {
      s = s.split(' ').map(w => { const lw = w.toLowerCase(); return lw.charAt(0).toUpperCase() + lw.slice(1); }).join(' ');
    }
    return s.replace(/[A-Za-z]+/g, w => (ACRONYMS.has(w.toLowerCase()) ? w.toUpperCase() : w));
  }

  function buildTitle(toks, type) {
    let keep = [];
    let prevLow = '', prevDropped = false;
    toks.forEach((t, i) => {
      const w = t.low;
      const wasPrev = prevLow, wasDropped = prevDropped;
      prevLow = w; prevDropped = true;
      if (t.used || !t.core) return;
      if (PAY_METHOD.has(w) && (PAY_PREP.has(wasPrev) || (wasDropped && PAY_METHOD.has(wasPrev)))) return;
      if (type === 'INCOME' && TF_ABBR.has(w)) return;
      // income from someone: keep "dari ibu" in the title
      const fromSomeone = type === 'INCOME' && (w === 'dari' || w === 'dr' || w === 'from') && toks[i + 1] && !toks[i + 1].used &&
        /^[a-z]{2,}$/.test(toks[i + 1].low) && !FILLERS.has(toks[i + 1].low);
      if (!fromSomeone && (FILLERS.has(w) || CUR_PREFIX.has(w) || CUR_SUFFIX.has(w))) return;
      if (TIME_WORDS.has(w) && !(keep.length && MEAL_WORDS.has(keep[keep.length - 1].low))) return;
      keep.push(t);
      prevDropped = false;
    });
    if (type === 'INCOME') keep = keep.filter(t => !INCOME_VERBS.has(t.low));
    let s = keep.map(t => t.core).join(' ').replace(/\s+/g, ' ').replace(/^[\s\-–—,.;:+&/]+|[\s\-–—,.;:+&/]+$/g, '').trim();
    if (s.length > 60) s = s.slice(0, 60).replace(/\s+\S*$/, '').trim() || s.slice(0, 60);
    s = tidyCase(s);
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  }

  // Glued punctuation from fast typing: "makan:25rb", "kopi,25rb", "makan(25rb)", "makan-25rb", "2x25rb"
  function prepEntryText(s) {
    return String(s)
      .replace(/[()[\]{}=@]/g, ' ')
      .replace(/([^\d\s]):/g, '$1 ').replace(/:(?=[^\d\s])/g, ' ')
      .replace(/([^\d\s,]),(?=\S)/g, '$1 ').replace(/(\d),(?=[a-z])/gi, '$1 ')
      .replace(/([a-z])-(?=\d)/gi, '$1 ')
      .replace(/(\d)\s*[x×]\s*(?=\d)/gi, '$1 x ');
  }

  const SUBJECT_SKIP = new Set(['biaya', 'admin', 'fee', 'ongkos', 'mau', 'mo', 'lagi', 'baru', 'langsung', 'jadi', 'tolong', 'coba', 'pengen', 'pingin', 'ingin', 'harus', 'wajib', 'rutin', 'auto', 'nanti', 'just', 'we', 'me', 'sekalian', 'terus', 'trus', 'lalu', 'dan', 'and', 'then', 'sdh', 'dah', 'top', 'isi', 'uang', 'duit']);
  // "tf gaji 5jt ke bca", "transfer dari budi ke bca", "ibu tf 500rb ke bca": money arriving from outside
  function receivedTransfer(toks, info) {
    const words = toks.filter(t => t.used !== 'amount' && t.used !== 'wallet' && t.used !== 'date' && t.used !== 'walletx').map(t => normalizeText(t.low)).filter(Boolean);
    if (incomeSignals(words).strongAt >= 0) return true;
    if (words.some(w => NOT_INCOME_WORDS.has(w))) return false;
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i], n = toks[i + 1];
      if (t.used) continue;
      if ((t.low === 'dari' || t.low === 'dr' || t.low === 'from') && n && !n.used && /^[a-z]{2,}$/.test(n.low) &&
        !FILLERS.has(n.low) && !BANK_WORDS.has(n.low) && !TIME_WORDS.has(n.low)) return true;
      if (i < info.verbAt && /^[a-z]{2,}$/.test(t.low) && !FILLERS.has(t.low) && !TIME_WORDS.has(t.low) && !SUBJECT_SKIP.has(t.low) &&
        !TRANSFER_WORDS.has(t.low)) return true;
    }
    return false;
  }

  function analyzeSegment(text, env) {
    const toks = tokenize(prepEntryText(text));
    if (!toks.length) return null;
    const date = markDates(toks, env.today);
    const info = detectKind(toks);
    const mentions = findWalletMentions(toks, env);
    // "isi gopay 50rb" -> top up
    if (!info.kind) {
      mentions.forEach(m => { if (m.start > 0 && toks[m.start - 1].low === 'isi') { info.kind = 'topup'; m.role = 'dst'; } });
    }
    const best = pickAmount(findAmountCandidates(toks));
    if (!best) return null;
    let amount = best.value;
    if (env.code === 'IDR' && !best.hasUnit && !best.hasCur && !best.slang && amount < 1000) amount *= 1000;
    amount = roundTo(amount, env.dec);
    if (!(amount > 0) || amount > MAX_AMOUNT) return null;
    for (let j = best.start; j < best.end; j++) toks[j].used = 'amount';

    const roleOf = r => mentions.find(m => m.role === r);
    // the wallet paired with `id` when the sentence names only one side: default wallet first, then a non-cash one
    const otherThan = (id, avoidCash) => {
      if (env.fallbackId && env.fallbackId !== id && !(avoidCash && env.fallbackId === env.cashId)) return env.fallbackId;
      const w = env.wallets.find(x => x.id !== id && x.id !== env.cashId) || (avoidCash ? null : env.wallets.find(x => x.id !== id));
      return w ? w.id : null;
    };
    let type = 'EXPENSE', walletId = null, toWalletId = null, explicitWallet = false, incomeInto = null;
    const received = info.kind === 'transfer' && !info.incomeTransfer && receivedTransfer(toks, info);
    if (info.kind && !info.incomeTransfer) {
      const src = roleOf('src'), dst = roleOf('dst');
      const none = mentions.filter(m => m.role === 'none');
      let srcId = src ? src.walletId : null, dstId = dst ? dst.walletId : null;
      if ((info.kind === 'topup' || info.kind === 'save') && !dstId && none.length) dstId = none.shift().walletId;
      if (info.kind === 'deposit') {
        if (!dstId) { const o = mentions.find(m => m.walletId !== env.cashId); if (o) dstId = o.walletId; }
        if (!srcId || srcId === dstId) srcId = env.cashId;
        if (!dstId && srcId) dstId = otherThan(srcId, true);
      }
      if (!srcId) { const o = none.find(m => m.walletId !== dstId); if (o) { srcId = o.walletId; none.splice(none.indexOf(o), 1); } }
      if (!dstId && info.kind !== 'withdraw') { const o = none.find(m => m.walletId !== srcId); if (o) dstId = o.walletId; }
      if (info.kind === 'withdraw') {
        if (!dstId && env.cashId && env.cashId !== srcId) dstId = env.cashId;
        // "tarik tunai 500rb": from the default (non-cash) wallet into cash
        if (dstId && !srcId) srcId = otherThan(dstId, true);
      }
      if (dstId && !srcId && received) incomeInto = dstId;
      else if (dstId && !srcId && (info.kind === 'topup' || info.kind === 'transfer' || info.kind === 'save')) srcId = otherThan(dstId, false);
      if (srcId && dstId && srcId !== dstId) { type = 'TRANSFER'; walletId = srcId; toWalletId = dstId; explicitWallet = true; }
    }
    if (type !== 'TRANSFER') {
      if (incomeInto) {
        type = 'INCOME'; walletId = incomeInto; explicitWallet = true;
      } else {
        type = received || detectIncome(toks, info) ? 'INCOME' : 'EXPENSE';
        // spending never comes out of a wallet named as the destination ("nabung 500rb ke BCA")
        const pref = type === 'INCOME'
          ? (roleOf('dst') || mentions[0])
          : (roleOf('src') || mentions.find(m => m.role === 'none'));
        walletId = pref ? pref.walletId : env.fallbackId;
        explicitWallet = !!pref;
      }
    }
    const catText = toks.filter(t => t.used !== 'wallet' && t.used !== 'walletx' && t.used !== 'amount' && t.used !== 'date').map(t => t.core).join(' ');
    const category = categorize(catText, type);
    let title = buildTitle(toks, type);
    if (type === 'TRANSFER') {
      const lt = title.toLowerCase();
      if (lt === 'isi' || lt === 'isi ulang') title = env.lang === 'en' ? 'Top up' : 'Isi saldo';
      else if (TRANSFER_WORDS.has(lt)) title = 'Transfer';
    }
    if (!title) title = categoryById(category).label[env.lang];
    const dk = env.today ? addDays(env.today, date.offset) : null;
    return { type, amount, title, category, walletId, toWalletId, dayKey: dk, explicitWallet, dateFound: date.found, offset: date.offset };
  }

  const SPLIT_RE = /(\s+(?:dan|terus|trus|trs|lalu|kemudian|and|then|sama|ama|sm|plus)\s+|\s+[+&]\s+|\s*;\s*|\s*\n+\s*|\s*,(?!\d)\s*|\.\s+|\s+(?=(?:(?:dapat|dapet|dpt)\s+)?(?:cashback|cb)\s+\S*\d))/i;
  const LEAD_CONNECTOR = /^(?:dan|terus|trus|trs|lalu|kemudian|and|then|sama|ama|plus)\s+/i;
  const ABBR_BEFORE_DOT = /(?:^|\s)(?:rp|idr|usd|sgd|no|jl|jln|tgl|kpd|sdr)$/i;
  function splitPieces(s) {
    const parts = s.split(SPLIT_RE);
    const out = [];
    let sep = '', lead = '';
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) { sep += parts[i] || ''; continue; }
      let t = (parts[i] || '').trim();
      if (!t) continue;
      // "dapat cashback 5rb" was cut on both sides of "dapat": keep the word with its cashback
      if (/^(?:dapat|dapet|dpt)$/i.test(t) && /^[ \t]+$/.test(parts[i + 1] || '')) { lead = t + ' '; continue; }
      if (lead) { t = lead + t; lead = ''; }
      const prev = out[out.length - 1];
      if (prev && /^\.\s+$/.test(sep) && ABBR_BEFORE_DOT.test(prev.text)) {
        // "Rp. 25.000", "Jl. Sudirman": the dot ends an abbreviation, not a sentence
        prev.text = prev.text + sep + t;
      } else if (prev && /^\s*lalu\s*$/i.test(sep) && /(hari|hr|minggu|mgg|bulan|yang|yg)$/i.test(prev.text)) {
        // "2 hari lalu ...", "seminggu yang lalu ..." : "lalu" is a date word here, not a separator
        prev.text = prev.text + sep + t;
      } else {
        const stripped = t.replace(LEAD_CONNECTOR, '').trim();
        if (stripped) t = stripped;
        // "... 200rb dapat cashback 5rb": the cashback is its own (income) entry
        out.push({ text: t, sep: out.length ? sep : '', cashback: !!out.length && /^[ \t]+$/.test(sep) });
      }
      sep = '';
    }
    return out;
  }

  function parseEntry(text, ctx) {
    const env = makeEnv(ctx || {});
    let src = String(text == null ? '' : text).replace(/ /g, ' ').trim();
    if (!src) return [];
    if (ctx && ctx.lang === 'en') src = src.replace(/(\d)[mM](?![a-zA-Z])/g, '$1jt');
    // numbered or bulleted lists pasted from notes: "1. kopi 25rb", "- roti 10rb"
    if (/^1[.)]\s+\D/.test(src)) src = src.replace(/(^|\s)\d{1,2}[.)]\s+(?=\D)/g, '\n');
    src = src.split('\n').map(l => l.replace(/^\s*(?:\d{1,2}[.)]|[-*•])\s+/, '')).join('\n').trim();
    if (!src) return [];
    // a split is kept only when both sides carry an amount; otherwise pieces are glued back
    const segs = [];
    splitPieces(src).forEach(p => {
      const has = !!analyzeSegment(p.text, env);
      const last = segs[segs.length - 1];
      if (last && !(last.has && has)) {
        last.text = last.text + p.sep + p.text;
        last.has = last.has || has;
      } else segs.push({ text: p.text, has, cashback: p.cashback });
    });
    const results = [];
    segs.forEach(sg => { const r = analyzeSegment(sg.text, env); if (r) { r.cashback = sg.cashback && results.length > 0; results.push(r); } });
    // a cashback shares the wallet of the purchase it came with
    results.forEach((r, i) => {
      const p = results[i - 1];
      if (!r.cashback || !p || p.type === 'TRANSFER') return;
      if (r.explicitWallet && !p.explicitWallet) { p.walletId = r.walletId; p.explicitWallet = true; } else if (!r.explicitWallet && p.explicitWallet) { r.walletId = p.walletId; r.explicitWallet = true; }
    });
    // a trailing "pakai X" applies to earlier entries of the same type that named no wallet
    const next = {};
    for (let i = results.length - 1; i >= 0; i--) {
      const r = results[i];
      if (r.type === 'TRANSFER') continue;
      if (r.explicitWallet) next[r.type] = r.walletId;
      else if (next[r.type]) r.walletId = next[r.type];
    }
    // "kemarin kopi 25rb dan makan 30rb": a date word carries over to later entries without their own
    let carry = null;
    results.forEach(r => {
      if (r.dateFound) carry = r.offset;
      else if (carry !== null && env.today) r.dayKey = addDays(env.today, carry);
    });
    return results.map(r => ({ type: r.type, amount: r.amount, title: r.title, category: r.category, walletId: r.walletId, toWalletId: r.toWalletId, dayKey: r.dayKey }));
  }

  // ---------- dates inside free text (statements, receipts) ----------
  const MONTH_NAMES = [
    ['januari', 'january', 'jan'], ['februari', 'pebruari', 'february', 'feb', 'peb'], ['maret', 'march', 'mar'],
    ['april', 'apr'], ['mei', 'may'], ['juni', 'june', 'jun'], ['juli', 'july', 'jul'],
    ['agustus', 'august', 'agu', 'agt', 'ags', 'aug', 'agst'], ['september', 'sept', 'sep'],
    ['oktober', 'october', 'okt', 'oct'], ['november', 'nopember', 'nov', 'nop'], ['desember', 'december', 'des', 'dec']
  ];
  function monthFromWord(w) {
    w = String(w || '').toLowerCase().replace(/\.$/, '');
    if (w.length < 3) return 0;
    for (let i = 0; i < 12; i++) {
      for (const n of MONTH_NAMES[i]) if (n === w || (n.length > w.length && n.indexOf(w) === 0)) return i + 1;
    }
    return 0;
  }
  function resolveDate(y, m, d, today) {
    if (!(m >= 1 && m <= 12) || !(d >= 1)) return null;
    if (y === null) {
      const t = parseDayKey(today);
      if (!t) return null;
      y = t.y;
      if (d > daysInMonth(y, m)) return null;
      let k = dayKey(y, m, d);
      if (k > today) { if (d > daysInMonth(y - 1, m)) return null; k = dayKey(y - 1, m, d); }
      return k;
    }
    if (y < 100) y += 2000;
    if (y < 1990 || y > 2100 || d > daysInMonth(y, m)) return null;
    return dayKey(y, m, d);
  }
  function findDates(str, today) {
    const s = String(str);
    const found = [];
    const push = (idx, len, key) => { if (key) found.push({ index: idx, end: idx + len, key }); };
    let m;
    const reIso = /(^|[^\d])(\d{4})-(\d{1,2})-(\d{1,2})(?!\d)/g;
    while ((m = reIso.exec(s))) push(m.index + m[1].length, m[0].length - m[1].length, resolveDate(+m[2], +m[3], +m[4], today));
    const reDMY = /(^|[^\d.,/-])(\d{1,2})([/.-])(\d{1,2})\3(\d{4}|\d{2})(?!\d)/g;
    while ((m = reDMY.exec(s))) push(m.index + m[1].length, m[0].length - m[1].length, resolveDate(+m[5], +m[4], +m[2], today));
    const reDM = /(^|[^\d.,/])(\d{1,2})\/(\d{1,2})(?![\d/])/g;
    while ((m = reDM.exec(s))) push(m.index + m[1].length, m[0].length - m[1].length, resolveDate(null, +m[3], +m[2], today));
    // a 2-digit "year" followed by ":30" is the hour of a time ("14 Okt 12:30")
    const reDMon = /(^|[^\da-z])(\d{1,2})[\s-]+([a-z]{3,9})\.?(?:[\s,-]+(\d{4}|\d{2}(?![:.]\d)))?(?![\da-z])/gi;
    while ((m = reDMon.exec(s))) {
      const mo = monthFromWord(m[3]);
      if (mo) push(m.index + m[1].length, m[0].length - m[1].length, resolveDate(m[4] ? +m[4] : null, mo, +m[2], today));
    }
    const reMonD = /(^|[^a-z])([a-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})(?!\d)/gi;
    while ((m = reMonD.exec(s))) {
      const mo = monthFromWord(m[2]);
      if (mo) push(m.index + m[1].length, m[0].length - m[1].length, resolveDate(+m[4], mo, +m[3], today));
    }
    found.sort((a, b) => a.index - b.index || b.end - a.end);
    // drop overlaps
    const out = [];
    found.forEach(f => { if (!out.length || f.index >= out[out.length - 1].end) out.push(f); });
    return out;
  }
  function stripRanges(s, ranges) {
    let out = s;
    ranges.slice().sort((a, b) => b.index - a.index).forEach(r => { out = out.slice(0, r.index) + ' '.repeat(r.end - r.index) + out.slice(r.end); });
    return out;
  }

  // money tokens in a line: '1.234.567' '1,234,567.00' '129.000,00' '129000' with optional sign / Rp / DB-CR marker
  const MONEY_RE = /(^|[\s(:=|])([-+]\s?)?((?:rp|idr|usd|sgd|us\$|s\$|\$)\.?\s?)?([-+]\s?)?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)(\)?)(?=$|[\s;|]|,\s|[.,]-|(?:db|cr|dr)(?![a-z]))/gi;
  const MARKER_AFTER_RE = /^\s*(db|cr|dr|d|k|debit|debet|kredit|credit)(?![a-z0-9])/i;
  function findMoney(line) {
    const out = [];
    MONEY_RE.lastIndex = 0;
    let m;
    while ((m = MONEY_RE.exec(line))) {
      const num = m[5];
      const plain = /^\d+$/.test(num);
      const start = m.index + m[1].length;
      let end = m.index + m[0].length;
      if ((plain && num.length > 1 && num[0] === '0') || (plain && num.length >= 9)) continue;
      const value = parseNumLiteral(num);
      if (!(value >= 0) || value > MAX_AMOUNT) continue;
      const sign = (m[2] || m[4] || '').trim() || null;
      const paren = m[1] === '(' && m[6] === ')';
      let marker = null;
      const mk = MARKER_AFTER_RE.exec(line.slice(end));
      if (mk) { marker = mk[1].toLowerCase(); end += mk[0].length; }
      // zero cells ("0,00") are kept so table columns can be told apart
      out.push({ value, zero: value === 0, sign, rp: !!m[3], paren, marker, formatted: !plain, index: start, end, raw: num });
    }
    return out;
  }
  const nonZero = toks => toks.filter(t => !t.zero);
  const MARKER_TYPE = { db: 'EXPENSE', dr: 'EXPENSE', d: 'EXPENSE', debit: 'EXPENSE', debet: 'EXPENSE', cr: 'INCOME', k: 'INCOME', kredit: 'INCOME', credit: 'INCOME' };
  const tokenType = t => (t.sign === '-' || t.paren ? 'EXPENSE' : t.sign === '+' ? 'INCOME' : t.marker ? MARKER_TYPE[t.marker] : null);

  function lineMarkerType(desc) {
    const l = ' ' + desc.toLowerCase() + ' ';
    let res = null, pos = -1;
    const scan = (re, type) => { let m; re.lastIndex = 0; while ((m = re.exec(l))) { if (m.index > pos) { pos = m.index; res = type; } } };
    scan(/[^a-z](db|dr|debit|debet|keluar|pengeluaran|uang keluar)(?=[^a-z])/g, 'EXPENSE');
    scan(/[^a-z](cr|kredit|credit|masuk|pemasukan|uang masuk)(?=[^a-z])/g, 'INCOME');
    if (/kartu (debit|kredit)/.test(l) && res && !/[^a-z](db|cr)[^a-z]/.test(l)) return 'EXPENSE';
    return res;
  }
  const MARKER_ONLY_RE = /^(db|cr|dr|d|k|debit|debet|kredit|credit|keluar|masuk|uang masuk|uang keluar|pengeluaran|pemasukan)$/i;

  const SALDO_WORD_RE = /(^|[^a-z])(saldo|balance)([^a-z]|$)/i;
  function isSaldoLine(line) {
    const l = line.toLowerCase();
    if (/(isi|top\s?-?up)\s+saldo/.test(l)) return false;
    return /(^|[^a-z])(saldo|balance|mutasi\s+(debet|debit|kredit|credit)|total\s+(mutasi|debet|debit|kredit|credit))([^a-z]|$)/.test(l);
  }
  // "... Rp 150.000,00 di INDOMARET. Saldo Rp 1.850.000,00": keep the transaction part before "Saldo"
  function beforeSaldo(line) {
    const m = SALDO_WORD_RE.exec(line);
    if (!m || m.index + m[1].length === 0) return null;
    const head = line.slice(0, m.index + m[1].length);
    if (/(saldo|balance)\s+(awal|akhir|opening|closing)/i.test(line) && !nonZero(findMoney(head)).length) return null;
    return nonZero(findMoney(head)).length ? head.trim() : null;
  }
  // Table header ("Tanggal  Keterangan  Debet  Kredit  Saldo"): which money column comes first.
  function headerOrder(line) {
    if (/\d/.test(line)) return null;
    const l = ' ' + line.toLowerCase() + ' ';
    if (!/[^a-z](saldo|balance|keterangan|deskripsi|description|tanggal|date|mutasi|nominal|jumlah|amount)[^a-z]/.test(l)) return null;
    const inM = /[^a-z](kredit|credit|cr|masuk|pemasukan|setoran|uang masuk|dana masuk)[^a-z]/.exec(l);
    const outM = /[^a-z](debet|debit|db|keluar|pengeluaran|penarikan|uang keluar|dana keluar)[^a-z]/.exec(l);
    if (!inM || !outM) return null;
    return inM.index < outM.index ? 'INCOME' : 'EXPENSE';
  }

  function titleCase(s) {
    return s.split(' ').map(w => {
      if (!w) return w;
      if (ACRONYMS.has(w.toLowerCase().replace(/[^a-z]/g, ''))) return w.toUpperCase();
      if (w.length <= 4 && /^[A-Z&]+$/.test(w) && !/[AEIOU]/.test(w)) return w;
      const lw = w.toLowerCase();
      return lw.charAt(0).toUpperCase() + lw.slice(1);
    }).join(' ');
  }
  function mostlyUpper(s) {
    const letters = s.replace(/[^A-Za-z]/g, '');
    if (!letters) return false;
    return letters.replace(/[^A-Z]/g, '').length / letters.length > 0.7;
  }

  const STMT_NOISE = new Set(['trsf', 'e-banking', 'ebanking', 'pend', 'switching', 'bi-fast', 'bifast', 'db', 'cr', 'dr', 'd', 'k', 'debit', 'debet', 'kredit', 'credit', 'rp', 'idr', 'wib', 'wita', 'wit', 'ref', 'trx', '-', '+', ':', '|', '/', 'mutasi',
    'transaksi', 'berhasil', 'sukses', 'no', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', "jum'at", 'sabtu', 'minggu', 'ahad', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday', '•', '·']);
  const STMT_EDGE_NOISE = new Set(['di', 'pada', 'at', 'on', 'sebesar', 'senilai', 'of']);
  function cleanStatementTitle(s) {
    let t = ' ' + String(s).replace(/\s+/g, ' ') + ' ';
    t = t.replace(/\bkartu\s+(debit|kredit)\b(?=\s+\S)/gi, ' ');
    // "BCA: ..." notification prefix
    t = t.replace(/^\s*[A-Za-z]{2,10}\s*:\s+(?=\S)/, ' ');
    let words = t.split(' ').map(w => w.replace(/^['"`]+/, '')).filter(w => {
      if (!w) return false;
      const lw = w.toLowerCase().replace(/[:;,.]+$/, '');
      if (STMT_NOISE.has(lw)) return false;
      if (/\d/.test(w) && (w.length >= 4 || /[/\\]/.test(w))) return false;
      if (/^\d+$/.test(lw)) return false;
      if (!/[a-z0-9]/i.test(w)) return false;
      return true;
    });
    const edge = w => STMT_EDGE_NOISE.has(w.toLowerCase().replace(/[:;,.]+$/, ''));
    while (words.length && edge(words[0])) words.shift();
    while (words.length && edge(words[words.length - 1])) words.pop();
    let out = words.join(' ').replace(/^[\s\-:|,.]+|[\s\-:|,.]+$/g, '').trim();
    if (mostlyUpper(out)) out = titleCase(out);
    if (out.length > 60) out = out.slice(0, 60).replace(/\s+\S*$/, '').trim();
    return out;
  }

  const blankTimes = s => s.replace(/\d{1,2}[:.]\d{2}:\d{2}|\d{1,2}:\d{2}/g, m => ' '.repeat(m.length));

  function analyzeStatementLine(line, today) {
    let work = blankTimes(line);
    let date = null, startsWithDate = false;
    if (/^pend\b/i.test(work)) { startsWithDate = true; date = today; work = work.replace(/^pend\b/i, '    '); }
    const ds = findDates(work, today);
    if (ds.length) {
      if (!date) date = ds[0].key;
      if (work.slice(0, ds[0].index).replace(/[^a-z0-9]/gi, '').replace(/^(senin|selasa|rabu|kamis|jumat|sabtu|minggu|mon|tue|wed|thu|fri|sat|sun)[a-z]*$/i, '') === '') startsWithDate = true;
      work = stripRanges(work, ds);
    }
    const cols = findMoney(work);
    const tokens = nonZero(cols);
    const desc = stripRanges(work, cols).replace(/\s+/g, ' ').trim();
    const markerOnly = tokens.length === 0 && MARKER_ONLY_RE.test(desc);
    return { date, startsWithDate, tokens, cols, desc: markerOnly ? '' : desc, marker: markerOnly ? lineMarkerType(' ' + desc + ' ') || MARKER_TYPE[desc.toLowerCase()] || null : lineMarkerType(desc), markerOnly };
  }

  function parseStatement(text, ctx) {
    ctx = ctx || {};
    const code = cur(ctx.currency).code;
    const dec = cur(code).decimals;
    const today = isDayKey(ctx.today) ? ctx.today : null;
    const lang = langOf(ctx.lang);
    const lines = [];
    let header = null;
    String(text == null ? '' : text).replace(/\r/g, '').split('\n').forEach(raw => {
      let line = raw.replace(/[−–—]/g, '-').replace(/ /g, ' ').replace(/\t/g, '  ').trim();
      if (!line) return;
      const h = headerOrder(line);
      if (h) { header = h; return; }
      if (isSaldoLine(line)) {
        line = beforeSaldo(line);
        if (!line) return;
      }
      lines.push(analyzeStatementLine(line, today));
    });
    // "Description, then date, then amount" layouts (Jago, SeaBank, e-wallets): the text line right
    // above each date line belongs to that date's transaction.
    const meaningful = L => /[a-z]{2,}/i.test(L.desc) && !L.markerOnly;
    const dateIdx = lines.map((L, i) => (L.startsWithDate ? i : -1)).filter(i => i >= 0);
    const descFirst = dateIdx.length > 0 && dateIdx.every(i => i > 0 && !meaningful(lines[i]) && !lines[i].tokens.length &&
      meaningful(lines[i - 1]) && !lines[i - 1].tokens.length && !lines[i - 1].startsWithDate);
    if (descFirst) dateIdx.forEach(i => { lines[i - 1].leadsDate = true; });
    const blocks = [];
    let blk = null;
    lines.forEach(L => {
      if (L.leadsDate) { blk = { date: null, lines: [], waiting: true }; blocks.push(blk); } else if (L.startsWithDate && blk && blk.waiting) {
        blk.date = L.date; blk.waiting = false;
      } else if (L.startsWithDate || !blk) { blk = { date: L.startsWithDate ? L.date : null, lines: [] }; blocks.push(blk); }
      blk.lines.push(L);
    });
    const items = [];
    const emit = (blkDate, ls, tok, explicitType, row) => {
      const amount = roundTo(tok.value, dec);
      if (!(amount > 0)) return;
      let type = explicitType;
      if (!type && !row) for (let i = ls.length - 1; i >= 0 && !type; i--) type = ls[i].marker;
      const ownDate = ls.map(l => l.date).find(Boolean);
      const title = cleanStatementTitle(ls.map(l => l.desc).filter(Boolean).join(' ')) || (lang === 'en' ? 'Transaction' : 'Transaksi');
      items.push({ dayKey: blkDate || ownDate || today, title, amount, type: type || 'EXPENSE', row: row || null, explicit: !!type });
    };
    blocks.forEach(b => {
      const ls = b.lines;
      const anchors = [];
      ls.forEach((L, li) => {
        const a = L.tokens.find(t => t.sign || t.marker || t.paren) || L.tokens.find(t => t.rp);
        if (a) anchors.push({ li, tok: a });
      });
      if (anchors.length) {
        const before = ls.slice(0, anchors[0].li + 1).map(l => l.desc).join('').trim();
        const after = ls.slice(anchors[0].li + 1).some(l => l.desc);
        const amountFirst = !before && after;
        anchors.forEach((a, k) => {
          let from, to;
          if (amountFirst) { from = a.li; to = k + 1 < anchors.length ? anchors[k + 1].li - 1 : ls.length - 1; } else {
            from = k === 0 ? 0 : anchors[k - 1].li + 1;
            to = k === anchors.length - 1 ? ls.length - 1 : a.li;
          }
          const group = ls.slice(from, to + 1);
          let type = tokenType(a.tok) || ls[a.li].marker;
          if (!type && ls[a.li + 1] && ls[a.li + 1].markerOnly) type = ls[a.li + 1].marker;
          emit(b.date, group, a.tok, type);
        });
        return;
      }
      // Table rows without DB/CR markers: with two or more amounts on a line, the last one is the
      // running balance, never the transaction amount.
      ls.forEach(L => {
        const f = L.cols.filter(t => t.formatted);
        if (f.length >= 2) { L.balance = f[f.length - 1].value; L.amountCols = f.slice(0, -1); }
      });
      const withTok = ls.filter(L => (L.amountCols ? L.amountCols.some(t => !t.zero) : L.tokens.length));
      if (!withTok.length) return;
      const rowOf = L => {
        if (!L.amountCols) return null;
        const idx = L.amountCols.findIndex(t => !t.zero);
        return { balance: L.balance, col: idx, cols: L.amountCols.length, tok: L.amountCols[idx], marker: L.marker };
      };
      const listMode = withTok.filter(L => L.desc).length >= 2 && !withTok.some(L => !L.desc);
      if (listMode) {
        withTok.forEach(L => { const r = rowOf(L); emit(b.date, [L], r ? r.tok : L.tokens.find(t => t.formatted) || L.tokens[0], r ? null : L.marker, r); });
        return;
      }
      const tableLine = withTok.filter(L => L.amountCols).pop();
      if (tableLine) { const r = rowOf(tableLine); emit(b.date, ls, r.tok, null, r); return; }
      const all = [];
      ls.forEach(L => L.tokens.forEach(t => all.push(t)));
      const formatted = all.filter(t => t.formatted);
      const pick = formatted.length ? formatted[formatted.length - 1] : all[all.length - 1];
      emit(b.date, ls, pick, null);
    });
    resolveRowTypes(items.filter(it => it.row), header);
    return items.map(it => ({ dayKey: it.dayKey, title: it.title, amount: it.amount, type: it.type, category: categorize(it.title, it.type) }));
  }

  // Debit or credit for table rows: running-balance changes first, then the header's column order,
  // then the column layout learned from other rows, then words in the row, else Debet-first.
  function resolveRowTypes(rows, header) {
    if (!rows.length) return;
    const eps = 0.005;
    const sign = (delta, a) => (Math.abs(delta - a) < eps ? 'INCOME' : Math.abs(delta + a) < eps ? 'EXPENSE' : null);
    let fwd = 0, back = 0;
    for (let i = 1; i < rows.length; i++) {
      if (sign(rows[i].row.balance - rows[i - 1].row.balance, rows[i].amount)) fwd++;
      if (sign(rows[i - 1].row.balance - rows[i].row.balance, rows[i - 1].amount)) back++;
    }
    const byBalance = (i) => {
      if (!fwd && !back) return null;
      const o = fwd >= back ? rows[i - 1] : rows[i + 1];
      return o ? sign(rows[i].row.balance - o.row.balance, rows[i].amount) : null;
    };
    const layout = {};
    rows.forEach((it, i) => {
      const t = byBalance(i);
      if (t) { it.type = t; it.done = true; if (it.row.cols === 2 && it.row.col >= 0) layout[it.row.col] = t; }
    });
    const flip = t => (t === 'INCOME' ? 'EXPENSE' : 'INCOME');
    if (layout[0] && !layout[1]) layout[1] = flip(layout[0]);
    if (layout[1] && !layout[0]) layout[0] = flip(layout[1]);
    rows.forEach(it => {
      if (it.done) return;
      const r = it.row;
      if (r.cols === 2 && header) it.type = r.col === 0 ? header : flip(header);
      else if (r.cols === 2 && layout[r.col]) it.type = layout[r.col];
      else if (r.marker) it.type = r.marker;
      else if (r.cols === 2) it.type = r.col === 0 ? 'EXPENSE' : 'INCOME';
      else it.type = 'EXPENSE';
    });
  }

  // ---------- receipts (OCR text) ----------
  const RC_IGNORE = /(^|[^A-Z])(TUNAI|CASH|KEMBALI|KEMBALIAN|CHANGE|PPN|DISKON|DISC|DISCOUNT|POTONGAN|HEMAT|VOUCHER|DPP|PAJAK|TAX|SERVICE|SVC|PB1|PBJT|ITEM|ITEMS|QTY|NPWP|TELP|TLP|PHONE|DEBIT|KREDIT|CREDIT|KARTU|CARD|EDC|QRIS|OVO|GOPAY|DANA|SHOPEEPAY|POIN|POINTS|ROUNDING|PEMBULATAN|DONASI|NO\.?\s*REK)([^A-Z]|$)/;
  const RC_TAXWORDS = /(^|[^A-Z])(PPN|TAX|PAJAK|SERVICE|SVC|PB1|PBJT)([^A-Z]|$)/g;
  const RC_PAID = /(^|[^A-Z])(BAYAR|DIBAYAR|PAID|PAYMENT)([^A-Z]|$)/;
  const RC_P1 = /GRAND\s*-?\s*TOTAL/;
  const RC_P2 = /TOTAL\s*(BAYAR|BELANJA|PEMBAYARAN|TAGIHAN|HARGA|AKHIR|DUE|AMOUNT|PAYMENT)|AMOUNT\s*DUE|TAGIHAN|NET\s*TOTAL|TOTAL\s*NET/;
  const RC_SUB = /SUB\s*-?\s*TOTAL|HARGA\s*JUAL/;
  const RC_P3 = /(^|[^A-Z])TOTAL([^A-Z]|$)/;
  const RC_P4 = /(^|[^A-Z])JUMLAH([^A-Z]|$)/;
  // leading run of header words: "STRUK PEMBAYARAN", "WELCOME TO", "SELAMAT DATANG DI"
  const RC_HEADER = /^(?:(?:STRUK|RECEIPT|NOTA|INVOICE|FAKTUR|KWITANSI|BUKTI|TAX|SALES|COPY|BILL|ORDER|CUSTOMER|WELCOME|SELAMAT|DATANG|TERIMA|KASIH|THANK|THANKS|YOU|CHECK|DUPLICATE|REPRINT|PEMBAYARAN|PENJUALAN|PEMBELIAN|BELANJA|TRANSAKSI|ORIGINAL|TO|DI|AT)(?:[^A-Z0-9]+|$))+/;
  const RC_SKIP = /^(JL|JLN|JALAN|NPWP|TELP|TLP|TEL|PHONE|HP|WA|NO|KASIR|CASHIER|TGL|TANGGAL|DATE|TIME|JAM|WWW|HTTP|EMAIL|ALAMAT|ADDRESS|KEC|KEL|KOTA|RT|RW|MEJA|TABLE|PAX|OPERATOR|STAFF|SERVER|ID)\b/;

  function fixOcrDigits(line) {
    return line.split(' ').map(w => {
      if (/\d/.test(w) && /^(rp\.?)?[\dOoIl|.,]+$/i.test(w) && (w.match(/\d/g) || []).length >= 2) {
        const pre = /^rp\.?/i.exec(w);
        const p = pre ? pre[0] : '';
        return p + w.slice(p.length).replace(/[Oo]/g, '0').replace(/[Il|]/g, '1');
      }
      return w;
    }).join(' ');
  }

  // OCR letter swaps inside words: "T0TAL" -> "TOTAL", "lNDOMARET" -> "INDOMARET", "TUNAl" -> "TUNAI"
  function fixOcrLetters(line) {
    return line.split(' ').map(w => {
      const letters = (w.match(/[A-Za-z]/g) || []).length;
      if (letters < 3) return w;
      let x = w.replace(/([A-Za-z])0(?=[A-Za-z])/g, '$1O').replace(/([A-Za-z])[1|](?=[A-Za-z])/g, '$1I');
      if ((x.match(/[A-Z]/g) || []).length / letters >= 0.7) x = x.replace(/l/g, 'I');
      return x;
    }).join(' ');
  }
  // OCR splits thousands with spaces: "45 000", "45 .000", "45. 000" -> "45.000"
  const joinSpacedThousands = s => s.replace(/(^|[^\d.,])(\d{1,3})(?: [.,] ?| ?[.,] | )(\d{3})(?!\d|[.,]\d)/g, '$1$2.$3');

  function extractReceipt(ocrText, ctx) {
    ctx = ctx || {};
    const code = cur(ctx.currency).code;
    const dec = cur(code).decimals;
    const today = isDayKey(ctx.today) ? ctx.today : null;
    const lang = langOf(ctx.lang);
    const text = String(ocrText == null ? '' : ocrText);
    const lines = text.replace(/\r/g, '').split('\n').map(l => l.replace(/[−–—]/g, '-').replace(/\s+/g, ' ').trim()).filter(Boolean);

    let dk = null;
    const parsed = lines.map(raw => {
      const line = fixOcrLetters(fixOcrDigits(raw));
      const timeless = blankTimes(line);
      const ds = findDates(timeless, today);
      if (!dk && ds.length) dk = ds[0].key;
      let work = stripRanges(timeless, ds);
      if (code === 'IDR') work = joinSpacedThousands(work);
      const toks = nonZero(findMoney(work));
      const up = line.toUpperCase();
      let ignore = RC_IGNORE.test(up);
      if (ignore && /INCL|TERMASUK|INCLUDING/.test(up)) ignore = RC_IGNORE.test(up.replace(RC_TAXWORDS, ' '));
      // "BAYAR 50.000" is the cash handed over, unless it is "TOTAL BAYAR"
      if (!ignore && RC_PAID.test(up) && !RC_P1.test(up) && !RC_P2.test(up)) ignore = true;
      let prio = 0;
      if (RC_P1.test(up)) prio = 1;
      else if (RC_P2.test(up)) prio = 2;
      else if (RC_SUB.test(up)) prio = 5;
      else if (RC_P3.test(up)) prio = 3;
      else if (RC_P4.test(up)) prio = 4;
      if (ignore) prio = 0;
      return { line, up, toks, ignore, prio, hasLetters: /[A-Za-z]{2,}/.test(work.replace(/rp/gi, '')) };
    });
    if (dk && today && dk > addDays(today, 1)) dk = null;

    // labelled totals
    const labelled = [];
    parsed.forEach((p, i) => {
      if (!p.prio) return;
      let tok = p.toks.length ? p.toks[p.toks.length - 1] : null;
      if (!tok && parsed[i + 1] && !parsed[i + 1].hasLetters && parsed[i + 1].toks.length) tok = parsed[i + 1].toks[0];
      if (tok) labelled.push({ prio: p.prio, value: tok.value });
    });
    let amount = null;
    if (labelled.length) {
      const bestPrio = Math.min.apply(null, labelled.map(l => l.prio));
      amount = Math.max.apply(null, labelled.filter(l => l.prio === bestPrio).map(l => l.value));
    } else {
      const pool = [];
      parsed.forEach(p => { if (!p.ignore && !RC_SKIP.test(p.up)) p.toks.forEach(t => pool.push(t)); });
      const plausible = t => (code === 'IDR' ? t.value >= 100 && t.value < 1e9 : t.value > 0 && t.value < 1e7);
      let cands = pool.filter(t => t.formatted && plausible(t));
      if (!cands.length) cands = pool.filter(t => !t.formatted && plausible(t) && t.raw.length <= 7);
      if (cands.length) amount = Math.max.apply(null, cands.map(t => t.value));
    }
    if (amount !== null) {
      amount = roundTo(amount, dec);
      if (!(amount > 0)) amount = null;
    }

    // title: first meaningful line near the top
    let title = '';
    const pick = (allowCompany) => {
      for (const p of parsed) {
        const up = p.up.replace(/^[^A-Z0-9]+/, '');
        const letters = (up.match(/[A-Z]/g) || []).length;
        const digits = (up.match(/\d/g) || []).length;
        if (letters < 3 || digits > letters) continue;
        if (p.prio || p.toks.length > 1) continue;
        const head = RC_HEADER.exec(up);
        if (head && up.slice(head[0].length).replace(/[^A-Z]/g, '').length < 3) continue;
        if (RC_SKIP.test(up) || /@|WWW\.|\.COM|HTTP/.test(up)) continue;
        if (!allowCompany && /^(PT|CV|UD|TBK)\b/.test(up)) continue;
        let t = p.line.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9)]+$/g, '').replace(/[^A-Za-z0-9 &'.\-]/g, ' ').replace(/\s+/g, ' ').trim();
        const th = RC_HEADER.exec(t.toUpperCase());
        if (th) t = t.slice(th[0].length).trim();
        if ((t.match(/[A-Za-z]/g) || []).length < 3) continue;
        if (mostlyUpper(t)) t = titleCase(t);
        if (t.length > 40) t = t.slice(0, 40).replace(/\s+\S*$/, '').trim() || t.slice(0, 40);
        return t;
      }
      return '';
    };
    title = pick(false) || pick(true) || (lang === 'en' ? 'Receipt' : 'Nota');
    return { title, amount, dayKey: dk, category: categorize(parsed.map(p => p.line).join('\n'), 'EXPENSE') };
  }
