  <style>
    :root {
      --bg-canvas: #050506;
      --bg-app: #09090B;
      --surface-1: #121215;
      --surface-2: #18181C;
      --surface-3: #232329;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted: #8A8A94;
      --positive: #34D399;
      --negative: #FB5D78;
      --rollover: #38BDF8;
      --warning: #FBBF24;
      --purple: #A78BFA;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
      --tabbar-h: 66px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --gutter: 22px;               /* side padding of the top bar and the views */
      --kb: 0px;                    /* keyboard height (set by the viewport guard while typing) */
      --vv-top: 0px;                /* visible area offset while the keyboard is up */
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* The document never scrolls (iOS scrolls it while the keyboard is up; the viewport guard undoes
       that). All scrolling happens in the views, sheets and onboarding inside the fixed shell. */
    html, body {
      height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
    }
    /* iOS Home Screen app laid out in a viewport shorter than the screen (the viewport guard in JS measures it and
       sets html.shell-fix, --app-h = screen height, --vp-gap = how much shorter): the document and the shell take
       the full screen height, so nothing ends early and leaves a band of page background under the tab bar. */
    html.shell-fix, html.shell-fix body { height: var(--app-h); }

    /* Phones: the page background is the app's own colour (= theme-color, = the tab bar). Where iOS leaves a strip
       of the screen to the page background (a Home Screen app laid out short, see shell-fix), that strip then
       continues the tab bar instead of showing a darker edge under its labels. The canvas only shows around the
       framed shell on wide screens (see the min-width: 520px block). */
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    [hidden] { display: none !important; }

    button { font: inherit; color: inherit; }
    input, textarea, select { font: inherit; }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--positive);
      outline-offset: 2px;
    }
    input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 0; }

    /* APP SHELL: full screen on phones, device-like frame on wider screens.
       Phones: pinned to the screen edges (position:fixed, no 100dvh). On iOS Home Screen apps 100dvh can be
       shorter than the screen and a scrolled document used to drag the shell up under the status bar;
       a fixed shell covers the whole screen whatever the document does. Safe areas are padding inside. */
    .app {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      touch-action: manipulation;
      background: var(--bg-app);
      background-image: radial-gradient(circle at 50% 6%, rgba(52, 211, 153, 0.045) 0%, transparent 45%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 520px) {
      body {
        background-color: var(--bg-canvas);
        background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 60%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .app {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        left: auto;
        width: 400px;
        height: min(880px, calc(100vh - 40px));
        height: min(880px, calc(100dvh - 40px));
        border-radius: 40px;
        border: 8px solid #141417;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.85);
        --safe-top: 0px;
        --safe-bottom: 0px;
        --safe-left: 0px;
        --safe-right: 0px;
      }
    }
    /* Shell fix (see html.shell-fix above): the shell is exactly the screen tall, and the bottom safe area is at least
       the missing part, so the tab bar, sheet buttons and toasts stay whole even where iOS does not draw it. */
    html.shell-fix .app {
      bottom: auto;
      height: var(--app-h);
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--vp-gap, 0px));
    }

    .app-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .storage-banner {
      flex-shrink: 0;
      margin: calc(8px + var(--safe-top)) 14px 0;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: var(--warning);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }
    /* only while the banner shows (it then clears the status bar); the banner element is always in the DOM */
    .storage-banner:not([hidden]) + .app-main .top-bar { padding-top: 10px; }

    /* MICRO-ANIMATIONS: Staggered Entrance & Tactile Press Physics */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .stagger-1 { animation: fadeSlideUp 0.38s var(--spring) both; }
    .stagger-2 { animation: fadeSlideUp 0.38s 0.05s var(--spring) both; }
    .stagger-3 { animation: fadeSlideUp 0.38s 0.10s var(--spring) both; }
    .stagger-4 { animation: fadeSlideUp 0.38s 0.15s var(--spring) both; }

    button, .wallet-card, .tx-row, .dock-card, .metric-pill {
      transition: transform 0.18s var(--spring), background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
    }

    button:active, .wallet-card:active, .dock-card:active, .metric-pill:active {
      transform: scale(0.95);
    }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    button:disabled:active { transform: none; }

    .tx-row {
      width: calc(100% + 12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 8px;
      margin: 0 -6px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      text-align: left;
      color: inherit;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-row:hover { background: rgba(255, 255, 255, 0.03); }
    .tx-row:active {
      transform: scale(0.985);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Success check overlay */
    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.76);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      z-index: 120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease, visibility 0s linear 0.22s;
      padding: 24px;
      text-align: center;
    }
    .success-overlay.show { opacity: 1; visibility: visible; transition: opacity 0.22s ease; }

    .success-ring {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.12);
      border: 2px solid var(--positive);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--positive);
      transform: scale(0.75);
      transition: transform 0.32s var(--spring);
    }
    .success-overlay.show .success-ring { transform: scale(1); }

    .success-ring svg {
      width: 36px;
      height: 36px;
      stroke-width: 2.5;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
    }
    .success-overlay.show .success-ring svg {
      animation: drawCheck 0.38s 0.08s forwards ease-out;
    }

    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    .success-amount {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .success-tag {
      font-size: 12px;

    /* ONBOARDING (first-run setup, no login) */

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;

      touch-action: pan-y pinch-zoom; /* no sideways drag, zoom stays available */
      overscroll-behavior: none;
      animation: fadeSlideUp 0.28s var(--spring);
    }

    /* Vertical-only scroller. The side padding (4px) holds the focus rings and the enlarged hit area
       of "Lewati" (::after, 4px wider); with 2px it stuck out and the whole setup could be dragged sideways. */
    .ob-top {
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: none;
      touch-action: pan-y pinch-zoom; /* no sideways drag, zoom stays available */

      margin: -2px -4px;
      min-height: 0;
      min-width: 0;
      flex: 1;
    }
    .ob-top::-webkit-scrollbar { display: none; }

      align-items: center;
      min-height: 40px;

    .ob-seg-btn {

    .ob-wallet-list {

    /* Clean Top Bar */
    .top-bar {
      padding: calc(10px + var(--safe-top)) calc(var(--gutter) + var(--safe-right)) 10px calc(var(--gutter) + var(--safe-left));

    /* Views Container */

      overflow-y: auto;

    .rollover-tag .info-dot {

    /* Wallet tiles: horizontal strip for any number of wallets */
    .wallet-section {

    }

    .wallet-strip {
      display: flex;
      gap: 8px;
