    let prev = null, contLeft = 0, lastDate = null;
    lines.forEach(L => {
      // "Tanggal Waktu" (one merged label) then "14 Okt 2026" and "15:10": the clock belongs to the same row
      if (lastDate && L.timeOnly && !L.label && !(pend.length && pend[0].label === 'date')) {
        L.of = 'date'; L.ofPhrase = lastDate.ofPhrase; L.value = L.text; L.cont = true; lastDate = null;
        return;
      }
      lastDate = null;
      // "Berita" then "Fee project motion": a value that merely starts like an amount row (right after a text label;
      // after an amount label it is the next label of a column: "Subtotal" then "Koin Shopee Digunakan")
      const lastPend = pend[pend.length - 1];
      if (L.label && AMOUNT_KINDS.has(L.label) && !L.money.length && lastPend && TEXT_VALUE_KINDS.has(lastPend.label) &&
          L.rawValue.replace(PAREN_WORDS_RE, ' ').trim() !== '') {
        L.label = null; L.phrase = null; L.labelOnly = false; L.value = '';
      }
      if (L.label && (L.value || L.money.length)) {
        pend.length = 0;
        L.of = L.label; L.ofPhrase = L.phrase;
        prev = CONT_KINDS.has(L.label) ? L : null; contLeft = 2;
        return;
      }
      if (L.label) { pend.push(L); prev = null; return; }
      if (L.headline || L.promo) { pend.length = 0; prev = null; return; }
      let took = null;
      while (pend.length) {
        const lab = pend.shift();
        if (L.i - lab.i > 12) continue;
        const wantsMoney = AMOUNT_KINDS.has(lab.label);
        if (wantsMoney ? L.money.length > 0 : !L.moneyOnly) { took = lab; break; }
      }
      if (took) {
        L.of = took.label; L.ofPhrase = took.phrase; L.value = L.text; L.paired = true;
        prev = CONT_KINDS.has(took.label) ? L : null; contLeft = 2;
        if (took.label === 'date' && L.hasDate && !payTimeIn(stripRanges(L.text, L.ds), true)) lastDate = L;
        return;
      }
      // "BUBUR AYAM CIREBON BANG" + "HASAN": a long name in capitals wrapped onto the next line
      if (prev && !prev.cont && WRAP_KINDS.has(prev.of) && prev.value.length >= 20 && !/\d/.test(prev.value) && mostlyUpper(prev.value) &&
          /^[A-Z][A-Z'&.\-]{1,14}$/.test(L.text) && !L.hasDate && !PAY_SYSTEM_RE.test(L.norm) && !payMentions(L.text, env, true).length) {
        prev.value += ' ' + L.text;
        L.of = prev.of; L.ofPhrase = prev.ofPhrase; L.value = ''; L.cont = true;
        prev = null;
        return;
      }
      const subLine = /\d{3,}|[•·*]{2,}|\+-|[*x]{3,}/i.test(L.text) || !cleanPayName(prev ? prev.value : 'x');
      if (prev && contLeft > 0 && subLine && !L.moneyOnly && !L.hasDate && wordRuns(L.text).length <= 8) {
        L.of = prev.of; L.ofPhrase = prev.ofPhrase; L.value = L.text; L.cont = true; contLeft--;
        return;
      }
      prev = null;
    });
    let firstBody = lines.findIndex(L => L.headline || L.money.length || L.label || L.hasDate);
    if (firstBody < 0) firstBody = lines.length;
    lines.forEach(L => {
      L.role = L.promo ? 'promo' : (L.of && hasOwn(KIND_ROLE, L.of)) ? KIND_ROLE[L.of] : L.i < firstBody ? 'head' : 'any';
      L.topup = PAY_TOPUP_RE.test(L.norm) && !L.promo;
    });
    return { lines, statusTime };
  }

  const PAY_ROLE_W = { src: 6, from: 5, to: 5, head: 4, product: 3, topup: 3, any: 2 };
  function payBrandScores(lines, env) {
    const scores = {}; // key -> { src, from, to, head, product, topup, any }
    lines.forEach(L => {
      if (L.role === 'promo') return;
      const labelled = L.role === 'src' || L.role === 'from' || L.role === 'to';
      const src = L.of ? L.value : L.text;
      const topAt = L.topup ? wordRuns(src).findIndex(r => r.w === 'top' || r.w === 'topup' || r.w === 'isi' || r.w === 'tambah' || r.w === 'add') : -1;
      payMentions(src, env, labelled).forEach(m => {
        const role = L.topup && topAt >= 0 && m.at > topAt ? 'topup' : L.role;
        const s = scores[m.key] || (scores[m.key] = { src: 0, from: 0, to: 0, head: 0, product: 0, topup: 0, any: 0 });
        s[role] += PAY_ROLE_W[role];
      });
    });
    return scores;
  }
  function payBest(scores, plus, minus) {
    let best = null, bestScore = 0;
    Object.keys(scores).forEach(k => {
      const s = scores[k];
      const pos = plus.reduce((a, r) => a + s[r], 0);
      if (!pos) return;
      const v = pos - minus.reduce((a, r) => a + s[r], 0) * 0.5 + (k.slice(0, 2) === 'b:' ? 0.1 : 0);
      if (v > bestScore) { best = k; bestScore = v; }
    });
    return best;
  }

  // Merchant / person names: drop masked or account numbers, bank tags and status words; Title Case shouting.
  function cleanPayName(s, keepBrandOnly) {
    let t = ' ' + String(s || '').replace(/[_~«»"“”`©®™<>\[\]{}]/g, ' ').replace(/\s*[•·|]\s*|\s[-–+]\s/g, ' - ') + ' ';
    const an = /\b(?:a\s*\.?\s*n\s*\.|a\/n|atas nama)\s*(.+)$/i.exec(t);
    if (an) t = ' ' + an[1] + ' ';
    t = t.replace(/^\s*(?:ke|to|kepada|dari|from|paid to|bayar ke|dibayar ke|pembayaran ke)\s+/i, ' ');
    t = t.replace(/\s(?:berhasil|sukses|successful|succeeded|telah|sudah)\b.*$/i, ' ');
    let words = t.split(/\s+/).filter(Boolean).filter(w => {
      const d = (w.match(/\d/g) || []).length;
      if (d >= 4 || /^[*•·x+\-.]{2,}\d*$/i.test(w) || /^[*•·+]+/.test(w)) return false;
      if (/^\d+$/.test(w) && d >= 3) return false;
      if (/^(rp|idr|usd|sgd)\.?$/i.test(w)) return false;
      return /[A-Za-z0-9&]/.test(w) || w === '-';
    });
    // "BCA - BUDI", "BUDI • BCA": bank tags around a name
    const isBrand = w => hasOwn(PAY_KEY, normalizeText(w).replace(/ /g, ''));
    let out = words.join(' ').replace(/(^|\s)[-+:.,]+(?=\s|$)/g, ' - ').replace(/\s+/g, ' ').replace(/( - )+/g, ' - ').trim();
    let parts = out.split(' - ').map(p => p.trim()).filter(Boolean);
    if (parts.length > 1) {
      const named = parts.filter(p => !p.split(' ').every(w => isBrand(w) || /^(bank|rek|rekening)$/i.test(w)));
      if (named.length) parts = named;
    }
    out = parts.join(' - ').replace(/^[\s\-:,.;]+|[\s\-:,.;]+$/g, '').trim();
    const letters = (out.match(/[A-Za-z]/g) || []).length;
    if (letters < 2) return '';
    if (!keepBrandOnly && out.split(' ').every(w => isBrand(w) || /^(bank|saldo|rekening|rek|tabungan|cash|wallet)$/i.test(w))) return '';
    if (mostlyUpper(out)) out = titleCase(out);
    if (out.length > 40) out = out.slice(0, 40).replace(/\s+\S*$/, '').replace(/[\s\-:,.;]+$/, '').trim() || out.slice(0, 40);
    return out;
  }

  // The user's own name on a recipient row ("KHUSNA FAIQ", "a.n. Khusna Faiq"): every word of a two-word name, or a
  // one-word name standing alone (bank tags and account numbers aside).
  const OWN_SKIP_WORDS = new Set(['customer', 'pelanggan', 'bank', 'rek', 'rekening', 'an', 'a', 'n', 'atas', 'nama', 'sdr', 'sdri', 'bpk', 'ibu']);
  function ownNameIn(value, ownTokens) {
    if (!ownTokens.length) return false;
    const toks = normalizeText(value).split(' ').filter(Boolean);
    if (ownTokens.length >= 2) return ownTokens.every(t => toks.indexOf(t) >= 0);
    const rest = toks.filter(t => !/\d/.test(t) && !hasOwn(PAY_KEY, t) && !OWN_SKIP_WORDS.has(t));
    return rest.length === 1 && rest[0] === ownTokens[0];
  }
  const EWALLET_VA_RE = /^(gopay|go pay|ovo|dana|shopeepay|shopee pay|linkaja|link aja)\s*(customer|topup|top up)\b/;
  // Recipient rows naming the user, or an e-wallet's top-up account: { key, wallet } of the destination when the
  // rows name a brand or wallet other than the source (wallet: tracked wallet id or null), else null.
  function payOwnDestination(live, env, ownName, srcWallet, srcKey) {
    const ownTokens = normalizeText(ownName || '').split(' ').filter(t => t.length >= 2 && !/\d/.test(t));
    const rowKinds = new Set(['payee', 'name', 'toAcct']);
    const own = live.filter(L => rowKinds.has(L.of) && L.value && (ownNameIn(L.value, ownTokens) || EWALLET_VA_RE.test(normalizeText(L.value))));
    if (!own.length) return null;
    // the destination: brands on those rows, on rows wrapped under them, and on the destination-account rows
    const rows = live.filter(L => own.indexOf(L) >= 0 || L.of === 'toAcct' || (L.cont && rowKinds.has(L.of)));
    let best = null;
    rows.forEach(L => payMentions(L.value, env, true).forEach(m => {
      if (m.key === srcKey) return;
      const w = payKeyWallet(m.key, env);
      if (w && w === srcWallet) return;
      if (!best || (w && !best.wallet)) best = { key: m.key, wallet: w || null };
    }));
    return best;
  }

  function extractPayment(text, ctx) {
    ctx = ctx || {};
    const env = makePayEnv(ctx);
    const { lines, statusTime } = payReadLines(text, env);
    const en = env.lang === 'en';
    const scores = payBrandScores(lines, env);
    const live = lines.filter(L => !L.promo);
    const anyRe = re => live.some(L => re.test(L.norm));
    const qris = anyRe(/\bqris\b/);

    // ---- amounts
    const lastVal = toks => { const nz = nonZero(toks); return nz.length ? nz[nz.length - 1].value : null; };
    const byKind = k => live.filter(L => L.of === k && L.money.length && !L.cont);
    // "Jumlah Poin 48", a "Saldo" value under a "Total" label: not the payment
    const amountLines = k => byKind(k).filter(L => !PAY_SKIP_LINE_RE.test(normalizeText(L.value)));
    const maxOf = arr => Math.max.apply(null, arr);
    const totalLines = amountLines('total').filter(L => lastVal(L.money) > 0);
    // a total that names what was paid beats "Total" / "Total Belanja"; the biggest of the best kind wins
    const paidTotals = totalLines.filter(L => PAID_TOTALS.has(L.ofPhrase));
    const bestTotals = paidTotals.length ? paidTotals : totalLines;
    const totals = bestTotals.map(L => lastVal(L.money));
    const totalLine = bestTotals.length ? bestTotals[totals.indexOf(maxOf(totals))] : null;
    const nominals = amountLines('nominal').map(L => lastVal(L.money)).filter(v => v > 0);
    const subs = amountLines('sub').map(L => lastVal(L.money)).filter(v => v > 0);
    const sumRows = k => {
      const seen = new Set();
      let sum = 0;
      amountLines(k).forEach(L => {
        const v = lastVal(L.money);
        const key = L.ofPhrase + '|' + v;
        if (v > 0 && !seen.has(key)) { seen.add(key); sum += v; }
      });
      return sum;
    };
    const fee = sumRows('fee');
    const tip = sumRows('tip');
    // discounts taken off the price (only used when there is no total row to read)
    let disc = 0, discSummary = 0;
    const discSeen = new Set();
    byKind('skip').forEach(L => {
      const nz = nonZero(L.money);
      const tok = nz[nz.length - 1];
      if (!tok) return;
      const minus = tok.sign === '-' || tok.paren;
      if (DISCOUNT_SUMMARY.has(L.ofPhrase)) { discSummary = Math.max(discSummary, tok.value); return; }
      if (!(DISCOUNT_PHRASES.has(L.ofPhrase) || (minus && DEDUCT_IF_MINUS.has(L.ofPhrase)))) return;
      const key = L.ofPhrase + '|' + tok.value;
      if (!discSeen.has(key)) { discSeen.add(key); disc += tok.value; }
    });
    if (!disc) disc = discSummary;
    // the big amount: right under the status line (or just above it); a balance card higher up is not the payment
    const heroes = live.filter(L => !L.of && !L.reward && L.money.length && nonZero(L.money).length &&
      (L.moneyOnly || (L.headline && nonZero(L.money).length === 1)) && (L.headline || !PAY_SKIP_LINE_RE.test(L.norm)));
    const heads = live.filter(L => L.headline && !L.reward).map(L => L.i);
    const nearHead = (L, lo, hi) => heads.some(h => L.i - h >= lo && L.i - h <= hi);
    const heroLine = heroes.find(L => L.headline || nearHead(L, 1, 3)) || heroes.find(L => nearHead(L, -2, -1)) || heroes[0] || null;
    const heroTok = heroLine ? nonZero(heroLine.money)[0] : null;
    const hero = heroTok ? heroTok.value : null;
    let amount = null, amountFrom = null;
    if (totals.length) { amount = maxOf(totals); amountFrom = 'total'; }
    else if (nominals.length) {
      // price + fees + tip - discounts ("Harga Rp25.000", "Promo -Rp5.000")
      const gross = maxOf(nominals) + fee + tip;
      amount = disc > 0 && gross - disc > 0 ? gross - disc : gross;
      amountFrom = 'nominal';
    }
    else if (hero !== null) { amount = hero; amountFrom = 'hero'; }
    else if (subs.length) { amount = maxOf(subs); amountFrom = 'sub'; }
    else {
      const loose = [];
      live.forEach(L => { if (L.of !== 'skip' && L.of !== 'fee' && L.of !== 'tip' && !PAY_SKIP_LINE_RE.test(L.norm)) nonZero(L.money).forEach(t => { if (t.rp) loose.push(t.value); }); });
      if (loose.length) { amount = loose[0]; amountFrom = 'loose'; }
    }
    const topupTotal = amountFrom === 'total' && TOPUP_TOTALS.has(totalLine.ofPhrase) && !(hero !== null && roundTo(hero, env.dec) === roundTo(amount - fee, env.dec));
    if (amount !== null) {
      amount = roundTo(amount, env.dec);
      if (!(amount > 0) || amount > MAX_AMOUNT) { amount = null; amountFrom = null; }
    }
    const agrees = amount !== null && ((hero !== null && amountFrom !== 'hero' && roundTo(hero, env.dec) === amount) ||
      (amountFrom === 'total' && nominals.some(n => roundTo(n + fee + tip, env.dec) === amount || roundTo(n + fee + tip - disc, env.dec) === amount)));

    // ---- type
    const sign = heroTok ? heroTok.sign : null;
    const withdraw = anyRe(PAY_WITHDRAW_RE);
    const topupLines = live.filter(L => L.topup && !PAY_TOPUP_NOT_TRANSFER.test(L.norm));
    const outHead = live.some(L => PAY_OUT_HEAD_RE.test(L.norm));
    const incomeHit = sign === '+' || live.some(L => L.income && !(outHead && PAY_REWARD_RE.test(L.norm)) && !(outHead && sign === '-'));
    let type = 'EXPENSE';
    let srcKey = payBest(scores, ['src', 'from', 'head', 'any'], ['to', 'topup', 'product']);
    let dstKey = null;
    if (withdraw) {
      type = 'TRANSFER';
    } else if (topupLines.length && sign !== '+') {
      dstKey = payBest(scores, ['topup', 'to', 'product'], ['src', 'from']);
      if (!dstKey) {
        const app = payBest(scores, ['head', 'any'], []);
        if (app && app !== srcKey && PAY_BRANDS[payKeyBrand(app)] && PAY_BRANDS[payKeyBrand(app)].ewallet) dstKey = app;
      }
      if (dstKey && dstKey === srcKey) srcKey = payBest(scores, ['src', 'from'], []);
      if (dstKey && srcKey === dstKey) srcKey = null;
      if (dstKey) type = 'TRANSFER';
    }
    if (type === 'EXPENSE' && incomeHit && sign !== '-') type = 'INCOME';
    if (type === 'INCOME') srcKey = payBest(scores, ['to', 'head', 'any'], ['from', 'src']);
    if (type === 'TRANSFER' && !dstKey && withdraw) dstKey = env.cashId ? 'w:' + env.cashId : null;
    // Money sent to the user's own account ("ke KHUSNA FAIQ · OCBC", "Penerima KHUSNA FAIQ / Bank Tujuan GoPay",
    // a "GOPAY CUSTOMER" virtual account) lands in another of their wallets: a transfer when that wallet is tracked.
    let ownTo = false;
    if (type === 'EXPENSE' && !withdraw && sign !== '+') {
      const own = payOwnDestination(live, env, ctx.name, payKeyWallet(srcKey, env), srcKey);
      if (own) {
        ownTo = true;
        if (own.wallet) { type = 'TRANSFER'; dstKey = own.key; }
        else dstKey = own.key;
      }
    }
    // a transfer moves the nominal; the admin fee stays in fields.fee (the UI can log it as its own expense)
    if (type === 'TRANSFER' && fee > 0 && amount !== null) {
      // "Total top up Rp100.000" + "Biaya admin Rp1.000": the total is what arrived, the fee came on top
      const base = nominals.length ? maxOf(nominals) : topupTotal ? amount : amountFrom === 'total' || amountFrom === 'nominal' ? amount - fee : amount;
      if (base > 0) amount = roundTo(base, env.dec);
    } else if (type === 'EXPENSE' && topupTotal && fee > 0 && amount !== null) {
      // a top-up paid here (pulsa, an e-wallet that is not tracked): what left the account is the top-up plus its fee
      amount = roundTo(amount + fee, env.dec);
    }

    // ---- counterparty / title
    const cands = [];
    const addCand = (val, prio, keepBrand) => { const c = cleanPayName(val, keepBrand); if (c) cands.push({ c, prio }); };
    live.forEach(L => {
      if (!L.of) return;
      const v = L.value;
      if (type === 'INCOME') {
        if (L.of === 'from') addCand(v, L.cont ? 3 : 1);
        else if (L.of === 'name') addCand(v, 7.5);
      } else {
        if (L.of === 'merchant') addCand(v, L.cont ? 6 : 1);
        else if (L.of === 'payee') addCand(v, L.cont ? 4 : GENERIC_PAYEE.has(L.ofPhrase) ? 3 : 2);
        else if (L.of === 'name') addCand(v, 7.5);
        else if (L.of === 'product') addCand(v, 8, true);
      }
    });
    // "Pembayaran ke KOPI KENANGAN berhasil", "Kamu dapat Rp50.000 dari Budi"
    live.forEach(L => {
      if (L.of || !(L.headline || L === heroLine)) return;
      const m = (type === 'INCOME' ? /\b(?:dari|from)\s+(.{3,})$/i : /\b(?:ke|to|kepada|di|at)\s+(.{3,})$/i).exec(L.text);
      // a sentence ("... dari RIZKY ke rekening 0123", "... di WARUNG X berhasil"): keep the name only
      if (m) addCand(m[1].replace(/\b(rp|idr)\s?[\d.,]+/gi, ' ').replace(/\s(?:ke|to|via|pakai|dengan|melalui|menggunakan|using|dari|from|sebesar|senilai|pada|on|di)\s.*$/i, ''), 3.5);
    });
    // a caption next to the big amount: "INDOMARET MARGONDA", "Pulsa Telkomsel 50.000"
    if (heroLine) {
      [heroLine.i - 1, heroLine.i + 1].forEach(j => {
        const L = lines[j];
        if (!L || L.of || L.label || L.headline || L.promo || L.hasDate || L.moneyOnly || PAY_SYSTEM_RE.test(L.norm)) return;
        if (payMentions(L.text, env, false).length && wordRuns(L.text).length <= 3) return;
        addCand(L.text.replace(/\b(rp|idr)\s?[\d.,]+/gi, ' '), 7);
      });
    }
    cands.sort((a, b) => a.prio - b.prio);
    const counterparty = cands.length ? cands[0].c : null;

    const dstBrand = payKeyBrand(dstKey);
    const dstName = dstBrand ? PAY_BRANDS[dstBrand].name : (env.wallets.find(w => w.id === payKeyWallet(dstKey, env)) || {}).name || '';
    // own accounts: "Top up GoPay" into an e-wallet, "Transfer ke OCBC" into a bank account
    const ownTitle = () => (dstBrand && PAY_BRANDS[dstBrand].ewallet ? 'Top up ' : en ? 'Transfer to ' : 'Transfer ke ') + dstName;
    let title;
    if (type === 'TRANSFER') {
      if (withdraw) title = en ? 'Cash withdrawal' : 'Tarik tunai';
      else if (ownTo && !topupLines.length) title = ownTitle();
      else title = 'Top up ' + dstName;
      title = title.trim();
    } else if (ownTo && dstName) title = ownTitle().trim();
    else if (counterparty) title = counterparty;
    else if (type === 'INCOME') title = en ? 'Money received' : 'Uang masuk';
    else if (qris) title = en ? 'QRIS payment' : 'Pembayaran QRIS';
    else if (anyRe(/\b(transfer|kirim uang|sent)\b/)) title = 'Transfer';
    else title = en ? 'Payment' : 'Pembayaran';

    // ---- date & time
    let dk = null, time = null, dateLine = null, timeFromStatusBar = false;
    const maxDay = env.today ? addDays(env.today, 1) : null;
    // only date rows and free lines: never a note ("arisan 10/10"), a name or an id
    const dateOrder = live.filter(L => L.hasDate && !PAY_SKIP_DATE_RE.test(L.norm) && (!L.of || L.of === 'date'))
      .sort((a, b) => (a.of === 'date' ? 0 : 1) - (b.of === 'date' ? 0 : 1) || a.i - b.i);
    for (const L of dateOrder) {
      const k = L.ds.map(d => d.key).find(key => key && (!maxDay || key <= maxDay));
      if (!k) continue;
      dk = k; dateLine = L;
      const src = L.of ? L.value : L.text;
      time = payTimeIn(stripRanges(src, L.ds), !/\b(rp|idr)\b/i.test(src));
      break;
    }
    if (!time) {
      const near = dateLine ? lines[dateLine.i + 1] : null;
      if (near && !near.hasDate && (near.of === 'date' || /^\W*([01]?\d|2[0-3])[:.][0-5]\d/.test(near.text))) time = payTimeIn(near.of ? near.value : near.text, true);
    }
    if (!time) {
      const tl = live.find(L => L.of === 'date' && payTimeIn(L.value, true)) || live.find(L => /\b(wib|wita|wit)\b/.test(L.norm) && payTimeIn(L.text, true));
      if (tl) time = payTimeIn(tl.of === 'date' ? tl.value : tl.text, true);
    }
    // "Kemarin, 21:39", "Hari ini 07:39", "Yesterday 9:15 PM"
    if (!dk && env.today) {
      const rel = live.find(L => (!L.of || L.of === 'date') && !L.promo && REL_DAY_RE.test(L.of ? normalizeText(L.value) : L.norm));
      if (rel) {
        const src = rel.of ? rel.value : rel.text;
        const w = REL_DAY_RE.exec(normalizeText(src))[1];
        dk = addDays(env.today, w === 'kemarin lusa' ? -2 : (w === 'kemarin' || w === 'kemaren' || w === 'yesterday') ? -1 : 0);
        const tm = payTimeIn(src.replace(/^[^\d]*?(hari ini|today|kemarin lusa|kemarin|kemaren|yesterday)/i, ' '), true);
        if (tm) time = tm;
        dateLine = rel;
      }
    }
    if (!time && statusTime && (!dk || dk === env.today)) { time = statusTime; timeFromStatusBar = true; }

    // ---- extras
    let ref = null;
    const refLine = live.find(L => L.of === 'ref' && /\d/.test(L.value));
    if (refLine) {
      const v = refLine.value.replace(/^[^A-Za-z0-9]+/, '');
      const compact = /^[\dA-Z\s\-]+$/i.test(v) && /\d{3,}\s\d{3,}/.test(v) ? v.replace(/\s+/g, '') : v.split(/\s+/)[0];
      ref = compact.replace(/[^A-Za-z0-9\-/]/g, '').slice(0, 40) || null;
    }
    let method = null;
    if (qris) method = 'QRIS';
    else if (anyRe(/\bbi ?fast\b/)) method = 'BI-FAST';
    else if (anyRe(/\bvirtual account\b/)) method = 'Virtual Account';
    else if (withdraw) method = en ? 'Cash withdrawal' : 'Tarik Tunai';
    else if (type === 'TRANSFER') method = ownTo && !topupLines.length && !(dstBrand && PAY_BRANDS[dstBrand].ewallet) ? 'Transfer' : 'Top Up';
    else if (type !== 'INCOME') {
      // on an incoming screen the "Sumber" row is the sender's bank, not how this account paid
      const ml = live.find(L => L.of === 'src' && !L.cont && L.value);
      if (ml) method = ml.value.replace(/[^A-Za-z0-9 .'’\-]/g, ' ').split(' ').filter(w => (w.match(/\d/g) || []).length < 4 && !/^\d+$/.test(w)).join(' ')
        .replace(/\s+/g, ' ').replace(/^[\s\-.]+|[\s\-.]+$/g, '').slice(0, 30) || null;
    }
    const notes = live.filter(L => L.of === 'note' && L.value).map(L => L.value);
    const products = live.filter(L => L.of === 'product' && L.value).map(L => L.value);

    // ---- category: counterparty and product first; other free text only when that says nothing
    let category;
    if (type === 'TRANSFER') category = 'transfer';
    else {
      const primary = [counterparty || ''].concat(products, notes).join(' \n ');
      category = categorize(primary, type);
      if (category === 'other' || category === 'other_income') {
        const extra = live.filter(L => !L.of && !L.label && !L.moneyOnly && !L.hasDate).map(L => L.text);
        category = categorize(primary + ' \n ' + extra.join(' \n '), type);
      }
    }

    const walletHint = payKeyWallet(srcKey, env);
    const toWalletHint = type === 'TRANSFER' ? payKeyWallet(dstKey, env) : null;
    const appBrand = payKeyBrand(srcKey);
    const statusFound = live.some(L => L.headline);
    let conf = 0;
    conf += amountFrom === 'total' ? 0.3 : amountFrom === 'nominal' ? 0.28 : amountFrom === 'hero' ? 0.25 : amountFrom ? 0.1 : 0;
    if (agrees) conf += 0.1;
    if (statusFound) conf += 0.2;
    if (counterparty || type === 'TRANSFER') conf += cands.length && cands[0].prio <= 4 ? 0.15 : 0.08;
    if (dk) conf += 0.1;
    if (time) conf += 0.03;
    if (walletHint) conf += 0.05;
    if (ref || qris) conf += 0.05;
    if (amount === null) conf = Math.min(conf, 0.3);
    conf = Math.round(Math.min(1, conf) * 100) / 100;
    const looksPayment = statusFound || qris || !!ref || live.some(L => L.of === 'src' || L.of === 'merchant' || L.of === 'payee' || L.of === 'from');
    return {
      kind: looksPayment && (amount !== null || statusFound) ? 'payment' : 'unknown',
      type, title, amount, dayKey: dk, time, category, walletHint, toWalletHint, confidence: conf,
      fields: {
        merchant: type === 'TRANSFER' || ownTo ? null : counterparty, ref, method, fee: fee > 0 ? roundTo(fee, env.dec) : null, tip: tip > 0 ? roundTo(tip, env.dec) : null,
        note: notes.length ? notes[0].slice(0, 80) : null,
        app: appBrand, appName: appBrand ? PAY_BRANDS[appBrand].name : null,
        toApp: payKeyBrand(dstKey), timeFromStatusBar,
        // where the amount came from ('total' | 'nominal' (price + fees - discounts) | 'hero' | 'sub' | 'loose' | null) and the
        // big amount on the screen (null when none): the UI asks for a check when they disagree
        amountFrom, heroAmount: hero !== null && hero > 0 ? roundTo(hero, env.dec) : null
      }
    };
  }

  // Paper receipt vs payment-confirmation screen. Positive = screen.
  function paymentSignals(text) {
    const lines = String(text == null ? '' : text).replace(/\r/g, '').split('\n').map(l => normalizeText(l)).filter(Boolean);
    let pay = 0, rc = 0, itemLines = 0;
    const all = ' ' + lines.join(' | ') + ' ';
    if (lines.some(l => PAY_SUCCESS_RE.test(l) || (PAY_INCOME_RE.test(l) && !PAY_NOT_INCOME_RE.test(l)))) pay += 3;
    if (/\bqris\b/.test(all)) pay += 1;
    [/\b(id transaksi|transaction id|no ref|no referensi|nomor referensi|reference|rrn|no transaksi)\b/, /\b(sumber dana|metode pembayaran|payment method|source of funds|rekening sumber)\b/,
      /\b(penerima|recipient|rekening tujuan|bank tujuan|nama merchant|paid to|pengirim)\b/, /\b(nmid|merchant pan|bi fast|virtual account)\b/,
      /\b(bagikan|share|detail transaksi|rincian transaksi|transaction details|detail pembayaran|rincian pembayaran|kembali ke beranda|bukti transfer)\b/]
      .forEach(re => { if (re.test(all)) pay += 1; });
    const words = all.split(/[^a-z0-9]+/);
    if (words.some((w, i) => (w.length >= 3 && w !== 'dana' && hasOwn(PAY_KEY, w)) || (words[i + 1] && hasOwn(PAY_KEY, w + words[i + 1])))) pay += 1;
    lines.forEach(l => {
      if (/\b(kembali|kembalian|change|tunai|cash)\b/.test(l) && /\d/.test(l) && !/\b(tarik tunai|kembali ke)\b/.test(l)) rc += 1;
      if (/\b(kasir|cashier|npwp|ppn|pb1|pbjt|struk|nota|terima kasih|thank you|qty|jl|jln|jalan|telp|tlp|item|items)\b/.test(l)) rc += 1;
      if (/[a-z]{3,}.*\s\d{1,3}(?:[.,]\d{3})+$/.test(l) && !/\b(total|nominal|biaya|saldo|jumlah|harga|bayar|subtotal|rp)\b/.test(l)) itemLines++;
      if (/\b\d+\s?[x@]\s?\d/.test(l)) rc += 1;
    });
    if (itemLines >= 3) rc += 2;
    return { pay, receipt: rc };
  }

  // Router for text read from a picture: success screens go to extractPayment, paper receipts to extractReceipt.
  function extractFromImageText(text, ctx) {
    ctx = ctx || {};
    const sig = paymentSignals(text);
    const pay = extractPayment(text, ctx);
    if ((sig.pay >= 3 && sig.pay > sig.receipt) || (pay.kind === 'payment' && sig.pay >= 2 && sig.receipt <= 1)) {
      pay.kind = 'payment';
      return pay;
    }
    const env = makePayEnv(ctx);
    const r = extractReceipt(text, ctx);
    if (r.amount === null && pay.amount !== null && sig.pay >= 2) { pay.kind = 'payment'; return pay; }
    if (r.amount === null && !String(text == null ? '' : text).trim()) {
      return { kind: 'unknown', type: 'EXPENSE', title: '', amount: null, dayKey: null, time: null, category: 'other', walletHint: null, toWalletHint: null, confidence: 0,
        fields: { merchant: null, ref: null, method: null, fee: null, tip: null, note: null, app: null, appName: null, toApp: null, timeFromStatusBar: false, amountFrom: null, heroAmount: null } };
    }
    // paid how? "DEBIT BCA 50.000", "GOPAY 25.000", "QRIS", "TUNAI 100.000"
    let hint = null, method = null;
    String(text).split('\n').forEach(line => {
      const up = line.toUpperCase();
      if (!/(DEBIT|DEBET|KREDIT|CREDIT|KARTU|CARD|EDC|QRIS|OVO|GOPAY|DANA|SHOPEEPAY|LINKAJA|NON TUNAI|E-?WALLET|TUNAI|CASH)/.test(up)) return;
      if (!method && /QRIS/.test(up)) method = 'QRIS';
      if (!hint) {
        const m = payMentions(line, env, false).find(x => payKeyWallet(x.key, env));
        if (m) hint = payKeyWallet(m.key, env);
      }
      if (!method && /(^|[^A-Z])(DEBIT|DEBET)([^A-Z]|$)/.test(up)) method = 'Debit';
      if (!method && /(^|[^A-Z])(KREDIT|CREDIT)([^A-Z]|$)/.test(up)) method = 'Credit';
    });
    if (!hint && /(^|\n)\s*(TUNAI|CASH)\b[^\n]*\d/i.test(String(text))) { hint = env.cashId; if (!method) method = env.lang === 'en' ? 'Cash' : 'Tunai'; }
    let rtime = null;
    String(text).split('\n').some(line => {
      const b = blankTimes(line);
      rtime = payTimeIn(stripRanges(line, findDates(b, env.today)), false);
      return !!rtime;
    });
    const fallbackTitle = r.title === 'Nota' || r.title === 'Receipt';
    let conf = r.amount !== null ? 0.45 : 0.1;
    if (r.dayKey) conf += 0.1;
    if (!fallbackTitle) conf += 0.1;
    if (sig.receipt >= 2) conf += 0.1;
    return {
      kind: r.amount === null && sig.receipt < 2 ? 'unknown' : 'receipt',
      type: 'EXPENSE', title: r.title, amount: r.amount, dayKey: r.dayKey, time: rtime, category: r.category,
      walletHint: hint, toWalletHint: null, confidence: Math.round(Math.min(conf, 0.85) * 100) / 100,
      fields: { merchant: fallbackTitle ? null : r.title, ref: null, method, fee: null, tip: null, note: null, app: null, appName: null, toApp: null, timeFromStatusBar: false,
        amountFrom: r.amount !== null ? 'receipt' : null, heroAmount: null }
    };
  }

  // ---------- state ----------
  function defaultState() {
    return {
      version: 1,
      settings: {
        name: '', lang: 'id', currency: 'IDR', monthlyBudget: 0, periodStartDay: 1,
        sound: true, onboarded: false, defaultWalletId: null, noSpendDays: [],
        budgetSince: null
      },
      wallets: [],
      goals: [],
      transactions: []
    };
  }

  const str = (v, max) => (typeof v === 'string' ? v : typeof v === 'number' && isFinite(v) ? String(v) : '').replace(/\s+/g, ' ').trim().slice(0, max);
  const longStr = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const toNum = v => {
    if (typeof v === 'number') return v;
    if (typeof v === 'string' && v.trim() !== '' && /^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(v.trim())) return Number(v.trim());
    return NaN;
  };
  const isHexColor = v => typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v);
  const LEGACY_SOURCE = { SUARA: 'VOICE', NOTA: 'RECEIPT', MUTASI: 'STATEMENT' };

  function sanitizeState(raw) {
    try {
      if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch (e) { raw = null; } }
      const out = defaultState();
      if (!isObj(raw)) return out;
      const s = isObj(raw.settings) ? raw.settings : {};
      const st = out.settings;
      st.name = str(s.name, 40);
      st.lang = s.lang === 'en' ? 'en' : 'id';
      st.currency = typeof s.currency === 'string' && hasOwn(CURRENCIES, s.currency) ? s.currency : 'IDR';
      // Stored values keep cents whatever the display currency is; rounding happens only when shown.
      const dec = STORE_DEC;
      const clampAmt = v => Math.max(-MAX_AMOUNT, Math.min(MAX_AMOUNT, v));
      const budget = toNum(s.monthlyBudget);
      st.monthlyBudget = isFinite(budget) && budget > 0 ? clampAmt(roundTo(budget, dec) || budget) : 0;
      const sd = Math.trunc(toNum(s.periodStartDay));
      st.periodStartDay = isFinite(sd) ? Math.min(28, Math.max(1, sd)) : 1;
      st.sound = typeof s.sound === 'boolean' ? s.sound : true;

      const ids = new Set();
      const freshId = id => {
        let v = typeof id === 'string' && id.trim() ? id.trim().slice(0, 64) : (isFiniteNum(id) ? String(id) : '');
        if (!v || ids.has(v)) v = uid();
        ids.add(v);
        return v;
      };
      const walletIds = new Set();
      (Array.isArray(raw.wallets) ? raw.wallets : []).forEach((w, i) => {
        if (!isObj(w)) return;
        if (!(typeof w.id === 'string' && w.id.trim()) && !isFiniteNum(w.id)) return;
        const id = freshId(w.id);
        const ib = toNum(w.initialBalance !== undefined ? w.initialBalance : w.balance);
        out.wallets.push({
          id,
          name: str(w.name, 40) || 'Wallet',
          color: isHexColor(w.color) ? w.color : WALLET_COLORS[out.wallets.length % WALLET_COLORS.length],
          initialBalance: isFinite(ib) ? clampAmt(roundTo(ib, dec)) : 0,
          archived: w.archived === true,
          createdAt: normDateTime(w.createdAt) || ''
        });
        walletIds.add(id);
      });
      const goalIds = new Set();
      (Array.isArray(raw.goals) ? raw.goals : []).forEach(g => {
        if (!isObj(g)) return;
        if (!(typeof g.id === 'string' && g.id.trim()) && !isFiniteNum(g.id)) return;
        const id = freshId(g.id);
        const target = toNum(g.target);
        out.goals.push({
          id,
          name: str(g.name, 40) || 'Target',
          target: isFinite(target) && target > 0 ? clampAmt(roundTo(target, dec) || target) : 0,
          deadline: isDayKey(g.deadline) ? g.deadline : null,
          createdAt: normDateTime(g.createdAt) || '',
          // a deleted goal that had deposits/withdrawals stays (hidden) so wallet balances keep their history
          deleted: g.deleted === true
        });
        goalIds.add(id);
      });
      (Array.isArray(raw.transactions) ? raw.transactions : []).forEach(t => {
        if (!isObj(t)) return;
        const type = typeof t.type === 'string' ? t.type.toUpperCase() : '';
        if (TX_TYPES.indexOf(type) < 0) return;
        const rawAmount = toNum(t.amount);
        if (!isFinite(rawAmount) || !(rawAmount > 0) || rawAmount > MAX_AMOUNT) return;
        // never drop a real (positive) amount just because rounding made it 0
        const amount = roundTo(rawAmount, dec) || rawAmount;
        const walletId = typeof t.walletId === 'string' ? t.walletId : isFiniteNum(t.walletId) ? String(t.walletId) : '';
        if (!walletIds.has(walletId)) return;
        let toWalletId = null, goalId = null;
        if (type === 'TRANSFER') {
          toWalletId = typeof t.toWalletId === 'string' ? t.toWalletId : isFiniteNum(t.toWalletId) ? String(t.toWalletId) : '';
          if (!walletIds.has(toWalletId) || toWalletId === walletId) return;
        }
        if (type === 'GOAL_IN' || type === 'GOAL_OUT') {
          goalId = typeof t.goalId === 'string' ? t.goalId : isFiniteNum(t.goalId) ? String(t.goalId) : '';
          if (!goalIds.has(goalId)) return;
        }
        const date = normDateTime(t.date) || normDateTime(t.createdAt);
        if (!date) return;
        let category;
        if (type === 'TRANSFER') category = 'transfer';
        else if (type === 'GOAL_IN' || type === 'GOAL_OUT') category = 'goal';
        else if (type === 'EXPENSE') category = isExpenseCat(t.category) ? t.category : 'other';
        else category = isIncomeCat(t.category) ? t.category : 'other_income';
        const srcU = typeof t.source === 'string' ? t.source.toUpperCase() : '';
        const source = SOURCES.indexOf(srcU) >= 0 ? srcU : LEGACY_SOURCE[srcU] || 'MANUAL';
        out.transactions.push({
          id: freshId(t.id), type, amount, walletId, toWalletId, goalId, category,
          title: str(t.title, 80), note: longStr(t.note, 500), date, source,
          createdAt: normDateTime(t.createdAt) || date
        });
      });

      const dw = typeof s.defaultWalletId === 'string' ? s.defaultWalletId : null;
      st.defaultWalletId = dw && out.wallets.some(w => w.id === dw && !w.archived) ? dw : null;
      const nsd = Array.isArray(s.noSpendDays) ? s.noSpendDays.filter(isDayKey) : [];
      st.noSpendDays = Array.from(new Set(nsd)).sort();
      st.budgetSince = isDayKey(s.budgetSince) ? s.budgetSince : null;
      st.onboarded = s.onboarded === true || (s.onboarded === undefined && out.wallets.length > 0);
      return out;
    } catch (e) {
      return defaultState();
    }
  }

  function validateBackup(obj) {
    let o = obj;
    if (typeof o === 'string') {
      try { o = JSON.parse(o); } catch (e) { return { ok: false, error: 'invalid_json' }; }
    }
    if (!isObj(o)) return { ok: false, error: 'not_object' };
    const looksLikeState = x => isObj(x) && (isObj(x.settings) || Array.isArray(x.wallets) || Array.isArray(x.transactions));
    const candidate = isObj(o.state) ? o.state : looksLikeState(o) ? o : null;
    if (!candidate || !looksLikeState(candidate)) return { ok: false, error: 'not_backup' };
    const v = toNum(candidate.version);
    if (isFinite(v) && v > 1) return { ok: false, error: 'unsupported_version' };
    if (candidate.wallets !== undefined && !Array.isArray(candidate.wallets)) return { ok: false, error: 'not_backup' };
    if (candidate.transactions !== undefined && !Array.isArray(candidate.transactions)) return { ok: false, error: 'not_backup' };
    return { ok: true, state: sanitizeState(candidate) };
  }

  // ---------- derived values ----------
  const txList = state => (state && Array.isArray(state.transactions) ? state.transactions : []);
  const stateCode = state => (state && state.settings ? cur(state.settings.currency).code : 'IDR');

  // asOfDay (optional 'YYYY-MM-DD'): leave out transactions dated after that day (scheduled ones).
  function walletBalances(state, asOfDay) {
    const bal = {};
    const ws = state && Array.isArray(state.wallets) ? state.wallets : [];
    ws.forEach(w => { if (w && w.id != null) bal[w.id] = Number(w.initialBalance) || 0; });
    const add = (id, v) => { if (id != null && hasOwn(bal, id)) bal[id] += v; };
    const cutoff = isDayKey(asOfDay) ? asOfDay : null;
    txList(state).forEach(t => {
      const a = Number(t && t.amount);
      if (!t || !isFinite(a)) return;
      if (cutoff && dayOf(t) > cutoff) return;
      switch (t.type) {
        case 'EXPENSE': add(t.walletId, -a); break;
        case 'INCOME': add(t.walletId, a); break;
        case 'TRANSFER': add(t.walletId, -a); add(t.toWalletId, a); break;
        case 'GOAL_IN': add(t.walletId, -a); break;
        case 'GOAL_OUT': add(t.walletId, a); break;
        default: break;
      }
    });
    const code = stateCode(state);
    Object.keys(bal).forEach(k => { bal[k] = roundMoney(bal[k], code); });
    return bal;
  }

  function goalBalances(state) {
    const out = {};
    (state && Array.isArray(state.goals) ? state.goals : []).forEach(g => { if (g && g.id != null) out[g.id] = 0; });
    txList(state).forEach(t => {
      if (!t || t.goalId == null || !hasOwn(out, t.goalId)) return;
      const a = Number(t.amount);
      if (!isFinite(a)) return;
      if (t.type === 'GOAL_IN') out[t.goalId] += a;
      else if (t.type === 'GOAL_OUT') out[t.goalId] -= a;
    });
    const code = stateCode(state);
    Object.keys(out).forEach(k => { out[k] = roundMoney(out[k], code); });
    return out;
  }

  // Deleting a goal never touches transactions: a goal that was used is only hidden (deleted: true),
  // so the money that moved through it stays where it went. An unused goal is removed outright.
  function deleteGoal(state, goalId) {
    const goals = state && Array.isArray(state.goals) ? state.goals : [];
    const used = txList(state).some(t => t && t.goalId === goalId);
    const next = Object.assign({}, state, {
      goals: used
        ? goals.map(g => (g && g.id === goalId ? Object.assign({}, g, { deleted: true }) : g))
        : goals.filter(g => !(g && g.id === goalId))
    });
    return { state: next, hidden: used };
  }

  function periodRange(today, startDay) {
    const p = parseDayKey(today);
    if (!p) return null;
    const t = dayKey(p.y, p.m, p.d);
    let sd = Math.trunc(Number(startDay));
    if (!isFinite(sd) || sd < 1) sd = 1;
    if (sd > 28) sd = 28;
    let sy = p.y, sm = p.m;
    if (p.d < sd) { sm -= 1; if (sm < 1) { sm = 12; sy -= 1; } }
    const start = dayKey(sy, sm, sd);
    let ny = sy, nm = sm + 1;
    if (nm > 12) { nm = 1; ny += 1; }
    const end = addDays(dayKey(ny, nm, sd), -1);
    return {
      start, end,
      daysTotal: diffDays(start, end) + 1,
      daysElapsed: diffDays(start, t),
      daysLeft: diffDays(t, end) + 1
    };
  }

  // largest-remainder rounding so percentages sum to exactly 100
  function percentages(values) {
    const total = values.reduce((a, b) => a + b, 0);
    if (!(total > 0)) return values.map(() => 0);
    const raw = values.map(v => (v / total) * 100);
    const floors = raw.map(Math.floor);
    let rest = 100 - floors.reduce((a, b) => a + b, 0);
    const order = raw.map((r, i) => ({ i, rem: r - Math.floor(r) })).sort((a, b) => b.rem - a.rem || a.i - b.i);
    for (let k = 0; k < order.length && rest > 0; k++, rest--) floors[order[k].i] += 1;
    return floors;
  }

  function budgetStats(state, today) {
    const s = (state && state.settings) || {};
    const code = cur(s.currency).code;
    const dec = cur(code).decimals;
    const budget = Number(s.monthlyBudget) > 0 ? Number(s.monthlyBudget) : 0;
    const t = isDayKey(today) ? today : String(today || '').slice(0, 10);
    const fullPeriod = periodRange(t, s.periodStartDay);
    // First period after the budget was set mid-period: count from that day with a prorated budget,
    // so days before the user started tracking are neither "saved" nor "spent".
    // If expenses were already logged earlier in the period, the user was tracking: no proration.
    let period = fullPeriod, budgetEff = budget, prorated = false;
    const since = isDayKey(s.budgetSince) ? s.budgetSince : null;
    const loggedBefore = d0 => txList(state).some(tx => tx && tx.type === 'EXPENSE' && dayOf(tx) >= fullPeriod.start && dayOf(tx) < d0);
    if (fullPeriod && budget > 0 && since && since > fullPeriod.start && since <= t && !loggedBefore(since)) {
      const daysTotal = diffDays(since, fullPeriod.end) + 1;
      period = { start: since, end: fullPeriod.end, daysTotal, daysElapsed: diffDays(since, t), daysLeft: fullPeriod.daysLeft };
      budgetEff = budget * daysTotal / fullPeriod.daysTotal;
      prorated = true;
    }
    let spentPeriod = 0, spentToday = 0, spentLater = 0, reservedToday = 0, incomePeriod = 0, txCount = 0;
    const byCat = {};
    if (period) {
      txList(state).forEach(tx => {
        const d = dayOf(tx);
        if (!d || d < period.start || d > period.end) return;
        const a = Number(tx.amount);
        if (!isFinite(a)) return;
        txCount++;
        if (tx.type === 'INCOME') incomePeriod += a;
        if (tx.type !== 'EXPENSE') return;
        spentPeriod += a;
        if (d === t) {
          spentToday += a;
          // logged on an earlier day for today (e.g. rent entered last week): already set aside
          const made = String(tx.createdAt || '').slice(0, 10);
          if (isDayKey(made) && made < t) reservedToday += a;
        } else if (d > t) spentLater += a;
        const cat = isExpenseCat(tx.category) ? tx.category : 'other';
        byCat[cat] = (byCat[cat] || 0) + a;
      });
    }
    spentPeriod = roundTo(spentPeriod, dec);
    spentToday = roundTo(spentToday, dec);
    spentLater = roundTo(spentLater, dec);
    reservedToday = roundTo(reservedToday, dec);
    // Only days before today. Scheduled expenses (later this period, or logged in advance for today)
    // are set aside from the pool, so they never show up as sudden overspending on their day.
    const spentBeforeToday = roundTo(spentPeriod - spentToday - spentLater, dec);
    const committed = spentBeforeToday + reservedToday + spentLater;
    const daysLeft = period ? Math.max(1, period.daysLeft) : 1;
    const daysTotal = period ? period.daysTotal : 30;
    const f = Math.pow(10, dec);
    const dailyAllowance = Math.max(0, Math.floor(parseFloat((((budgetEff - committed) / daysLeft) * f).toPrecision(15))) / f);
    const idealDailyRaw = budgetEff / daysTotal;
    const order = CATEGORIES.expense.map(c => c.id);
    const cats = Object.keys(byCat).map(id => ({ category: id, amount: roundTo(byCat[id], dec) }))
      .sort((a, b) => b.amount - a.amount || order.indexOf(a.category) - order.indexOf(b.category));
    const pcts = percentages(cats.map(c => c.amount));
    cats.forEach((c, i) => { c.pct = pcts[i]; });
    return {
      budget: roundTo(budgetEff, dec),
      monthlyBudget: roundTo(budget, dec),
      prorated,
      fullPeriod,
      hasBudget: budget > 0,
      period,
      spentPeriod,
      spentToday,
      spentBeforeToday,
      remaining: roundTo(budgetEff - spentPeriod, dec),
      dailyAllowance,
      spentLater,
      reservedToday,
      safeToday: roundTo(dailyAllowance - (spentToday - reservedToday), dec),
      idealDaily: roundTo(idealDailyRaw, dec),
      // ideal pace so far minus everything already spent or set aside; > 0 "Hemat", < 0 "Boros".
      // Same sign as (dailyAllowance - idealDaily), so the tag never contradicts the hero number.
      rollover: roundTo(idealDailyRaw * (period ? period.daysElapsed : 0) - committed, dec),
      byCategory: cats,
      incomePeriod: roundTo(incomePeriod, dec),
      txCount
    };
  }

  function streak(state, today) {
    const s = (state && state.settings) || {};
    const t = isDayKey(today) ? today : null;
    const empty = { current: 0, best: 0, todayLogged: false, grid: [] };
    if (!t) return empty;
    const logged = new Set();
    const count = {}, spent = {};
    txList(state).forEach(tx => {
      const d = dayOf(tx);
      if (!isDayKey(d) || d > t) return;
      logged.add(d);
      count[d] = (count[d] || 0) + 1;
      if (tx.type === 'EXPENSE') spent[d] = (spent[d] || 0) + (Number(tx.amount) || 0);
    });
    (Array.isArray(s.noSpendDays) ? s.noSpendDays : []).forEach(d => { if (isDayKey(d) && d <= t) logged.add(d); });
    const todayLogged = logged.has(t);
    let current = 0;
    let d = todayLogged ? t : addDays(t, -1);
    while (logged.has(d)) { current++; d = addDays(d, -1); }
    let best = 0, run = 0, prev = null;
    Array.from(logged).sort().forEach(k => {
      run = prev && diffDays(prev, k) === 1 ? run + 1 : 1;
      if (run > best) best = run;
      prev = k;
    });
    best = Math.max(best, current);
    const budget = Number(s.monthlyBudget) > 0 ? Number(s.monthlyBudget) : 0;
    const grid = [];
    for (let i = 27; i >= 0; i--) {
      const day = addDays(t, -i);
      let level = 0;
      if (logged.has(day)) {
        level = 1;
        if (!budget) level = 2;
        else {
          const p = periodRange(day, s.periodStartDay);
          if ((spent[day] || 0) <= budget / p.daysTotal) level = 2;
        }
      }
      grid.push({ day, level, count: count[day] || 0 });
    }
    return { current, best, todayLogged, grid };
  }

  const txSort = (a, b) => {
    const da = String(a.date || ''), db = String(b.date || '');
    if (da !== db) return da < db ? 1 : -1;
    const ca = String(a.createdAt || ''), cb = String(b.createdAt || '');
    if (ca !== cb) return ca < cb ? 1 : -1;
    return 0;
  };

  function groupByDay(transactions) {
    const list = (Array.isArray(transactions) ? transactions : []).filter(t => t && typeof t.date === 'string').slice();
    list.sort(txSort);
    const out = [];
    list.forEach(t => {
      const d = t.date.slice(0, 10);
      const g = out[out.length - 1];
      if (g && g.day === d) g.items.push(t); else out.push({ day: d, items: [t] });
    });
    return out;
  }

  function filterTransactions(state, opts) {
    const o = opts || {};
    const wallets = {};
    (state && Array.isArray(state.wallets) ? state.wallets : []).forEach(w => { if (w) wallets[w.id] = w.name || ''; });
    const goals = {};
    (state && Array.isArray(state.goals) ? state.goals : []).forEach(g => { if (g) goals[g.id] = g.name || ''; });
    // Amount-aware search: "Rp 25.000", "25rb", "25k" find a 25000 transaction.
    const code = stateCode(state);
    const terms = [];
    String(o.query || '').replace(/\b(rp|idr)\.?\s+(?=\d)/gi, '$1').split(/\s+/).filter(Boolean).forEach(raw => {
      const norm = normalizeText(raw);
      if (!norm || norm === 'rp' || norm === 'idr') return;
      const amt = /\d/.test(raw) ? parseAmountInput(raw, code) : null;
      terms.push({ text: norm, amount: amt });
    });
    const type = typeof o.type === 'string' ? o.type.toUpperCase() : '';
    const out = txList(state).filter(t => {
      if (!t) return false;
      if (o.walletId && t.walletId !== o.walletId && t.toWalletId !== o.walletId) return false;
      if (type && type !== 'ALL') {
        if (type === 'TRANSFER') { if (['TRANSFER', 'GOAL_IN', 'GOAL_OUT'].indexOf(t.type) < 0) return false; } else if (type === 'GOAL') { if (t.type !== 'GOAL_IN' && t.type !== 'GOAL_OUT') return false; } else if (t.type !== type) return false;
      }
      if (o.month && String(t.date || '').slice(0, 7) !== o.month) return false;
      if (terms.length) {
        const cat = categoryById(t.category);
        const hay = ' ' + normalizeText([t.title, t.note, cat.label.id, cat.label.en, wallets[t.walletId], wallets[t.toWalletId], goals[t.goalId], String(t.amount)].join(' ')) + ' ';
        const amt = Number(t.amount);
        if (!terms.every(term => hay.indexOf(term.text) >= 0 || (term.amount !== null && Math.abs(amt - term.amount) < 0.005))) return false;
      }
      return true;
    });
    return out.sort(txSort);
  }

  const TYPE_LABELS = {
    id: { EXPENSE: 'Pengeluaran', INCOME: 'Pemasukan', TRANSFER: 'Transfer', GOAL_IN: 'Setor target', GOAL_OUT: 'Tarik target' },
    en: { EXPENSE: 'Expense', INCOME: 'Income', TRANSFER: 'Transfer', GOAL_IN: 'Goal deposit', GOAL_OUT: 'Goal withdrawal' }
  };
  const CSV_HEAD = {
    id: ['Tanggal', 'Tipe', 'Judul', 'Kategori', 'Wallet', 'Ke Wallet/Target', 'Jumlah', 'Catatan'],
    en: ['Date', 'Type', 'Title', 'Category', 'Wallet', 'To Wallet/Goal', 'Amount', 'Note']
  };
  function csvCell(v, text) {
    let s = v == null ? '' : String(v);
    if (text && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function toCSV(state, lang) {
    const L = langOf(lang);
    const code = stateCode(state);
    const dec = cur(code).decimals;
    const wallets = {}, goals = {};
    (state && Array.isArray(state.wallets) ? state.wallets : []).forEach(w => { if (w) wallets[w.id] = w.name; });
    (state && Array.isArray(state.goals) ? state.goals : []).forEach(g => { if (g) goals[g.id] = g.name; });
    const rows = [CSV_HEAD[L].map(h => csvCell(h, true)).join(',')];
    txList(state).filter(t => t && typeof t.date === 'string').slice().sort((a, b) => -txSort(a, b)).forEach(t => {
      const other = t.type === 'TRANSFER' ? wallets[t.toWalletId] : (t.type === 'GOAL_IN' || t.type === 'GOAL_OUT') ? goals[t.goalId] : '';
      rows.push([
        csvCell(t.date.replace('T', ' '), true),
        csvCell(TYPE_LABELS[L][t.type] || t.type, true),
        csvCell(t.title || '', true),
        csvCell(categoryById(t.category).label[L], true),
        csvCell(wallets[t.walletId] || '', true),
        csvCell(other || '', true),
        csvCell(roundTo(Number(t.amount) || 0, dec).toFixed(dec), false),
        csvCell(t.note || '', true)
      ].join(','));
    });
    return '﻿' + rows.join('\r\n') + '\r\n';
  }

  return {
    VERSION, TX_TYPES, SOURCES, WALLET_COLORS, CURRENCIES, CATEGORIES,
    uid, pad2, dayKey, addDays, diffDays, daysInMonth, isDayKey,
    formatMoney, formatCompact, parseAmountInput, roundMoney, normalizeText,
    categoryById, categorize,
    parseEntry, parseStatement, extractReceipt, extractPayment, extractFromImageText,
    defaultState, sanitizeState, validateBackup,
    walletBalances, goalBalances, deleteGoal, periodRange, budgetStats, streak, MAX_AMOUNT,
    groupByDay, filterTransactions, toCSV
  };
})();

    const now = Date.now();

      const dayExp = roundAmt(all.reduce((a, x) => a + (x.type === 'EXPENSE' ? num(x.amount) : 0), 0));
      html += '<div class="day-header"><span>' + esc(dayLabel(g.day)) + '</span>' +
        (dayExp > 0 ? '<span class="day-total">' + esc(fmt(-dayExp)) + '</span>' : '') + '</div>' +
        items.map(txRowHtml).join('');
    }
    return { html, count };
  }

  function renderRecap(stats, period, st, budget) {
    const spent = num(stats.spentPeriod);
    const win = stats.prorated && stats.period ? stats.period : period;
    const range = esc(periodRangeText(win));
    const shownBudget = stats.prorated ? num(stats.budget) : budget;
    $('recapSub').innerHTML = budget > 0
      ? tHtml('recap.subBudget', { range, spent: '<strong>' + esc(fmt(spent)) + '</strong>', budget: '<strong>' + esc(fmt(shownBudget)) + '</strong>' })
      : tHtml('recap.sub', { range, spent: '<strong>' + esc(fmt(spent)) + '</strong>' });
    const cats = Array.isArray(stats.byCategory) ? stats.byCategory.filter((c) => c && num(c.amount) > 0) : [];
    if (!cats.length) {
      $('recapTop').textContent = '';
      $('recapBar').innerHTML = '';
      $('recapChips').innerHTML = '<p class="recap-empty">' + T('recap.empty') + '</p>';
    } else {
      const sum = cats.reduce((a, c) => a + num(c.amount), 0) || 1;
      $('recapTop').textContent = t('recap.top', { cat: catLabel(cats[0].category), pct: num(cats[0].pct) });
      $('recapBar').innerHTML = cats.map((c) => '<div class="recap-seg" style="flex:' + (num(c.amount) / sum * 100).toFixed(3) + ' 1 0;background:' + catColor(c.category) + '"></div>').join('');
      $('recapChips').innerHTML = cats.map((c) => '<span class="recap-chip"><span class="recap-dot" style="background:' + catColor(c.category) + '"></span><span class="recap-name">' +
        esc(catLabel(c.category)) + '</span><strong>' + esc(fmtC(c.amount)) + '</strong><em>' + esc(String(num(c.pct))) + '%</em></span>').join('');
    }

    const grid = Array.isArray(st.grid) ? st.grid : [];
    $('streakBadge').textContent = t('streak.badge', { n: num(st.current), best: num(st.best) });
    $('streakBadge').classList.toggle('zero', !num(st.current));
    $('ghGrid').setAttribute('aria-label', t('streak.gridAria', { n: num(st.current) }));
    $('ghGrid').innerHTML = grid.map((c) => {
      const lvl = c.level === 2 ? ' lvl-2' : (c.level === 1 ? ' lvl-1' : '');
      const date = dayLabel(c.day);
      const tip = num(c.count) > 0 ? t('streak.cell', { date, n: num(c.count) }) : (c.level > 0 ? t('streak.cellNoSpend', { date }) : t('streak.cellEmpty', { date }));
      return '<div class="gh-cell' + lvl + (c.day === today ? ' today' : '') + '" title="' + esc(tip) + '"></div>';
    }).join('');

    const btn = $('noSpendBtn');
    const marked = Array.isArray(S().noSpendDays) && S().noSpendDays.includes(today);
    btn.hidden = num(stats.spentToday) > 0;
    btn.classList.toggle('on', marked);
    btn.setAttribute('aria-pressed', String(marked));
    btn.textContent = t(marked ? 'nospend.on' : 'nospend.mark');
  }

  function validParsed(p) {
    if (!p || !(num(p.amount) > 0)) return false;
    if (!['EXPENSE', 'INCOME', 'TRANSFER'].includes(p.type)) return false;
    const w = walletById(p.walletId);
    if (!w || w.archived) return false;
    if (p.type === 'TRANSFER') { const to = walletById(p.toWalletId); return !!to && !to.archived && p.toWalletId !== p.walletId; }
    return true;
  }
  function parseCaption(text) {
    if (!text.trim() || !activeWallets().length) return [];
    const r = safe(() => Core.parseEntry(text, { wallets: activeWallets(), defaultWalletId: defaultWalletId(), currency: cur(), lang: lang(), today }), []);
    return Array.isArray(r) ? r.filter(validParsed) : [];
  }
  function parsedChipHtml(p, i) {
    const who = p.type === 'TRANSFER' ? walletName(p.walletId) + ' → ' + walletName(p.toWalletId) : walletName(p.walletId);
    const cls = p.type === 'INCOME' ? '' : (p.type === 'TRANSFER' ? ' mute' : ' exp');
    const amt = p.type === 'INCOME' ? fmtSigned(p.amount) : fmt(p.amount);
    const title = clampStr(p.title, 80) || (p.type === 'TRANSFER' ? t('type.TRANSFER') : catLabel(p.category));
    const day = isDayKey(p.dayKey) && p.dayKey !== today ? '<span class="pt-day">' + esc(dayLabel(p.dayKey)) + '</span>' : '';
    return '<span class="parsed-tag"><span class="pt-text"><span class="pt-title">' + esc(title) + '</span><span class="pt-wallet">' + esc(who) + '</span></span>' + day +
      '<span class="pt-amt' + cls + '">' + esc(amt) + '</span>' +
      '<button type="button" class="chip-x" data-action="drop-parsed" data-idx="' + i + '" aria-label="' + T('catat.dropAria', { title }) + '">' + ICON.close + '</button></span>';
  }
  // A payment screen's text (Live Text, a Shortcut, a copied notification) typed or dictated into the box:
  // one chip for it instead of one guess per line; saving opens the review sheet.
  function shotChipHtml(r) {
    const amt = r.type === 'INCOME' ? fmtSigned(r.amount) : fmt(r.amount);
    const title = clampStr(r.title, 80);
    return '<span class="parsed-tag shot-tag"><span class="pt-icon" aria-hidden="true">' + ICON.shot + '</span>' +
      '<span class="pt-text"><span class="pt-title">' + esc(title || t('catat.shotFound')) + '</span><span class="pt-wallet">' + T('catat.shotFound') + '</span></span>' +
      '<span class="pt-amt' + (r.type === 'INCOME' ? '' : (r.type === 'TRANSFER' ? ' mute' : ' exp')) + '">' + esc(amt) + '</span></span>';
  }
  function autoGrow(el) {
    // measured only while visible (a hidden Catat view has no height): switchTab calls this again
    if (!el.offsetParent) return;
    el.style.height = 'auto';
    // scrollHeight leaves out the border; add it so the last line is never cut off
    el.style.height = Math.min(140, Math.max(el.scrollHeight + el.offsetHeight - el.clientHeight, 48)) + 'px';
  }
  function updatePreview() {
    const text = $('captionInput').value;
    autoGrow($('captionInput'));
    const shot = screenFromText(text, false);
    ui.shot = shot;
    const items = shot ? [] : parseCaption(text);
    ui.parsed = items;
    const kept = items.filter((_, i) => !ui.dropped.has(i));
    let html = '';
    if (text.trim() && !activeWallets().length) html = '<span class="parsed-tag hint">' + T('catat.needWallet') + '</span>';
    else if (shot) html = shotChipHtml(shot);
    else if (text.trim() && !items.length) html = '<span class="parsed-tag hint">' + T('catat.hintAmount') + '</span>';
    else html = items.map((p, i) => ui.dropped.has(i) ? '' : parsedChipHtml(p, i)).join('');
    $('parsedPreview').innerHTML = html;
    const commitBtn = $('commitBtn');
    if (shot) {
      commitBtn.textContent = ui.recording ? t('voice.listening') : t('catat.shotOpen', { amount: shot.type === 'INCOME' ? fmtSigned(shot.amount) : fmt(shot.amount) });
      commitBtn.disabled = ui.recording;
      commitBtn.classList.toggle('waiting', ui.recording);
      commitBtn.title = '';
      commitBtn.hidden = false;
      $('examples').hidden = true;
    } else if (kept.length) {
      // never add income, spending and transfers into one number
      const sum = parsedSummary(kept);
      commitBtn.textContent = ui.recording ? t('voice.listening') : (sum.single ? t('catat.save', { n: kept.length, total: sum.single }) : t('catat.saveMixed', { n: kept.length }));
      commitBtn.disabled = ui.recording;
      commitBtn.classList.toggle('waiting', ui.recording);
      commitBtn.title = sum.single ? '' : sum.parts;
      commitBtn.hidden = false;
      $('examples').hidden = true;
    } else {
      commitBtn.hidden = true;
      $('examples').hidden = false;
    }
    const waving = ui.recording || text.trim().length > 0;
    $('waveLeft').classList.toggle('active', waving);
    $('waveRight').classList.toggle('active', waving);
  }

  // Totals of parsed items per type: one signed figure when all share a type, else "Keluar X · Masuk Y".
  function parsedSummary(items) {
    const by = { EXPENSE: 0, INCOME: 0, TRANSFER: 0 };
    items.forEach((p) => { if (by[p.type] !== undefined) by[p.type] = roundAmt(by[p.type] + num(p.amount)); });
    const types = Object.keys(by).filter((k) => by[k] > 0);
    const parts = [];
    if (by.EXPENSE > 0) parts.push(t('catat.sumOut', { amount: fmt(by.EXPENSE) }));
    if (by.INCOME > 0) parts.push(t('catat.sumIn', { amount: fmt(by.INCOME) }));
    if (by.TRANSFER > 0) parts.push(t('catat.sumTr', { amount: fmt(by.TRANSFER) }));
    let single = null;
    if (types.length === 1) single = types[0] === 'INCOME' ? fmtSigned(by.INCOME) : fmt(by[types[0]]);
    return { single, parts: parts.join(' · ') };
  }

  // ---------- Render: Wallet tab ----------
  function goalNeed(g, saved) {
    if (!g.deadline || !isDayKey(g.deadline)) return null;
    const remaining = num(g.target) - saved;
    if (remaining <= 0) return { done: true };
    const days = num(safe(() => Core.diffDays(today, g.deadline), 0));
    if (days < 0) return { overdue: true, remaining };
    const months = Math.max(1, Math.round(days / 30.4375));
    const f = Math.pow(10, curDecimals());
    return { perMonth: Math.ceil(parseFloat((remaining / months * f).toPrecision(12))) / f, months };
  }
  function goalFootHtml(g, saved) {
    const target = num(g.target);
    const need = goalNeed(g, saved);
    if ((need && need.done) || (!need && target > 0 && saved >= target)) return '<span class="ok">' + T('goal.reached') + '</span>';
    if (need && need.overdue) return '<span class="late">' + T('goal.overdue', { amount: fmt(need.remaining) }) + '</span>';
    if (need) return '<span>' + T('goal.perMonth', { amount: fmt(need.perMonth) }) + '</span>';
    return '';
  }
  const goalPct = (saved, target) => target > 0 ? Math.max(0, Math.min(100, Math.round(saved / target * 100))) : 0;
  function goalCardHtml(g, saved) {
    const target = num(g.target);
    const pct = goalPct(saved, target);
    const foot = goalFootHtml(g, saved);
    const deadline = g.deadline && isDayKey(g.deadline) ? '<span>' + T('goal.deadlineOn', { date: dateLabel(g.deadline) }) + '</span>' : '';
    return '<button type="button" class="goal-item-card" data-action="goal-open" data-id="' + esc(g.id) + '">' +
      '<span class="goal-meta"><span class="g-name">' + esc(g.name) + '</span><span class="g-amt">' + esc(fmtC(saved)) + ' / ' + esc(fmtC(target)) + ' (' + pct + '%)</span></span>' +
      '<span class="bar-track" style="display:block"><span class="bar-fill" style="display:block;width:' + pct + '%"></span></span>' +
      (foot || deadline ? '<span class="goal-foot">' + (foot || '<span></span>') + deadline + '</span>' : '') + '</button>';
  }
  function renderWallet() {
    const bal = balances();
    const gs = goalSaved();
    const act = activeWallets();
    const arch = state.wallets.filter((w) => w.archived);
    const total = roundAmt(act.reduce((a, w) => a + num(bal[w.id]), 0));
    const inGoals = roundAmt(state.goals.reduce((a, g) => a + num(gs[g.id]), 0));
    const tEl = $('wtTotal');
    tEl.textContent = fmt(total);
    tEl.classList.toggle('neg', total < 0);
    $('wtGoalsSub').innerHTML = tHtml('wtab.inGoals', { amount: '<strong>' + esc(fmt(inGoals)) + '</strong>' });
    const def = defaultWalletId();
    const row = (w) => {
      const b = num(bal[w.id]);
      return '<button type="button" class="wallet-row-card' + (w.archived ? ' archived' : '') + '" data-action="wallet-open" data-id="' + esc(w.id) + '">' +
        '<span class="wallet-row-left"><span class="ob-wallet-dot" style="background:' + safeColor(w.color) + '"></span><span class="wr-name">' + esc(w.name) + '</span>' +
        (w.id === def && !w.archived ? '<span class="badge green">' + T('wallet.defaultBadge') + '</span>' : '') + '</span>' +
        '<span class="wallet-row-bal' + (b < 0 ? ' neg' : '') + '">' + esc(fmt(b)) + '</span></button>';
    };
    $('wtWallets').innerHTML = act.length ? act.map(row).join('') : '<p class="muted-note">' + T('wallet.none') + '</p>';
    $('wtArchived').innerHTML = arch.length
      ? '<button type="button" class="archived-toggle" data-action="toggle-archived" aria-expanded="' + ui.archivedOpen + '">' + ICON.chevR + '<span>' + T('wallet.archivedGroup', { n: arch.length }) + '</span></button>' +
        (ui.archivedOpen ? '<div class="wallet-list-vertical" style="margin-top:8px">' + arch.map(row).join('') + '</div>' : '')
      : '';
    const goals = liveGoals();
    $('wtGoals').innerHTML = goals.length
      ? goals.map((g) => goalCardHtml(g, num(gs[g.id]))).join('')
      : '<p class="muted-note">' + T('wtab.noGoals') + '</p>';
  }

  // ---------- Bottom sheets (stacked modal dialogs inside the app frame) ----------
  const sheets = [];
  let sheetSeq = 0;
  const topSheet = () => sheets[sheets.length - 1] || null;
  function setInert(el, on) {
    if (!el) return;
    el.inert = on;
    if (on) { el.setAttribute('inert', ''); el.setAttribute('aria-hidden', 'true'); } else { el.removeAttribute('inert'); el.removeAttribute('aria-hidden'); }
  }
  function syncModalState() {
    const obOpen = !$('onboarding').hidden;
    const any = sheets.length > 0;
    setInert($('appMain'), any || obOpen);
    setInert($('onboarding'), any && obOpen);
    sheets.forEach((s, i) => setInert(s.layer, i < sheets.length - 1));
    appEl.classList.toggle('sheet-open', any);
    appEl.classList.toggle('ob-open', obOpen);
  }
  function focusEl(el) { if (!el) return; try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); } }
  // A double tap must not land on whatever appears under the finger after a sheet opens/closes or a save.
  function guardTaps(ms) { ui.ignoreClicksUntil = Math.max(ui.ignoreClicksUntil, performance.now() + (ms || 400)); }

  // Android/browser Back closes the top sheet instead of leaving the app: one history entry
  // stands for "a sheet is open" (synced after the current task, so close+open in one go is a no-op).
  const hist = { armed: false, skip: 0, timer: 0, skipTimer: 0 };
  function syncHistory() {
    clearTimeout(hist.timer);
    hist.timer = setTimeout(() => {
      const want = sheets.length > 0;
      try {
        if (want && !hist.armed) { history.pushState({ moneyappSheet: true }, ''); hist.armed = true; } else if (!want && hist.armed) {
          hist.armed = false;
          hist.skip++;
          clearTimeout(hist.skipTimer);
          hist.skipTimer = setTimeout(() => { hist.skip = 0; }, 1500);
          history.back();
        }
      } catch (_) { /* history not available here */ }
    }, 0);
  }
  window.addEventListener('popstate', () => {
    if (hist.skip > 0) { hist.skip--; return; }
    if (!hist.armed) return;
    hist.armed = false;
    const top = topSheet();
    if (top) closeSheet(top);
  });

  // Drag the handle or header down to dismiss.
  function enableSwipe(entry) {
    const sheet = entry.el;
    const inZone = (t) => !!t.closest('.sheet-grab, .sheet-head') && !t.closest('button, a, input, select, textarea');
    let startY = 0, lastY = 0, lastT = 0, vel = 0, id = null;
    sheet.addEventListener('pointerdown', (e) => {
      if (id !== null || (e.pointerType === 'mouse' && e.button !== 0) || !inZone(e.target)) return;
      id = e.pointerId; startY = lastY = e.clientY; lastT = performance.now(); vel = 0;
      try { sheet.setPointerCapture(id); } catch (_) { /* ignore */ }
      sheet.style.animation = 'none';
      sheet.style.transition = 'none';
    });
    sheet.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      const now = performance.now();
      vel = (e.clientY - lastY) / Math.max(1, now - lastT);
      lastY = e.clientY; lastT = now;
      sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
    });
    const end = (e) => {
      if (e.pointerId !== id) return;
      id = null;
      const dy = Math.max(0, lastY - startY);
      sheet.style.transition = '';
      if (!entry.closed && (dy > 120 || (vel > 0.5 && dy > 30))) { entry.layer.classList.add('swiped'); closeSheet(entry); return; }
      sheet.style.transform = '';
    };
    sheet.addEventListener('pointerup', end);
    sheet.addEventListener('pointercancel', end);
  }

  function openSheet(cfg) {
    const existing = sheets.find((s) => s.id === cfg.id);
    if (existing) closeSheet(existing, true);
    // the update notice would sit over the sheet's header (toasts move to the top while a sheet is open); it comes
    // back, or the app reloads, once the sheets are closed
    if (document.querySelector('#toastHost .toast[data-kind="update"]')) hideToast();
    const n = ++sheetSeq;
    const titleId = 'sheetTitle' + n;
    const layer = document.createElement('div');
    layer.className = 'sheet-layer' + (cfg.cls ? ' ' + cfg.cls : '');
    layer.innerHTML = '<div class="sheet-backdrop" data-action="sheet-dismiss"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + titleId + '" tabindex="-1">' +
      '<div class="sheet-grab" aria-hidden="true"></div>' +
      '<div class="sheet-head"><h2 class="sheet-title" id="' + titleId + '">' + esc(cfg.title || '') + '</h2>' +
      '<button type="button" class="sheet-close" data-action="sheet-dismiss" aria-label="' + T('a11y.close') + '">' + ICON.close + '</button></div>' +
      '<div class="sheet-body">' + (cfg.body || '') + '</div><div class="sheet-foot">' + (cfg.foot || '') + '</div></div>';
    $('sheetRoot').appendChild(layer);
    const entry = {
      id: cfg.id, layer, el: layer.querySelector('.sheet'), body: layer.querySelector('.sheet-body'),
      foot: layer.querySelector('.sheet-foot'), titleEl: layer.querySelector('.sheet-title'),
      actions: cfg.actions || {}, onClose: cfg.onClose, update: cfg.update, closed: false,
      returnFocus: document.activeElement
    };
    entry.q = (sel) => layer.querySelector(sel);
    entry.qa = (sel) => Array.from(layer.querySelectorAll(sel));
    sheets.push(entry);
    syncModalState();
    focusEl((cfg.focus && layer.querySelector(cfg.focus)) || entry.el);
    enableSwipe(entry);
    guardTaps(320);
    syncHistory();
    return entry;
  }
  function closeSheet(entry, immediate) {
    entry = entry || topSheet();
    if (!entry || entry.closed) return;
    entry.closed = true;
    const i = sheets.indexOf(entry);
    if (i >= 0) sheets.splice(i, 1);
    try { if (entry.onClose) entry.onClose(); } catch (e) { console.error(e); }
    const layer = entry.layer;
    if (immediate || reducedMotion()) layer.remove();
    else {
      // a sheet that was dragged (and sprang back) gets its closing animation back
      if (!layer.classList.contains('swiped')) entry.el.style.animation = '';
      layer.classList.add('closing'); layer.style.pointerEvents = 'none'; setTimeout(() => layer.remove(), 200);
    }
    guardTaps(320);
    syncHistory();
    syncModalState();
    const rf = entry.returnFocus;
    if (rf && rf.isConnected && !rf.closest('[inert]') && !rf.closest('[hidden]') && typeof rf.focus === 'function') focusEl(rf);
